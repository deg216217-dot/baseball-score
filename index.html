<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>⚾ 少年野球スコア記録アプリ</title>
<meta property="og:title" content="少年野球スコアボード補助アプリ">
<meta property="og:description" content="少年野球のスコア記録をスマホで補助するアプリです。">
<meta property="og:image" content="https://deg216217-dot.github.io/baseball-score/ogp.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deg216217-dot.github.io/baseball-score/">
<meta property="og:site_name" content="少年野球スコアボード補助アプリ">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  /* ── フォントサイズスケール（5段階 + 特殊）── */
  --fs-xs:10px;  /* バッジ・注釈 */
  --fs-sm:12px;  /* 補助テキスト・サブラベル */
  --fs-md:14px;  /* 本文・ボタンラベル */
  --fs-lg:16px;  /* 見出し・強調 */
  --fs-xl:20px;  /* 大見出し・シンボル */
  --fs-2xl:24px; /* スコア数字 */
  --fs-hero:52px;/* チェンジ演出 */

  /* ── 役割別カラー（7色）── */
  --navy:#0f1f3d;--navy2:#1a3a6e;
  --c-out:#455a64;        /* アウト系 — ブルーグレー */
  --c-hit:#2e7d32;        /* ヒット系 — 緑 */
  --c-reach:#0277bd;      /* 出塁系  — 青 */
  --c-runner:#37474f;     /* 走者系  — 暗グレー */
  --c-danger:#e65100;     /* 取消・警告 — オレンジ */
  --c-change:#455a64;     /* チェンジ  — スレートグレー */
  --c-special:#6a1b9a;    /* 紫 — 特殊記号・振逃 */
  --purple:#6a1b9a;       /* 後方互換 */
  /* ── 維持 ── */
  --red:#e53935;--green:#1b7a3e;--bg:#f4f6f9;--white:#fff;--gray:#555;
}
html,body{height:100%;font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);}
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}

/* ===フッター 表=青 裏=赤=== */
.bottom-bar{flex-shrink:0;color:#fff;padding:5px 10px 6px;box-shadow:0 -3px 16px rgba(0,0,0,.3);transition:background .5s;}
.bottom-bar.top-side{background:linear-gradient(to top,#0a1628,#1a3a6e);}
.bottom-bar.bottom-side{background:linear-gradient(to top,#1a0a0a,#7b1a2a);}

/* フッター上段：打者情報＋ダイヤモンド＋スコア＋カウント */
.footer-main{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
/* 左：イニング＋アウト */
.footer-inn{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:38px;}
.inning-half-tag{font-size:13px;font-weight:bold;padding:1px 5px;border-radius:20px;white-space:nowrap;}
.top-side .inning-half-tag{background:#ff8a80;color:#1a3a6e;}
.bottom-side .inning-half-tag{background:#ffb3ba;color:#7b1a2a;}
.inning-num{font-size:var(--fs-lg);font-weight:900;line-height:1;}
.out-area{display:flex;align-items:center;gap:2px;}
.out-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);}
.out-dot.on{background:#ff5252;}.out-dot.off{background:rgba(255,255,255,.18);}
/* 中左：打者＋ダイヤモンド */
.footer-batter{flex:1;min-width:0;display:flex;align-items:center;gap:5px;}
.footer-batter-info{flex:1;min-width:0;}
.footer-batter-name{font-size:var(--fs-md);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.footer-batter-sub{font-size:var(--fs-sm);color:rgba(255,255,255,.85);white-space:nowrap;}
.footer-pitch-seq{display:flex;flex-wrap:nowrap;gap:2px;margin-top:2px;overflow:hidden;max-width:80px;}
/* 中右：スコア */
.footer-score{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.footer-score-team{text-align:center;}
.footer-score-name{font-size:var(--fs-sm);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.footer-score-num{font-size:var(--fs-2xl);font-weight:900;line-height:1;}
.footer-score-num.away{color:#ff8a80;}.footer-score-num.home{color:#80d8ff;}
.footer-score-sep{font-size:var(--fs-sm);color:rgba(255,255,255,.85);}
.footer-score-team.batting .footer-score-name{opacity:1;}
.footer-score-team.batting .footer-score-num{text-shadow:0 0 8px rgba(255,255,255,.4);}
/* カウントドット */
.footer-count{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.count-row{display:flex;align-items:center;gap:2px;}
.count-label{font-size:var(--fs-sm);color:rgba(255,255,255,.9);width:8px;}
.cdot{width:10px;height:10px;border-radius:50%;}
.cdot-B.on{background:#ffeb3b;}.cdot-B.off{background:rgba(255,255,255,.15);}
.cdot-S.on{background:#ff8a80;}.cdot-S.off{background:rgba(255,255,255,.15);}
/* ユーティリティボタン行 */
.bb-utils{display:flex;gap:4px;margin-bottom:3px;}
.bb-util-btn{flex:1;border:none;border-radius:7px;padding:7px 3px;font-size:var(--fs-sm);font-weight:bold;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:36px;display:flex;align-items:center;justify-content:center;}
.bb-util-btn:active{background:rgba(255,255,255,.28);}
/* タブ */
.tabs{display:flex;border-top:1px solid rgba(255,255,255,.1);}
.tab-btn{flex:1;padding:8px 0;border:none;background:none;color:rgba(255,255,255,.85);cursor:pointer;font-size:var(--fs-sm);font-weight:bold;border-top:2px solid transparent;transition:all .15s;min-height:44px;}
.tab-btn.active{color:#fff;border-top:2px solid #ff8a80;}

/* ===チェンジ演出=== */
.change-overlay{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:changeAnim 1.6s ease forwards;pointer-events:none;}
@keyframes changeAnim{0%{opacity:0;transform:scale(.85);}15%{opacity:1;transform:scale(1.05);}70%{opacity:1;}100%{opacity:0;transform:scale(1.1);}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px #ff8a80;}50%{box-shadow:0 0 0 5px rgba(255,138,128,.3);}}
.change-overlay.to-top{background:linear-gradient(135deg,rgba(10,22,40,.9),rgba(26,58,110,.9));}
.change-overlay.to-bottom{background:linear-gradient(135deg,rgba(26,10,10,.9),rgba(123,26,42,.9));}
.change-big{font-size:var(--fs-hero);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5);}
.change-sub{font-size:var(--fs-lg);margin-top:8px;color:rgba(255,255,255,.9);font-weight:bold;}
.change-inn{font-size:var(--fs-sm);margin-top:4px;color:rgba(255,255,255,.9);}

/* ===カード=== */
.card{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:5px;}
.card-label{font-size:var(--fs-md);color:var(--gray);font-weight:bold;margin-bottom:6px;letter-spacing:0;display:flex;align-items:center;gap:5px;}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--navy2);color:#fff;font-size:var(--fs-sm);font-weight:bold;flex-shrink:0;}
/* 走者エリア：走者なし時にdimmed */
.runner-section.no-runners .runner-grid{opacity:.38;pointer-events:none;}
.runner-section.no-runners .section-label{opacity:.5;}
.runner-section.no-runners::after{content:"走者がいるときに使用";display:block;font-size:var(--fs-sm);color:#999;text-align:center;margin-top:3px;}

/* ===打者カード（フッター内に移動、旧カードは廃止）=== */
.pitch-seq-inline{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;}
.auto-banner{border-radius:9px;padding:9px 12px;font-size:var(--fs-md);font-weight:bold;display:flex;align-items:center;gap:7px;animation:pop .3s ease;margin-bottom:5px;}
@keyframes pop{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.auto-banner.bb{background:#e3f2fd;color:#0d47a1;border:1.5px solid #1565c0;}
.auto-banner.k{background:#ffebee;color:#b71c1c;border:1.5px solid #c62828;}
.auto-banner.info{background:#fff8e1;color:var(--c-danger);border:1.5px solid #ffa000;font-size:var(--fs-sm);}

/* ===投球ボタン=== */
.pitch-row{display:flex;align-items:center;gap:4px;}
.pitch-grid{display:flex;gap:4px;flex:1;}
.btn{border:none;border-radius:9px;padding:3px 0 4px;height:48px;font-size:17px;font-weight:bold;cursor:pointer;
  transition:transform .08s,opacity .08s;flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.btn-sub{font-size:var(--fs-sm);font-weight:bold;color:inherit;line-height:1.2;letter-spacing:0;}
.btn:active{transform:scale(.94);opacity:.85;}
.btn.disabled{opacity:.5;pointer-events:none;cursor:not-allowed;}
.btn-ball{background:var(--navy);color:#fff;}
.btn-smiss{background:#d0d5de;color:#0a1628;font-weight:bold;}
.btn-swing{background:#d0d5de;color:#0a1628;}
.btn-foul{background:#d0d5de;color:#0a1628;}
.btn-hbp{background:#c8e6c9;color:#1b5e20;}
.btn-del{background:#ededf0;color:#444;flex:0 0 44px;font-size:var(--fs-lg);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:48px;}
/* ヘルプボタン */
.help-btn{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(0,0,0,.22);
  background:#fff;color:#666;font-size:var(--fs-md);font-weight:bold;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;}
.help-btn:active{background:#f0f0f0;}

/* ===打席結果タブ=== */
.result-card{background:#fff;border-radius:10px;margin-bottom:4px;overflow:hidden;}
.result-tabs{display:flex;background:#eef0f3;position:relative;}
/* 非アクティブ: 役割の色味をtintで表示 */
.result-tab{flex:1;padding:9px 2px;border:none;background:transparent;cursor:pointer;font-size:var(--fs-md);font-weight:bold;color:#888;border-bottom:3px solid transparent;letter-spacing:0;transition:all .15s;}
.result-tab[data-rtab="out"]   {color:#78909c;}
.result-tab[data-rtab="hit"]   {color:#388e3c;}
.result-tab[data-rtab="reach"] {color:#1565c0;}
.result-tab[data-rtab="special"]{color:var(--c-special);}
/* アクティブ: 強調 + 白背景 */
.result-tab.active-out{
  color:#fff;background:var(--c-out);border-bottom:3px solid var(--c-out);
  border-radius:6px 6px 0 0;}
.result-tab.active-hit{
  color:#fff;background:var(--c-hit);border-bottom:3px solid var(--c-hit);
  border-radius:6px 6px 0 0;}
.result-tab.active-reach{
  color:#fff;background:var(--c-hit);border-bottom:3px solid var(--c-hit);
  border-radius:6px 6px 0 0;}
.result-tab.active-special{
  color:#fff;background:var(--c-special);border-bottom:3px solid var(--c-special);
  border-radius:6px 6px 0 0;}
/* 結果エリアの左ボーダーでもカテゴリを表現 */
.result-body{padding:5px 6px 7px;border-top:3px solid #eef0f3;transition:border-color .15s;}
.result-body.tab-out   {border-top-color:var(--c-out);}
.result-body.tab-hit   {border-top-color:var(--c-hit);}
.result-body.tab-reach {border-top-color:var(--c-hit);}
.result-body.tab-special{border-top-color:var(--c-special);}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
/* ②3列グリッド（高さ削減版） */
.result-grid-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
/* ③4列グリッド */
.runner-grid-4col{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.rbtn{
  border:none;border-radius:8px;
  padding:8px 6px;
  min-height:52px;
  font-weight:bold;cursor:pointer;color:#fff;
  transition:transform .08s,opacity .1s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;width:100%;text-align:center;
  overflow:hidden;position:relative;
}
.rbtn:active{transform:scale(.95);opacity:.85;}
.rbtn-main{font-size:15px;font-weight:bold;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:center;width:100%;}
.rbtn-sub{font-size:var(--fs-sm);color:rgba(255,255,255,.95);font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;width:100%;}
/* 状況的に起こり得ないボタン */
/* impossible: グレーアウト・タップ不可・斜線パターン */
.rbtn.unavailable{opacity:.55;cursor:not-allowed;pointer-events:none;filter:grayscale(.4);}
.rbtn.unavailable:active{transform:none;}
.runner-btn.unavailable{opacity:.55;cursor:not-allowed;pointer-events:none;filter:grayscale(.4);}
.runner-btn.unavailable:active{transform:none;}
/* unlikely: 実線ボーダーで区別・タップ可（確認ダイアログあり） */
.rbtn.unlikely{opacity:.9;cursor:pointer;outline:2px solid rgba(255,255,255,.6);outline-offset:-2px;}
.rbtn.unlikely:active{transform:scale(.93);}
.runner-btn.unlikely{opacity:.9;cursor:pointer;outline:2px solid rgba(255,255,255,.6);outline-offset:-2px;}
.runner-btn.unlikely:active{transform:scale(.93);}

/* ===走者イベント=== */
.runner-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:1px;}
.runner-btn{
  border:none;border-radius:8px;
  padding:8px 6px;
  min-height:48px;
  font-weight:bold;cursor:pointer;color:#fff;
  transition:transform .08s,opacity .1s,background .15s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;width:100%;text-align:center;
  overflow:hidden;
}
.runner-btn:active{transform:scale(.95);opacity:.85;}
.rlabel{font-size:13px;font-weight:bold;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:center;width:100%;}
.rsub{font-size:var(--fs-sm);color:rgba(255,255,255,.95);font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;width:100%;}
.runner-btn:active{transform:scale(.93);}

/* ===取り消しボタン=== */
.undo-btn{width:100%;background:#fff;color:var(--c-danger);border:2px solid var(--c-danger);border-radius:9px;padding:10px;font-size:var(--fs-md);font-weight:bold;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.undo-btn:disabled{background:#f5f5f5;color:#777;border-color:#bbb;cursor:default;}
.undo-btn:not(:disabled):active{background:#fff3e0;}

/* ===モーダル=== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;justify-content:center;touch-action:none;-webkit-overflow-scrolling:auto;}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 18px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;position:relative;z-index:201;}
.modal-title{font-size:18px;font-weight:bold;margin-bottom:6px;color:var(--navy2);} /* 18px=lg+2: モーダル見出しは特別に大きく */
.modal-sub{font-size:var(--fs-sm);color:var(--gray);margin-bottom:14px;line-height:1.6;}
.modal-cancel{width:100%;background:#f0f0f0;color:#333;border:none;border-radius:10px;padding:14px;font-size:var(--fs-md);font-weight:bold;cursor:pointer;margin-top:8px;min-height:48px;}
.step-label{font-size:var(--fs-xs);color:#999;font-weight:bold;letter-spacing:.5px;margin-bottom:3px;}
.step-q{font-size:var(--fs-lg);font-weight:bold;color:var(--navy2);margin-bottom:10px;line-height:1.4;}
.hint{font-size:var(--fs-sm);color:#666;background:#f8f9fa;border-radius:6px;padding:7px 9px;margin-bottom:8px;line-height:1.5;}
.sym-preview{background:#1a3a6e;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:9px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.18);}
.sym-preview .sym{font-size:var(--fs-xl);font-weight:900;font-family:monospace;}
.sym-preview .desc{font-size:var(--fs-sm);color:rgba(255,255,255,.9);flex:1;}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.pos-btn{border:none;border-radius:9px;padding:10px 4px;cursor:pointer;transition:transform .07s,opacity .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;}
.pos-btn:active{transform:scale(.92);}
.pn{font-size:var(--fs-xl);font-weight:900;}
.pos-btn .pp{font-size:var(--fs-sm);display:block;margin-top:1px;color:inherit;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.choice-btn{border:none;border-radius:10px;padding:15px 10px;font-size:var(--fs-md);font-weight:bold;cursor:pointer;transition:transform .07s;text-align:center;line-height:1.3;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:48px;}
.choice-btn:active{transform:scale(.93);}
.choice-btn.danger {background:#c62828; color:#fff;}   /* 赤 */
.choice-btn.success{background:#2e7d32; color:#fff;}   /* 緑 */
.choice-btn.warning{background:#d84315; color:#fff;}   /* 濃いオレンジ（amber→より暗く） */
.choice-btn.gray   {background:#546e7a; color:#fff;}   /* ブルーグレー */
.choice-btn.light  {background:#fff;    color:#1a3a6e; border:2px solid #1a3a6e;} /* 白×紺 */
.choice-btn.primary{background:#1a3a6e; color:#fff;}   /* 紺 */
.back-btn{background:#f5f5f5;border:1px solid #e0e0e0;color:#444;font-size:var(--fs-sm);cursor:pointer;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:4px;border-radius:8px;font-weight:bold;width:100%;min-height:40px;}
.confirm-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;font-size:var(--fs-md);font-weight:bold;cursor:pointer;margin-top:4px;min-height:48px;}

/* スコアブックプレビュー */
.sb-modal .sb-diamond-wrap{display:flex;justify-content:center;background:#f8fffe;border-radius:11px;padding:8px;}
.write-guide{background:#fffde7;border-radius:9px;padding:9px 11px;margin-bottom:12px;border-left:3px solid #f9a825;}
.write-guide-title{font-size:var(--fs-sm);color:var(--c-danger);font-weight:bold;margin-bottom:5px;}
.write-guide-body{font-size:var(--fs-sm);color:#333;line-height:1.8;}

/* ===スコアボード=== */
.sbd-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
.sbd-table th{padding:6px 2px;text-align:center;background:var(--navy2);color:#fff;font-size:var(--fs-xs);}
.sbd-table th.team-th{text-align:left;padding-left:7px;min-width:62px;}
.sbd-table th.cur-inn{background:var(--red);}
.sbd-table th.total-th{background:#0d2044;}
.sbd-table td{padding:4px 2px;text-align:center;border-bottom:1px solid #f0f0f0;}
.sbd-table td.team-td{padding:4px 7px;text-align:left;}
.sbd-table td.total-td{font-size:var(--fs-lg);font-weight:900;background:#f8f9fa;}
.sbd-score{font-weight:bold;font-size:var(--fs-sm);margin-bottom:1px;}
.sbd-btns{display:flex;justify-content:center;gap:1px;}
.sbd-btn{border:none;border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:var(--fs-md);padding:0;line-height:20px;font-weight:bold;}
.sbd-btn.plus{background:#c8e6c9;color:#1b5e20;}.sbd-btn.minus{background:#ffcdd2;color:#b71c1c;}
.sbd-cur{background:#fff9c4 !important;}

/* ===スコアブックタブ=== */
.sb-filter{display:flex;gap:5px;margin-bottom:9px;overflow-x:auto;padding-bottom:2px;}
.sb-filter-btn{border:none;border-radius:20px;padding:6px 12px;font-size:var(--fs-sm);font-weight:bold;cursor:pointer;white-space:nowrap;min-height:36px;}
.sb-filter-btn.active{background:var(--navy2);color:#fff;}
.sb-filter-btn:not(.active){background:#e8ecf2;color:#555;}
.sb-inn-group{margin-bottom:13px;}
.sb-inn-label{font-size:var(--fs-sm);font-weight:bold;color:var(--navy2);margin-bottom:7px;padding:3px 8px;background:#e8edf5;border-radius:6px;display:inline-block;}
.sb-ab-list{display:flex;flex-wrap:wrap;gap:7px;}
.waseda-card{background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 5px rgba(0,0,0,.1);width:calc(50% - 4px);min-width:136px;cursor:pointer;}
.waseda-card:active{opacity:.8;}
.change-card{background:#fff8e1;border:1.5px solid #ffcc02;border-radius:10px;padding:7px 10px;width:100%;margin-bottom:4px;font-size:var(--fs-sm);color:#5d4037;font-weight:bold;}
.waseda-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.waseda-order{background:var(--navy2);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:bold;flex-shrink:0;}
.waseda-player{font-size:var(--fs-sm);font-weight:bold;color:#333;margin-left:4px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.waseda-sym{font-size:var(--fs-sm);font-weight:900;font-family:monospace;}
.waseda-pitches{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;justify-content:center;}

/* ===記録タブ=== */
.log-inn{background:#fff;border-radius:11px;padding:9px;margin-bottom:7px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.log-inn-hdr{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--gray);font-weight:bold;margin-bottom:7px;}
.log-ab{display:flex;align-items:center;gap:5px;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid #f5f5f5;}
.log-ab:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.log-num{background:var(--navy2);color:#fff;border-radius:50%;min-width:21px;height:21px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:bold;}
.log-name{font-size:var(--fs-sm);font-weight:bold;min-width:42px;}
.log-pitches{display:flex;gap:2px;flex:1;flex-wrap:wrap;}
.log-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.result-badge{border-radius:5px;padding:2px 6px;font-size:var(--fs-xs);font-weight:bold;color:#fff;white-space:nowrap;font-family:monospace;}
.defense-badge{border-radius:4px;padding:2px 5px;font-size:var(--fs-sm);font-weight:bold;background:#e3f2fd;color:#0d47a1;white-space:nowrap;}
.event-badge{border-radius:4px;padding:2px 5px;font-size:var(--fs-sm);font-weight:bold;background:var(--c-special);color:#fff;}

/* ===セットアップ=== */
.setup-page{height:100dvh;display:flex;flex-direction:column;background:var(--bg);}
.setup-hdr{background:var(--navy);padding:14px 14px 10px;color:#fff;flex-shrink:0;}
.setup-title{font-size:18px;font-weight:bold;text-align:center;margin-bottom:10px;} /* 18px: セットアップ見出し */
.team-toggle{display:flex;border-radius:10px;overflow:hidden;border:1px solid #334;}
.ttbtn{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:var(--fs-sm);font-weight:bold;color:#fff;background:transparent;transition:background .2s;min-height:44px;}
.ttbtn.away.active{background:var(--red);}.ttbtn.home.active{background:#1565c0;}
.setup-body{flex:1;background:var(--bg);border-radius:16px 16px 0 0;margin-top:10px;padding:12px;overflow-y:auto;}
.team-name-input{width:100%;font-size:var(--fs-md);font-weight:bold;border:2px solid var(--navy2);border-radius:9px;padding:8px 12px;margin-bottom:10px;background:#fff;outline:none;}
.player-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#fff;border-radius:9px;padding:7px 9px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.order-badge{background:var(--navy2);color:#fff;border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:var(--fs-sm);}
.num-input{width:48px;border:1px solid #ddd;border-radius:7px;padding:8px 4px;font-size:var(--fs-md);text-align:center;outline:none;}
.name-input{flex:1;border:1px solid #ddd;border-radius:7px;padding:5px 7px;font-size:var(--fs-md);outline:none;}
.pos-select{border:1px solid #ddd;border-radius:7px;padding:8px 6px;font-size:var(--fs-md);background:#fff;outline:none;min-height:44px;}
.start-btn{width:100%;background:linear-gradient(135deg,var(--navy2),var(--red));color:#fff;border:none;border-radius:13px;padding:14px;font-size:var(--fs-lg);font-weight:bold;cursor:pointer;min-height:48px;}
.setup-footer{background:var(--bg);padding:10px 12px 26px;flex-shrink:0;}
.modal-text-input{width:100%;border:2px solid #ddd;border-radius:9px;padding:10px 12px;font-size:var(--fs-md);outline:none;font-family:inherit;margin-bottom:6px;}
.modal-text-input:focus{border-color:var(--navy2);outline:2px solid var(--navy2);outline-offset:-2px;}

/* ===チュートリアル=== */
.tut-page{height:100dvh;display:flex;flex-direction:column;background:var(--navy);overflow:hidden;}
.tut-hdr{padding:14px 16px 10px;color:#fff;flex-shrink:0;}
.tut-title{font-size:var(--fs-lg);font-weight:bold;margin-bottom:3px;}
.tut-sub{font-size:var(--fs-sm);opacity:.7;margin-bottom:10px;}
.tut-steps{display:flex;gap:6px;margin-bottom:4px;}
.tut-step-dot{height:4px;border-radius:2px;flex:1;background:rgba(255,255,255,.2);transition:background .3s;}
.tut-step-dot.active{background:#ff8a80;}
.tut-body{flex:1;overflow-y:auto;padding:0 14px 14px;}
.tut-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.tut-card-top{padding:12px 14px 0;}
.tut-label{font-size:var(--fs-xs);font-weight:bold;color:#aaa;letter-spacing:.5px;margin-bottom:4px;}
.tut-situation{font-size:var(--fs-md);font-weight:bold;color:var(--navy2);margin-bottom:10px;line-height:1.4;}
.tut-diamond-row{display:flex;align-items:flex-start;gap:12px;padding:0 14px 12px;}
.tut-diamond-wrap{background:#f0f8f0;border-radius:10px;padding:8px;flex-shrink:0;}
.tut-explanation{flex:1;}
.tut-sym-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.tut-sym{font-size:var(--fs-xl);font-weight:900;font-family:monospace;padding:3px 10px;border-radius:7px;color:#fff;}
.tut-sym-desc{font-size:var(--fs-sm);color:#333;font-weight:bold;}
.tut-points{list-style:none;padding:0;margin:0;}
.tut-points li{font-size:var(--fs-sm);color:var(--gray);line-height:1.6;padding-left:12px;position:relative;}
.tut-points li::before{content:"▶";position:absolute;left:0;font-size:8px;color:#aaa;top:2px;}
.tut-rule-box{background:#f8f9fa;margin:0 10px 10px;border-radius:9px;padding:9px 11px;}
.tut-footer{flex-shrink:0;padding:10px 14px 24px;display:flex;gap:8px;}
.tut-skip{flex:1;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:11px;padding:12px;font-size:var(--fs-sm);font-weight:bold;cursor:pointer;min-height:44px;}
.tut-next{flex:2;background:#ff8a80;color:#fff;border:none;border-radius:11px;padding:12px;font-size:var(--fs-md);font-weight:bold;cursor:pointer;min-height:44px;}

/* ━━━ アコーディオン ━━━ */
.result-body-accordion{
  animation:accordionOpen .15s ease;
}
@keyframes accordionOpen{
  from{opacity:0;transform:translateY(-4px);}
  to{opacity:1;transform:translateY(0);}
}
/* result-tabのアクティブ時のスタイル強化 */
.result-tab.active-out,
.result-tab.active-hit,
.result-tab.active-reach{
  border-bottom-width:3px;
}

/* ━━━ WCAG 2.4.7 Focus Visible ━━━ */
/* キーボードフォーカス時に明確なリングを表示 */
button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
  outline: 3px solid #1565c0;
  outline-offset: 2px;
  border-radius: 4px;
}
/* タッチ操作時はフォーカスリングを非表示（見た目改善） */
button:focus:not(:focus-visible) { outline: none; }

/* ━━━ WCAG 1.4.11 Non-text Contrast ━━━ */
/* ボタンの境界線がわかるように */
.rbtn:focus-visible,
.runner-btn:focus-visible,
.choice-btn:focus-visible,
.tab-btn:focus-visible,
.pos-btn:focus-visible,
.help-btn:focus-visible,
.undo-btn:focus-visible {
  outline: 3px solid #ffd600;
  outline-offset: 2px;
  box-shadow: 0 0 0 5px #1565c0;
}

/* ━━━ 色覚異常対応：アウト/ヒット/出塁を色だけで区別しない ━━━ */
/* impossibleボタンには斜線パターンを追加 */
.rbtn.unavailable::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 4px,
    rgba(0,0,0,0.1) 4px,
    rgba(0,0,0,0.1) 5px
  );
  border-radius: 8px;
  pointer-events: none;
}
.rbtn { position: relative; }

/* ===== ワンパネルウィザード ===== */
.wiz-section{background:#f8fafc;border-radius:12px;padding:12px 12px 10px;margin-bottom:10px;border:1.5px solid #e2e8f0;transition:border-color .2s,background .2s;}
.wiz-section.wiz-active{border-color:#bfdbfe;background:#f0f7ff;}
.wiz-section.wiz-done{border-color:#86efac;background:#f0fdf4;}
.wiz-section-hdr{display:flex;align-items:center;gap:7px;font-size:var(--fs-md);font-weight:bold;color:#1e3a5f;margin-bottom:9px;line-height:1.3;}
.wiz-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--navy2);color:#fff;font-size:var(--fs-sm);font-weight:bold;flex-shrink:0;}
.wiz-done .wiz-num{background:#16a34a;}
.wiz-pos-sub{font-size:var(--fs-xs);font-weight:bold;color:#64748b;letter-spacing:.5px;margin-bottom:4px;}
/* 守備ボタン選択済み状態 */
.pos-btn.wiz-selected{outline:3px solid #16a34a;transform:scale(1.08);position:relative;z-index:1;}
.pos-btn.wiz-selected-err{outline:3px solid #c62828;transform:scale(1.08);position:relative;z-index:1;}
/* 投球数警告バッジ */
.pitch-warn-badge{display:inline-block;font-size:var(--fs-xs);font-weight:bold;border-radius:20px;padding:1px 6px;margin-left:5px;vertical-align:middle;}
.pitch-warn-y{background:#fef08a;color:#854d0e;}
.pitch-warn-o{background:#fed7aa;color:#9a3412;}
.pitch-warn-r{background:#fecaca;color:#7f1d1d;}

// 打席結果ボタンの可否判定
// 戻り値: "ok" | "unlikely" | "impossible"
// "unlikely"=押せるが確認ダイアログ、"impossible"=完全グレーアウト
function getResultAvailability(code){
  var bases=S.curBases||[];
  var outs=S.outs||0;
  var has1=bases.includes(1),has2=bases.includes(2),has3=bases.includes(3);
  var hasAny=bases.length>0;
  var pitches=S.curPitches||[];
  var balls=pitches.filter(function(p){return p==="B";}).length;
  var strikes=pitches.filter(function(p){return["S","SW","F"].includes(p);}).length;
  strikes=Math.min(strikes,2);

  switch(code){

    // ── ヒット選択（常にOK）──
    case "HIT_SELECT": return"ok";

    // ── ゴロ / フライ / ライナー ── 常に起こり得る
    case "GO": case "FO": case "LO": return"ok";

    // ── ゲッツー ──
    // 1塁走者がいてアウト1以下でないと成立しない
    case "DP":
      if(outs>=2) return"impossible";   // 2アウトでは成立不可
      if(!has1) return"impossible";     // 1塁走者なしでは成立しない（稀なDP除く）
      return"ok";

    // ── 犠打（送りバント） ──
    // 走者なし・2アウトは無意味
    case "SAC":
      if(outs>=2) return"impossible";   // 2アウトでバントはない
      if(!hasAny) return"unlikely";     // 走者なしバントは稀（セーフティバント等）
      return"ok";

    // ── バントヒット ── いつでも起こり得る
    case "BH": return"ok";

    // ── スクイズ ──
    // 3塁走者必須・2アウトは稀
    case "SQ":
      if(!has3) return"impossible";     // 3塁走者なしでスクイズは成立しない
      if(outs>=2) return"unlikely";     // 2アウトスクイズは稀
      return"ok";

    // ── 犠打エラー出塁 ──
    case "SACE":
      if(outs>=2) return"unlikely";     // 2アウトバントは稀
      if(!hasAny) return"unlikely";     // 走者なし
      return"ok";

    // ── スクイズ失敗 ──
    case "SQE":
      if(!has3) return"impossible";     // 3塁走者なしでは成立しない
      return"ok";

    // ── 犠牲フライ ──
    // 3塁走者が必要
    case "SF":
      if(!has3) return"impossible";     // 3塁走者なしでは犠飛にならない
      return"ok";

    // ── IFF（インフィールドフライ） ──
    case "IFF":
      if(outs>=2) return"impossible";
      if(!has1&&!has2) return"impossible";
      return"ok";

    // ── 打撃妨害(CI) ── いつでも起こり得る
    case "CI": return"ok";

    // ── 走塁妨害(OBI) ──
    case "OBI":
      if(!hasAny) return"unlikely";     // 走者なしでは走塁妨害は起こらない
      return"ok";

    // ── 3バント失敗 ──
    case "K3B":
      if(strikes<2) return"unlikely";   // 2ストライク未満では3バント失敗はない
      return"ok";

    // ── 野選（フィールダースチョイス） ──
    // 走者がいないと野選は起こり得ない（野選=走者をアウトにしようとして別の走者を選んだ結果）
    case "FC":
      if(!hasAny) return"impossible";
      return"ok";

    // ── 振り逃げ ──
    case "KWP":
      if(outs>=2) return"ok";         // 2アウトなら常に振り逃げ可
      if(!has1) return"ok";            // 1塁が空なら振り逃げ可
      return"impossible";               // 1塁走者あり・2アウト未満は振り逃げ不可（野球ルール）

    default: return"ok";
  }
}

// 走者イベントの可否判定
function getRunnerEventAvailability(code){
  var bases=S.curBases||[];
  var outs=S.outs||0;
  var hasAny=bases.length>0;
  var has1=bases.includes(1),has2=bases.includes(2),has3=bases.includes(3);
  // 盗塁できる走者（3塁走者は盗塁の意味が薄い）
  var hasSBRunner=has1||has2; // 1塁か2塁に走者
  var numRunners=bases.length;

  switch(code){

    // ── 盗塁(SB) ──
    // 走者なし → impossible
    // 3塁走者のみ → unlikely（3塁から盗塁は非常に稀）
    case "SB":
      if(!hasAny) return"impossible";
      if(!hasSBRunner) return"unlikely"; // 3塁走者のみ
      return"ok";

    // ── 重盗(DS) ──
    // 走者2人以上が必要
    case "DS":
      if(numRunners<2) return"impossible";
      return"ok";

    // ── 盗塁失敗(CS) ──
    // 走者なし → impossible
    // 3塁走者のみ → unlikely
    case "CS":
      if(!hasAny) return"impossible";
      if(!hasSBRunner) return"unlikely";
      return"ok";

    // ── 牽制アウト(PO) ──
    // 走者必須
    case "PO":
      if(!hasAny) return"impossible";
      return"ok";
    case "POE":
      // 牽制エラー: 走者がいるときのみ有効（エラーで走者が進む・打者はそのまま）
      if(!hasAny) return"impossible";
      return"ok";

    // ── 走塁死(ROUT) ──
    // 走者必須
    case "ROUT":
      if(!hasAny) return"impossible";
      return"ok";

    // ── 挟殺(RUNDOWN) ──
    // 走者必須
    // ── 三重盗(TS) ──
    case "TS":
      if(numRunners<3) return"impossible";
      return"ok";

    case "RUNDOWN":
      if(!hasAny) return"impossible";
      return"ok";

    // ── 暴投(WP) / 捕逸(PB) ──
    // 走者なし → unlikely（記録はできるが進塁しない）
    case "WP":
    case "PB":
      if(!hasAny) return"unlikely";
      return"ok";

    // ── ボーク(BALK) ──
    // 走者なし → impossible（ボークは走者がいる場面のルール）
    case "BALK":
      if(!hasAny) return"impossible";
      return"ok";

    // ── 得点追加(SCORE) ──
    // 走者なし → impossible（得点できる走者がいない）
    case "SCORE":
      if(!hasAny) return"unlikely"; // 走者なしでも手動補正のため使える
      return"ok";

    default: return"ok";
  }
}

// 「賢い状況推察」— 押されたボタン×現在の状況から推察とヒントを生成
// ============================================================
function getSituationAdvice(code){
  var bases=S.curBases||[];
  var outs=S.outs||0;
  var has1=bases.includes(1),has2=bases.includes(2),has3=bases.includes(3);
  var hasAny=bases.length>0;
  // why: なぜ通常使わないか / guess: 何が起きたと推察 / hint: 代替案
  var why="",guess="",hint="";

  if(code==="SAC"&&!hasAny){
    why="犠打（送りバント）は塁に走者がいるときに、意図的にバントして走者を進める作戦です。今は走者がいません。";
    guess="もしかして…バントしてアウトになった？　→ その場合は「ゴロ」でアウトを記録するのが正確です。";
    hint="バントでもアウトなら「ゴロ」タブで記録してください";
  } else if(code==="SF"&&!has3){
    why="犠牲フライは「3塁にいる走者をホームに帰すための外野フライ」です。今3塁に走者がいません。";
    guess="もしかして…外野にフライが上がって捕られた？　→ 「フライ」でアウトを記録してください。";
    hint="走者が3塁にいないフライアウト → 「フライ」を選んでください";
  } else if(code==="DP"&&!has1){
    why="ゲッツー（ダブルプレー）は1塁走者がいるときに起こります。ゴロを打って1塁走者と打者の両方が同時にアウトになるプレーです。";
    guess="もしかして…普通のゴロアウトだった？　→ 「ゴロ」でアウトを記録してください。";
    hint="ゴロを打ってアウトになった → 「ゴロ」を選んでください";
  } else if(code==="DP"&&outs>=2){
    why="2アウトではゲッツーが成立しません。すでに2アウトなのでもう1人アウトにするとチェンジになるだけです。";
    guess="もしかして…ゴロでアウトになった？　→ 「ゴロ」でアウトを記録してください。";
    hint="2アウトのゴロアウト → 「ゴロ」を選んでください";
  } else if(code==="IFF"&&!has1&&!has2){
    why="インフィールドフライは「1塁・2塁に走者がいるとき」だけ審判が宣告する特別なルールです。走者なしでは使いません。";
    guess="もしかして…内野に高いフライが上がった？　→ 「フライ」でアウトを記録してください。";
    hint="内野のフライアウト → 「フライ」を選んでください";
  } else if(code==="SQ"&&!has3){
    why="スクイズは「3塁走者をホームに生還させるバント作戦」です。3塁に走者がいないと意味がありません。";
    guess="もしかして…バントしてゴロを打った？　→ 「犠打」または「ゴロ」で記録してください。";
    hint="走者がいないバント → 「犠打」か「ゴロ」を選んでください";
  } else if(code==="SB"&&!hasAny){
    why="盗塁は走者がいるときに走者が次の塁に走ることです。走者がいないと盗塁できません。";
    guess="まず打者が塁に出た後、次の投球中に走ります。打席の結果（出塁）を先に記録してから「盗塁」を押してください。";
    hint="先に打席の結果（出塁）を記録 → それから「盗塁」ボタンを押す";
  } else if((code==="WP"||code==="PB")&&!hasAny){
    var ev=code==="WP"?"暴投（投球が大きく逸れた）":"捕逸（捕手がボールを後ろに逸らした）";
    why=ev+"は走者がいるときに走者が進塁します。走者がいない場合、記録してもランナーへの影響はありません。";
    guess="走者なしの場合、通常はカウント（ボール）として①に記録するだけで十分です。";
    hint="走者なしなら①で「B（ボール）」を押すだけで大丈夫です";
  } else if(code==="BALK"&&!hasAny){
    why="ボークは「投手の反則投球で走者を1つ進める」ルールです。走者がいない場合、走者への影響はありません（ボール1つが加算されます）。";
    guess="走者なしのボークは「B（ボール）」として投球カウントするのが一般的です。";
    hint="走者なしなら①で「B（ボール）」を押してください";
  } else if(code==="SCORE"&&!hasAny){
    why="「得点追加」は走者がホームに帰ったときに使います。走者がいないので通常は発生しません。";
    guess="得点の記録漏れがあった場合は記録できますが、確認してから操作してください。";
    hint="得点の記録漏れがあった場合のみ使用してください";
  } else {
    why="この状況では通常起こらないプレーです。";
    guess="本当にこのプレーが起きたか、もう一度確認してください。";
    hint="違うと思ったら「キャンセル」を押して、正しいボタンを選んでください";
  }
  return {why:why, guess:guess, hint:hint};
}

// 現在の投手を取得
function curPitcher(side){
  ensurePitchers();
  var s=side||S.curSide;
  var ps=S.pitchers[s]||[];
  return ps.length>0?ps[ps.length-1]:null;
}

// 現在の守備側（ピッチャーがいる側）
function defSide(){
  return S.curSide==="top"?"bottom":"top";
}

// pitchers が未初期化のときに安全に初期化
function ensurePitchers(){
  if(!S.pitchers)S.pitchers={top:[],bottom:[]};
  if(!S.pitchers.top)S.pitchers.top=[];
  if(!S.pitchers.bottom)S.pitchers.bottom=[];
}

// 投球を現在投手にカウント
function addPitchToPitcher(count){
  ensurePitchers();
  var ds=defSide();
  var p=curPitcher(ds);
  if(p) p.pitchCount=(p.pitchCount||0)+count;
}

// 打者アウトを投手に記録
function recordBatterToPitcher(rc,scored,earnedScored){
  var ds=defSide();
  var p=curPitcher(ds);
  if(!p)return;
  p.battersFaced=(p.battersFaced||0)+1;
  p.earnedRuns=(p.earnedRuns||0)+earnedScored;
  p.unearnedRuns=(p.unearnedRuns||0)+(scored-earnedScored);
}

// 投手交代
function changePitcher(name,number){
  var ds=defSide();
  if(!S.pitchers[ds])S.pitchers[ds]=[];
  // 前の投手を非currentに
  var ps=S.pitchers[ds];
  if(ps.length>0)ps[ps.length-1].isCurrent=false;
  ps.push({
    name:name||"投手",
    number:number||"",
    pitchCount:0,
    earnedRuns:0,
    unearnedRuns:0,
    battersFaced:0,
    inningStart:S.curInning,
    inningStartOuts:S.outs,
    isCurrent:true
  });
}

var DEFAULT_POS=[1,6,4,3,5,7,8,9,2];

function makeTeam(name, isHome){
  // ファイターズメンバーからランダムに9人選ぶ（重複なし）
  var pool=FIGHTERS_MEMBERS.slice();

}

// ============================================================
// 走者連動エンジン
// 「この結果なら走者はこう動く」を自動計算し、
// 曖昧なケースのみ確認ポップアップを出す
// ============================================================

// 走者情報を更新するメインエンジン
// returns: {newBases, newRunnerInfo, scored, earnedScored, needConfirm, confirmOptions}
function calcRunnerMovement(rc, sel, curBases, runnerInfo, outs){
  sel = sel || {};
  runnerInfo = runnerInfo || {};
  var nb = curBases.slice();
  var ri = JSON.parse(JSON.stringify(runnerInfo)); // deep copy
  var scored = 0, earnedScored = 0;
  // addRunner で使う現在打者の order
  var _batterOrder = sel && sel._batterOrder ? sel._batterOrder : 0;
  var hasError = !!(sel.errorWho || (sel.hasError));

  function moveRunner(from, to){
    var idx = nb.indexOf(from);
    if(idx === -1) return;
    nb.splice(idx, 1);
    if(to > 3){
      scored++;
      // エラーによる出塁走者、またはエラーで得点した場合は非自責
      if(ri[from] && ri[from].earned) earnedScored++;
      delete ri[from];
    } else {
      ri[to] = ri[from] ? Object.assign({}, ri[from]) : {earned:true};
      delete ri[from];
      nb.push(to);
    }
  }

  function addRunner(base, earned){
    nb.push(base);
    // 出塁打者の情報をrunnerInfoに記録（後でapplyRunnerOutで参照）
    ri[base] = {earned: earned, order: _batterOrder};
  }
  // =========================================
  // 確定した走者移動先（runnerMoves）があれば優先適用
  // =========================================
  var runnerMoves = (sel && sel.runnerMoves && Object.keys(sel.runnerMoves).length > 0) ? sel.runnerMoves : null;
  if(runnerMoves){
    // ウィザードで確認済みの移動を適用（上位塁から順に処理）
    var basesToProcess = Object.keys(runnerMoves).map(Number).sort(function(a,b){return b-a;});
    basesToProcess.forEach(function(from){
      var mv = runnerMoves[from];
      if(!mv) return;
      var toStr = mv.to;
      if(toStr === "OUT"){
        // アウトになった走者: 塁から削除するだけ（得点なし）
        var idx = nb.indexOf(from);
        if(idx !== -1) nb.splice(idx, 1);
        delete ri[from];
        return;
      }
      if(toStr === String(from)) return; // 動かない
      var toNum = toStr === "H" ? 4 : Number(toStr);
      moveRunner(from, toNum);
    });
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    // E/FC/1H/2H/3Hの場合: 打者を適切な塁に追加
    // 打者(key=0)の処理
    var bm = runnerMoves[0];
    if(bm){
      if(bm.to === "OUT"){
        // 打者アウト: どこにも塁を追加しない
      } else {
        var bmBase = bm.to === "H" ? 4 : Number(bm.to);
        if(bmBase <= 3){
          if(!nb.includes(bmBase)){nb.push(bmBase);nb.sort();}
          // GO_E / E / FC は非自責、ヒット系は自責
          ri[bmBase] = {earned: !["E","FC","GO_E"].includes(rc)};
        } else if(bmBase === 4){
          scored++;
          earnedScored++;
        }
      }
    } else {
      // runnerMovesに打者がない場合のデフォルト
      var batterBase = {"E":1,"FC":1,"GO_E":1,"1H":1,"2H":2,"3H":3}[rc];
      if(batterBase){
        if(!nb.includes(batterBase)){nb.push(batterBase);nb.sort();}
        ri[batterBase] = {earned: !["E","FC","GO_E"].includes(rc)};
      }
    }
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  // =========================================
  // アウト系：走者は基本動かない（runnerMovesなし時のフォールバック）
  // =========================================
  var OUT_CODES = ["K","SK","K3B","GO","FO","LO","IFF","SAC","SQ","SQE","SF","DP"];
  if(OUT_CODES.includes(rc)){
    // SAC(犠打) / SQ(スクイズ): 全走者が1つずつ進む
    if(rc === "SAC" || rc === "SQ"){
      if(nb.includes(3)){ moveRunner(3,4); }
      if(nb.includes(2)){ moveRunner(2,3); }
      if(nb.includes(1)){ moveRunner(1,2); }
      // SQは3塁走者の生還を確実にする（走者がいない場合も考慮）
    }
    // SF(犠牲フライ): 3塁走者はホームイン
    if(rc === "SF" && nb.includes(3)){
      moveRunner(3, 4);
    }
    // ゲッツー: 走者1塁は2アウト目でアウト
    if(rc === "DP"){
      if(nb.includes(1)) nb = nb.filter(function(b){return b!==1;});
      delete ri[1];
    }
    // SQE（スクイズ失敗）: 打者もアウト(三振) + 3塁走者もアウト
    // extraOutsは commitAtBat で sel.extraOuts=1 として処理される
    // 打者の結果は別途 startRunnerConfirmIfNeeded で決定
    if(rc === "SQE"){
      if(nb.includes(3)){
        nb = nb.filter(function(b){return b!==3;});
        delete ri[3];
        // SQEは追加でアウトになるが、commitAtBatのextraOutsで管理
      }
    }
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  // =========================================
  // 出塁系：押し出し処理
  // =========================================
  if(["BB","HBP"].includes(rc)){
    var earned = true; // 四球・死球は自責
    // 満塁→押し出し
    if(nb.includes(1)&&nb.includes(2)&&nb.includes(3)){
      moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
      addRunner(1, earned);
    } else if(nb.includes(1)&&nb.includes(2)){
      moveRunner(2,3); moveRunner(1,2); addRunner(1, earned);
    } else if(nb.includes(1)){
      moveRunner(1,2); addRunner(1, earned);
    } else {
      addRunner(1, earned);
    }
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  // =========================================
  // エラー出塁（E / GOエラー出塁 GO_E）
  // =========================================
  // 打撃妨害(CI): 打者が1塁へ（非自責）、走者はフォース進塁
  if(rc === "CI" || rc === "OBI"){
    if(nb.includes(3)&&nb.includes(2)&&nb.includes(1)){
      moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
    } else if(nb.includes(2)&&nb.includes(1)){
      moveRunner(2,3); moveRunner(1,2);
    } else if(nb.includes(1)){
      moveRunner(1,2);
    }
    if(!nb.includes(1)){nb.push(1);nb.sort();}
    ri[1]={earned:false}; // 妨害による出塁は非自責
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }
  if(rc === "E" || rc === "GO_E"){
    // フォース状態を計算して自動進塁
    if(nb.includes(3)&&nb.includes(2)&&nb.includes(1)){
      moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
    } else if(nb.includes(2)&&nb.includes(1)){
      moveRunner(2,3); moveRunner(1,2);
    } else if(nb.includes(1)){
      moveRunner(1,2);
    }
    if(!nb.includes(1)){nb.push(1);nb.sort();}
    ri[1]={earned:false};
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  // =========================================
  // インフィールドフライ（IFF）
  // 打者自動アウト、走者はそのまま（リタッチ義務）
  // =========================================
  if(rc === "IFF"){
    // 走者は動かない
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  // =========================================
  // 野選（FC）: アウトになった走者を削除、打者を1塁へ
  // =========================================
  if(rc === "FC"){
    var runnerOutBase = sel.runnerOutBase || null;
    // アウトになった走者を塁から削除
    if(runnerOutBase && nb.includes(runnerOutBase)){
      nb = nb.filter(function(b){return b !== runnerOutBase;});
      delete ri[runnerOutBase];
    }
    // 残りの走者でフォース状態のものは進塁
    // （アウト走者を除いた後、打者が1塁に来るのでフォースが発生しうる）
    var nbAfterOut = nb.slice();
    // 打者が1塁に来ることで押し出されるか判定
    if(nbAfterOut.includes(1)){
      if(nbAfterOut.includes(2)){
        if(nbAfterOut.includes(3)){ moveRunner(3,4); }
        moveRunner(2,3);
      }
      moveRunner(1,2);
    }
    // 打者→1塁（FC出塁は非自責）
    if(!nb.includes(1)){nb.push(1);nb.sort();}
    ri[1]={earned:false};
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  // 振り逃げ
  if(rc === "KWP"){
    if(nb.includes(1)&&nb.includes(2)&&nb.includes(3)){scored++;nb=[1,2,3];}
    else if(nb.includes(1)&&nb.includes(2)){nb=[1,2,3];}
    else if(nb.includes(1)){nb=[1,2];}
    else {nb=[1].concat(nb);}
    ri[1]={earned:false};
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  // =========================================
  // ヒット系：自動＋追加進塁確認
  // =========================================
  var extraBase = (sel && sel.extraBase) ? sel.extraBase : null;
  var extraReason = (sel && sel.extraReason) ? sel.extraReason : null;

  // BH（バントヒット）: 単打と同様に1塁へ（自責）
  if(rc === "BH"){
    if(nb.includes(3)){moveRunner(3,4);}
    if(nb.includes(2)){moveRunner(2,3);}
    if(nb.includes(1)){moveRunner(1,2);}
    addRunner(1, true);
  }
  // SACE（犠打エラー出塁）: エラーで打者が出塁
  if(rc === "SACE"){
    if(nb.includes(3)&&nb.includes(2)&&nb.includes(1)){
      moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
    } else if(nb.includes(2)&&nb.includes(1)){
      moveRunner(2,3); moveRunner(1,2);
    } else if(nb.includes(1)){
      moveRunner(1,2);
    }
    if(!nb.includes(1)){nb.push(1);nb.sort();}
    ri[1]={earned:false};
    nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
    return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
  }

  if(rc === "1H"){
    // 打者→1塁（自責）
    // 走者: 3塁走者→得点, 2塁走者→3塁, 1塁走者→2塁（基本）
    // ただし1塁走者が得点できる可能性あり（強打のシングルなど）→ extraBaseで上書き
    if(nb.includes(3)){moveRunner(3,4);}
    if(nb.includes(2)){moveRunner(2,3);}
    if(nb.includes(1)){
      if(extraBase==="H"||extraBase==="3"){moveRunner(1, extraBase==="H"?4:3);}
      else {moveRunner(1,2);}
    }
    addRunner(1, true);
    if(extraBase==="2"){moveRunner(1,2);}
    if(extraBase==="3"){/* already handled */}
    if(extraBase==="H"){scored++; earnedScored++; nb=nb.filter(function(b){return b!==1;});}
  }
  else if(rc === "2H"){
    // 打者→2塁, 走者: 3塁→得点, 2塁→得点（基本）, 1塁→3塁
    if(nb.includes(3)){moveRunner(3,4);}
    if(nb.includes(2)){moveRunner(2,4);}
    if(nb.includes(1)){
      if(extraBase==="H"){ moveRunner(1,4); }
      else { moveRunner(1,3); }
    }
    addRunner(2, true);
  }
  else if(rc === "3H"){
    // 打者→3塁, 全走者→得点
    if(nb.includes(3)){moveRunner(3,4);}
    if(nb.includes(2)){moveRunner(2,4);}
    if(nb.includes(1)){moveRunner(1,4);}
    addRunner(3, true);
  }
  else if(rc === "HR" || rc === "RH"){
    // 全走者＋打者→得点
    var basesCopy = nb.slice();
    basesCopy.forEach(function(b){ moveRunner(b,4); });
    scored++; earnedScored++; // 打者分
    nb = [];
    ri = {};
  }

  nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
  return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// 走者イベント連動処理（WP/PB/ボーク/盗塁）
// 盗塁の場合: 1塁走者が盗塁 → 2塁走者は重盗か？を確認
function calcRunnerEventMovement(code, movingBases, curBases, runnerInfo){
  runnerInfo = runnerInfo || {};
  var nb = curBases.slice();
  var ri = JSON.parse(JSON.stringify(runnerInfo));
  var scored = 0, earnedScored = 0;
  // POE(牽制エラー)は守備エラーなので得点は全て非自責
  var isPOE = (code==="POE");

  movingBases.forEach(function(from){
    var idx = nb.indexOf(from);
    if(idx === -1) return;
    nb.splice(idx,1);
    var to = from + 1;
    if(to > 3){
      scored++;
      if(!isPOE && ri[from]&&ri[from].earned) earnedScored++;
      delete ri[from];
    } else {
      // POEで進んだ走者は非自責フラグを立てる
      var prevRi = ri[from]||{earned:true};
      ri[to] = isPOE ? {earned:false, order:prevRi.order} : prevRi;
      delete ri[from];
      nb.push(to);
    }
  });
  nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
  return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored};
}

// WP/PB/BALK: 全走者が1つ進む（デフォルト）- ただし確認を出す
function getWPDefaultMovement(curBases){
  return curBases.filter(function(b){return b>=1&&b<=3;});
}

// 盗塁時の連動確認が必要かチェック
// 1塁走者盗塁 → 2塁走者がいれば「重盗?」確認
// 複数走者がいてWP/PB → 「全員進む?」確認
function needsRunnerConfirm(code, movingBases, curBases){
  if(code==="SB"||code==="CS"){
    // 盗塁で他の塁にも走者がいれば確認
    var others = curBases.filter(function(b){return b>=1&&b<=3&&!movingBases.includes(b);});
    return others.length > 0;
  }
  return false;
}



// ============================================================
// カウントロジック
// ============================================================
function getCount(pitches){
  // 表示用（上限あり: B=3, S=2）
  var b=0,s=0,hbp=false;
  for(var i=0;i<pitches.length;i++){
    var p=pitches[i];
    if(p==="HBP"){hbp=true;break;}
    if(p==="B"){if(b<3)b++;}
    else if(p==="S"||p==="SW"){if(s<2)s++;}
    else if(p==="F"){if(s<2)s++;}
  }
  return{b:b,s:s,hbp:hbp};
}
function getRawCount(pitches){
  // 判定用（上限なし）
  var b=0,s=0,hbp=false;
  for(var i=0;i<pitches.length;i++){
    var p=pitches[i];
    if(p==="HBP"){hbp=true;break;}
    if(p==="B")b++;
    else if(p==="S"||p==="SW")s++;
    else if(p==="F"){if(s<2)s++;}
  }
  return{b:b,s:s,hbp:hbp};
}
function checkAuto(pitches){
  if(!pitches||pitches.length===0)return null;
  var cnt=getRawCount(pitches);
  if(cnt.hbp)return"HBP";
  if(cnt.b>=4)return"BB";
  var last=pitches[pitches.length-1];
  if(cnt.s>=3){
    if(last==="S")return"K";
    if(last==="SW")return"KWP_READY";
    if(last==="F")return"K3B_HINT";
  }
  return null;
}

function smallDiamondSvg(bases,size){
  size=size||60;
  var c=size/2,r=size*0.34,sq=size*0.1;
  var pts={2:[c,c-r],1:[c+r,c],3:[c-r,c],H:[c,c+r]};
  var poly=Object.keys(pts).map(function(k){return pts[k].join(",");}).join(" ");
  var rects=Object.keys(pts).map(function(b){
    var xy=pts[b],x=xy[0],y=xy[1];
    var f=(bases||[]).includes(Number(b));
    return'<rect x="'+(x-sq)+'" y="'+(y-sq)+'" width="'+(sq*2)+'" height="'+(sq*2)+'" rx="2" fill="'+(f?"#e53935":"white")+'" stroke="'+(f?"#c00":"#bbb")+'" stroke-width="1.3"/>';
  }).join("");
  return'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><polygon points="'+poly+'" fill="none" stroke="#ccc" stroke-width="1.3"/>'+rects+'</svg>';
}

// ============================================================
// ヘルプ用ダイヤモンドSVG
// opts: {
//   runPath: [1,2,3,"H"] — 赤い走塁線
//   brText: "K" — 右下テキスト
//   brColor: "#c00" — 右下テキスト色
//   trText: "HR" — 右上テキスト
//   trColor: "#e53935" — 右上テキスト色
//   centerText: "II" — 中央テキスト（アウト数）
//   centerCircle: true — 得点の赤丸
//   centerCircleEmpty: true — 自責点なしの白丸
//   leftText: "P" — 左縦線（投手交代）
//   sideText: "S" — 走塁ライン上の盗塁記号など
//   sideTextPos: "1to2" — S表示位置（"1to2","2to3","3toH","top"）
//   pitcherLine: true — 左縦線（投手交代）
//   runLineColor: "#e53935" — 走塁線色（デフォルト赤）
// }
// ============================================================
function helpDiamondSvg(opts, size){
  size = size || 72;
  opts = opts || {};
  var cx = size/2, r = size*0.33, sq = size*0.095;
  var home=[cx, cx+r], first=[cx+r, cx], sec=[cx, cx-r], third=[cx-r, cx];
  var bMap={"1":first,"2":sec,"3":third,"H":home};

  // 外枠（スコア用紙の仕切り線）
  var border = '<rect x="0" y="0" width="'+size+'" height="'+size+'" fill="white" stroke="#ddd" stroke-width="0.5"/>';
  // 左半分の縦線（カウント欄仕切り）
  var divLine = '<line x1="'+(size*0.32)+'" y1="0" x2="'+(size*0.32)+'" y2="'+size+'" stroke="#ddd" stroke-width="0.5"/>';

  // ダイヤモンド塁ボックス
  var poly = [home,first,sec,third].map(function(p){return p.join(",");}).join(" ");
  var diamond = '<polygon points="'+poly+'" fill="#f8fff8" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/>';

  // 塁ボックス
  function bRect(xy){
    return '<rect x="'+(xy[0]-sq)+'" y="'+(xy[1]-sq)+'" width="'+(sq*2)+'" height="'+(sq*2)+'" rx="2" fill="white" stroke="#bbb" stroke-width="1"/>';
  }
  var rects = bRect(home)+bRect(first)+bRect(sec)+bRect(third);

  // 走塁ライン（赤線）
  var runLines = "";
  var rp = opts.runPath || [];
  var lineColor = opts.runLineColor || "#e53935";
  if(rp.length > 0){
    var pts2 = [home].concat(rp.map(function(b){return bMap[String(b)];}).filter(Boolean));
    for(var i=0;i<pts2.length-1;i++){
      runLines += '<line x1="'+pts2[i][0]+'" y1="'+pts2[i][1]+'" x2="'+pts2[i+1][0]+'" y2="'+pts2[i+1][1]+'" stroke="'+lineColor+'" stroke-width="2.2" stroke-linecap="round"/>';
    }
  }

  // 中央要素（得点丸・アウト数）
  var centerElem = "";
  if(opts.centerCircle){
    var cr = size*0.13;
    centerElem = '<circle cx="'+cx+'" cy="'+cx+'" r="'+cr+'" fill="#e53935" stroke="none"/>';
  } else if(opts.centerCircleEmpty){
    var cr2 = size*0.13;
    centerElem = '<circle cx="'+cx+'" cy="'+cx+'" r="'+cr2+'" fill="none" stroke="#e53935" stroke-width="'+(size*0.028)+'"/>';
  } else if(opts.centerText){
    var cfs = size*0.17;
    centerElem = '<text x="'+cx+'" y="'+(cx+cfs*0.37)+'" text-anchor="middle" font-size="'+cfs+'" font-weight="900" fill="#222" font-family="serif">'+opts.centerText+'</text>';
  }

  // 右下テキスト
  var brElem = "";
  if(opts.brText){
    var brtLen = opts.brText.length;
    var brfs = brtLen > 5 ? size*0.10 : brtLen > 3 ? size*0.12 : size*0.14;
    var brCol = opts.brColor || "#333";
    brElem = '<text x="'+(size-2)+'" y="'+(size-3)+'" text-anchor="end" font-size="'+brfs+'" font-weight="900" fill="'+brCol+'" font-family="monospace">'+opts.brText+'</text>';
  }

  // 右上テキスト（HR/RHなど）
  var trElem = "";
  if(opts.trText){
    var trfs = size*0.12;
    var trCol = opts.trColor || "#e53935";
    trElem = '<text x="'+(size-2)+'" y="'+(size*0.18)+'" text-anchor="end" font-size="'+trfs+'" font-weight="900" fill="'+trCol+'" font-family="monospace">'+opts.trText+'</text>';
  }

  // 投手交代ライン（左縦線 + P）
  var pitcherMark = "";
  if(opts.pitcherLine){
    var pcx2 = size*0.06;
    pitcherMark = '<line x1="'+pcx2+'" y1="'+(size*0.48)+'" x2="'+pcx2+'" y2="'+(size*0.88)+'" stroke="#1565c0" stroke-width="2" stroke-linecap="round"/>'+
      '<text x="'+(pcx2+3)+'" y="'+(size*0.9)+'" font-size="'+(size*0.12)+'" fill="#1565c0" font-weight="bold">P</text>';
  }

  // 走塁ライン途中の記号（盗塁S、WP、PBなど）
  var lineSymElem = "";
  if(opts.sideText){
    var posMap = {
      "1to2": [(first[0]+sec[0])/2, (first[1]+sec[1])/2],
      "2to3": [(sec[0]+third[0])/2, (sec[1]+third[1])/2],
      "3toH": [(third[0]+home[0])/2, (third[1]+home[1])/2],
      "HtoH": [cx, cx-r*0.3],
      "top":  [size*0.72, size*0.22]
    };
    var spos = posMap[opts.sideTextPos||"top"] || [size*0.72, size*0.22];
    var sfs = size*0.13;
    var scol = opts.sideTextColor || "#1565c0";
    lineSymElem = '<text x="'+spos[0]+'" y="'+(spos[1]+sfs*0.35)+'" text-anchor="middle" font-size="'+sfs+'" font-weight="bold" fill="'+scol+'" font-family="monospace">'+opts.sideText+'</text>';
  }

  // 牽制矢印（左上に "> o" スタイル）
  var pickoffElem = "";
  if(opts.pickoff){
    var pofs = size*0.12;
    pickoffElem = '<text x="'+(size*0.04)+'" y="'+(size*0.22)+'" font-size="'+pofs+'" fill="#555" font-weight="bold">o</text>'+
      '<text x="'+(size*0.04)+'" y="'+(size*0.36)+'" font-size="'+pofs+'" fill="#555" font-weight="bold">&gt;</text>'+
      '<text x="'+(size*0.04)+'" y="'+(size*0.50)+'" font-size="'+pofs+'" fill="#555" font-weight="bold">o</text>';
  }

  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    border+divLine+diamond+runLines+rects+
    centerElem+pitcherMark+lineSymElem+pickoffElem+
    brElem+trElem+
    '</svg>';
}

// 早稲田式ダイヤモンドSVG
function wasedaDiamondSvg(ab,size){
  size=size||104;
  if(!ab)return'<svg width="'+size+'" height="'+size+'"></svg>';
  var c=size/2,r=size*0.36,sq=size*0.105;
  var home=[c,c+r],first=[c+r,c],sec=[c,c-r],third=[c-r,c];
  var bMap={"1":first,"2":sec,"3":third,"H":home};
  var rc=ab.result||"";
  var sel=ab.defense||{};
  var rp=ab.runPath||[];
  var scored=(ab.scored>0)||rp.includes("H"); // 走者ホームイン or 打者自身のホームイン
  var f1=sel.fielder1,f2=sel.throwTo,f3=sel.throwTo2,err=sel.errorWho;

  // 走塁ライン
  var runLines="";
  if(rp.length>0){
    var pts2=[home].concat(rp.map(function(b){return bMap[String(b)];}).filter(Boolean));
    for(var i=0;i<pts2.length-1;i++){
      runLines+='<line x1="'+pts2[i][0]+'" y1="'+pts2[i][1]+'" x2="'+pts2[i+1][0]+'" y2="'+pts2[i+1][1]+'" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>';
    }
  }

  // 得点リング
  var scoredRing=""; // centerElemの赤丸に統合

  // 塁ボックス
  function bRect(xy){
    var x=xy[0],y=xy[1];
    return'<rect x="'+(x-sq)+'" y="'+(y-sq)+'" width="'+(sq*2)+'" height="'+(sq*2)+'" rx="2" fill="white" stroke="#bbb" stroke-width="1.2"/>';
  }

  // 右下記号
  var pitcherChanged=!!(ab.pitcherChanged);
  var brSym="",brColor="#333";
  var OUT_CODES=["K","SK","K3B","GO","FO","LO","IFF","SAC","SQ","SQE","SF","DP"];
  var isOut=OUT_CODES.includes(rc);
  if(rc==="K")       {brSym=""; brColor="#c00";}
  else if(rc==="SK") {brSym=""; brColor="#c00";}
  else if(rc==="BB") {brSym="B"; brColor="#0066cc";}
  else if(rc==="HBP"){brSym="死"; brColor="#f57c00";}
  else if(rc==="GO"||rc==="SAC"){
    if(f1&&f2){brSym=f1+"∪"+f2;if(f3)brSym+="∪"+f3;}
    else if(f1)brSym=String(f1);
    else brSym="G";
    if(err)brSym+="\nE"+err;
    brColor=err?"#e67e22":"#333";
    if(rc==="SAC")brSym="SAC";
  }
  else if(rc==="FO"||rc==="SF"){
    brSym=f1?(f1+"∩"):"F∩";
    if(err)brSym+="\nE"+err;
    if(rc==="SF")brSym="SF";
    brColor=err?"#e67e22":"#333";
  }
  else if(rc==="LO"){brSym=f1?(f1+"L"):"L";}
  else if(rc==="DP"){
    if(f1&&f2){brSym=f1+"∪"+f2;if(f3)brSym+="∪"+f3;}else brSym="DP";
  }
  else if(rc==="E") {brSym=err?(String(err)+"E"):"E"; brColor="#e67e22";}
  else if(rc==="FC"){brSym=f1?("FC"+f1):"FC"; brColor="#9b59b6";}
  else if(rc==="GO_E"){
    if(f1&&f2){brSym=f1+"∪"+f2;}
    else if(f1){brSym=String(f1);}
    else brSym="G";
    if(err)brSym+="E"+err;
    brColor="#e67e22"; // エラー出塁
  }
  else if(rc==="IFF"){brSym=f1?(f1+"IFF"):"IFF"; brColor="#546e7a";}
  else if(rc==="KWP"){brSym=""; brColor="#6a1b9a";}
  else if(rc==="OBI"){brSym="OBI"; brColor="#ad1457";}
  // ヒット系（守備番号付き）
  else if(rc==="1H"){var sbase=(ab.sym&&ab.sym.sym)||"H"; brSym=sbase; brColor="#1b7a3e";}
  else if(rc==="2H"){brSym=(ab.sym&&ab.sym.sym)||"2H"; brColor="#157a32";}
  else if(rc==="3H"){brSym=(ab.sym&&ab.sym.sym)||"3H"; brColor="#0e6128";}
  // HR/RH は右上のみ

  // 右上記号
  var trSym="";
  if(rc==="HR"||rc==="RH")trSym=rc;
  // タイムリー打者: 右上に打点数を表示（HR/RH以外）
  if(!trSym&&ab.isTimely&&ab.timelyCount>0) trSym=ab.timelyCount+"打点";
  if(!trSym&&ab.isForcedIn&&ab.timelyCount>0) trSym="押出";
  // タイムリー情報（SVGで使う）
  var isTimelyHit=!!(ab.isTimely&&ab.timelyCount>0);

  // 中央 得点番号
  var scoredNum=ab.scoredNum||0;
  var centerElem="";
  var outCountAfterVal=ab.outCountAfter||0;
  var OUT_CODES2=["K","SK","K3B","GO","FO","LO","IFF","SAC","SQ","SQE","SF","DP"];
  var isOutResult=OUT_CODES2.includes(rc);
  if(scored){
    // 得点: ダイヤモンド中央に赤い◯（小さめ）
    var crBig=size*0.18;
    centerElem='<circle cx="'+c+'" cy="'+c+'" r="'+crBig+'" fill="none" stroke="#e53935" stroke-width="'+(size*0.045)+'"/>';
  } else if(isOutResult&&outCountAfterVal>0){
    // アウト: 中央に黒でⅠ/Ⅱ/Ⅲ
    var outRomanMap=["I","II","III"];
    var outRoman=outRomanMap[Math.min(outCountAfterVal,3)-1]||"I";
    var outFsz=size*0.18;
    centerElem='<text x="'+c+'" y="'+(c+outFsz*0.38)+'" text-anchor="middle" font-size="'+outFsz+'" font-weight="900" fill="#333" font-family="serif">'+outRoman+'</text>';
  }

  // ── 三振の特殊記号 ──
  var specialKSvg="";
  if(rc==="SK"){
    // 空振り三振: 普通のK
    var kx2=size-3, ky2=size-5, kfs2=Math.round(size*0.12);
    specialKSvg='<text x="'+kx2+'" y="'+ky2+'" text-anchor="end" font-size="'+kfs2+'" font-weight="900" fill="#c00" font-family="monospace">K</text>';
  } else if(rc==="K"){
    // 見逃し三振: Kの右上に小さい○
    var kx3=size-3, ky3=size-5, kfs3=Math.round(size*0.12);
    specialKSvg='<text x="'+kx3+'" y="'+ky3+'" text-anchor="end" font-size="'+kfs3+'" font-weight="900" fill="#c00" font-family="monospace">K</text>'+
      '<circle cx="'+(kx3+1)+'" cy="'+(ky3-kfs3+1)+'" r="'+(size*0.025)+'" fill="none" stroke="#c00" stroke-width="1.2"/>';
  } else if(rc==="KWP"){
    // 振り逃げ: 左右反転K
    var kx4=size-3, ky4=size-5, kfs4=Math.round(size*0.12);
    specialKSvg='<g transform="translate('+(kx4)+','+(ky4)+')"><text x="0" y="0" text-anchor="end" font-size="'+kfs4+'" font-weight="900" fill="#6a1b9a" font-family="monospace" transform="scale(-1,1)">K</text></g>';
  } else if(rc==="K3B"){
    // 3バント三振: K with ◆ (filled diamond mark)
    var kx5=size-3, ky5=size-5, kfs5=Math.round(size*0.12);
    specialKSvg='<text x="'+(kx5-kfs5*0.5)+'" y="'+ky5+'" text-anchor="end" font-size="'+(kfs5*0.6)+'" font-weight="900" fill="#c00" font-family="sans-serif">◆</text>'+
      '<text x="'+kx5+'" y="'+ky5+'" text-anchor="end" font-size="'+kfs5+'" font-weight="900" fill="#c00" font-family="monospace">K</text>';
  }

  // 残塁: 中央にℓ（アウトでも得点でもない、チェンジ時に塁に残った走者）
  if(!centerElem && ab.isLeftOnBase){
    var lobFsz=size*0.22;
    centerElem='<text x="'+c+'" y="'+(c+lobFsz*0.35)+'" text-anchor="middle" font-size="'+lobFsz+'" font-weight="400" fill="#555" font-family="serif" font-style="italic">ℓ</text>';
  }

  // ── 左下: 得点時に打ってくれた打者の打順（生還に貢献した打者）──
  var blElem="";
  if(ab.scoredByBatterOrder && ab.scoredByBatterOrder > 0){
    var blx=3, bly=size-4, blfs=Math.round(size*0.09);
    blElem='<text x="'+blx+'" y="'+bly+'" text-anchor="start" font-size="'+blfs+'" font-weight="bold" fill="#c62828" font-family="monospace">'+ab.scoredByBatterOrder+'</text>';
  }

  // 右下テキスト描画
  function drawBR(sym,x,y,fsz,col){
    if(!sym)return"";
    var lines=sym.split("\n");
    var fs=sym.replace(/\n/g,"").length>4?7:sym.replace(/\n/g,"").length>3?8:fsz;
    return lines.map(function(l,i){
      return'<text x="'+x+'" y="'+(y+(i-(lines.length-1)/2)*fs*1.4)+'" text-anchor="end" font-size="'+fs+'" font-weight="900" fill="'+col+'" font-family="monospace">'+l+'</text>';
    }).join("");
  }
  function drawTR(sym,x,y,fsz,col){
    if(!sym)return"";
    return'<text x="'+x+'" y="'+y+'" text-anchor="end" font-size="'+fsz+'" font-weight="900" fill="'+col+'" font-family="monospace">'+sym+'</text>';
  }

  // 投手交代マーク（左辺に縦線 + P の文字）
  var pitcherChangeMark="";
  if(pitcherChanged){
    var pcx=size*0.06;
    var pcy1=size*0.50, pcy2=size*0.88;
    var pcfs=Math.round(size*0.10);
    var pcPitchNum=ab.pitcherChangedAtPitch||"";
    pitcherChangeMark='<line x1="'+pcx+'" y1="'+pcy1+'" x2="'+pcx+'" y2="'+pcy2+'" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>'+
      '<text x="'+(pcx+4)+'" y="'+(pcy2)+'" font-size="'+pcfs+'" fill="#1565c0" font-weight="bold">P</text>'+
      (pcPitchNum?'<text x="'+(pcx+4)+'" y="'+(pcy1-2)+'" font-size="'+(pcfs*0.8)+'" fill="#1565c0" font-weight="bold">'+pcPitchNum+'球</text>':"");
  }

  // ── 走者アウトマーク（牽制・盗塁失敗・走塁死など） ──
  // ab.runnerOutEvents[] = [{code, outBase, defNum, label}]
  var runnerOutMarks="";
  var roe=ab.runnerOutEvents||[];
  if(roe.length>0){
    // アウトコードの略称マップ
    var outSymMap={PO:"牽",CS:"盗×",ROUT:"走×",RUNDOWN:"挟",K:"K",SK:"SK"};
    roe.forEach(function(ev){
      var outPt=bMap[String(ev.outBase)];
      if(!outPt)return;
      var ox=outPt[0], oy=outPt[1];
      var sz2=size*0.10; // ✕の大きさ
      var sym2=outSymMap[ev.code]||(ev.code||"×").substring(0,2);
      // 塁マスの右上に小さく ✕ とアウト種別を描画
      var rx=ox+size*0.07, ry=oy-size*0.07;
      runnerOutMarks+=
        // ✕ マーク（赤）
        '<line x1="'+(rx-sz2)+'" y1="'+(ry-sz2)+'" x2="'+(rx+sz2)+'" y2="'+(ry+sz2)+'" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>'+
        '<line x1="'+(rx+sz2)+'" y1="'+(ry-sz2)+'" x2="'+(rx-sz2)+'" y2="'+(ry+sz2)+'" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>'+
        // アウト種別ラベル（さらに右上に小さく）
        '<text x="'+(rx+sz2+2)+'" y="'+(ry-sz2)+'" font-size="'+(size*0.09)+'" fill="#c62828" font-weight="bold">'+sym2+'</text>';
    });
  }

  // ── 走者イベント記号（盗塁S、暴投WP、捕逸PB、ボークBKなど） ──
  // スコアブックの書き方に準拠: 走塁ラインの途中に記号を小さく表示
  var runnerEventMarks="";
  var reArr=ab.runnerEvents||[];
  if(reArr.length>0){
    // イベント種別→SVG表示記号マップ（スコアブック標準）
    var evSymMap={
      "SB":"S",      // 盗塁 STEAL → S
      "DS":"S",      // 重盗 → S
      "TS":"S",      // 三重盗 → S
      "WP":"WP",     // 暴投 WILD PITCH
      "PB":"PB",     // 捕逸 PASS BALL
      "BK":"BK",     // ボーク BALK
      "OA":"OA",     // オーバーラン・アウト
    };
    reArr.forEach(function(ev){
      var sym2=evSymMap[ev.code];
      if(!sym2)return;
      // 走塁ライン上（進塁した先の塁の近く）に表示
      // fromBasesの最初の塁→次の塁の中間点
      var fromB=ev.fromBases&&ev.fromBases[0];
      if(!fromB)return;
      var toB=fromB+1; // 盗塁は1塁進む想定（1→2、2→3、3→H）
      var fromPt=bMap[String(fromB)];
      var toPt=bMap[String(toB>3?"H":toB)];
      if(!fromPt||!toPt)return;
      // 中間点に表示
      var mx=(fromPt[0]+toPt[0])/2;
      var my=(fromPt[1]+toPt[1])/2;
      var fs2=Math.round(size*0.095);
      var color2=(ev.code==="SB"||ev.code==="DS"||ev.code==="TS")?"#1565c0":"#6a1b9a";
      // イベント記号
      runnerEventMarks+=
        '<text x="'+mx+'" y="'+(my+fs2*0.35)+'" text-anchor="middle"'+
        ' font-size="'+fs2+'" font-weight="bold" fill="'+color2+'"'+
        ' font-family="monospace">'+sym2+'</text>';
      // 投球番号ティック（何球目の時のイベントか）
      if(ev.pitchNum>0){
        var tickStr="";
        for(var ti=0;ti<Math.min(ev.pitchNum,5);ti++){tickStr+="'";}
        if(ev.pitchNum>5)tickStr=String(ev.pitchNum);
        runnerEventMarks+=
          '<text x="'+(mx+fs2*0.5)+'" y="'+(my-fs2*0.2)+'" text-anchor="start"'+
          ' font-size="'+(fs2*0.7)+'" fill="'+color2+'" font-family="monospace">'+tickStr+'</text>';
      }
    });
  }

  return'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<polygon points="'+[home,first,sec,third].map(function(p){return p.join(",");}).join(" ")+'" fill="#f9fff7" stroke="#ddd" stroke-width="1"/>'+
    '<polygon points="'+[home,first,sec,third].map(function(p){return p.join(",");}).join(" ")+'" fill="none" stroke="#bbb" stroke-width="1.3"/>'+
    runLines+
    bRect(home)+bRect(first)+bRect(sec)+bRect(third)+
    scoredRing+centerElem+pitcherChangeMark+runnerOutMarks+runnerEventMarks+
    blElem+
    specialKSvg+
    drawBR(brSym,size-2,size-4,9,brColor)+
    drawTR(trSym,size-2,10,9,"#c62828")+
    '</svg>';
}

// ============================================================
// スコア記号・守備メモ
// ============================================================
function buildSym(sel){
  if(!sel)return{sym:"?",desc:"",color:"#888"};
  var ht=sel.hitType||"";
  var f1=sel.fielder1,f2=sel.throwTo,f3=sel.throwTo2,err=sel.errorWho;

  // ヒット系
  if(ht==="1H"||ht==="2H"||ht==="3H"){
    var baseLabel=ht==="1H"?"H":ht==="2H"?"2H":"3H";
    var sym=f1?(f1+baseLabel):baseLabel;
    if(sel.extraBase)sym+="(→"+sel.extraBase+"塁)";
    if(sel.extraReason==="E"&&err)sym+="\nE"+err;
    // 内野手（1〜6）なら「内野安打」、外野手（7〜9）なら「前ヒット」と表記
    var isInfield=f1&&f1<=6;
    var hitDesc=ht==="1H"?(isInfield?"内野安打":"前ヒット"):ht==="2H"?"二塁打":"三塁打";
    var desc=(f1?POSITIONS[f1]||"":"")+hitDesc;
    if(sel.extraBase)desc+=" →"+sel.extraBase+"塁";
    return{sym:sym,desc:desc,color:"#1b7a3e"};
  }
  if(ht==="HR")return{sym:"HR",  desc:"本塁打",        color:"#e53935"};
  if(ht==="RH")return{sym:"RH",  desc:"ランニングHR",  color:"#b71c1c"};
  if(ht==="BB")return{sym:"B",   desc:"四球",          color:"#0066cc"};
  if(ht==="HBP")return{sym:"死", desc:"死球",          color:"#f57c00"};
  if(ht==="K") return{sym:"K",   desc:"三振（見逃し）",color:"#c00"};
  if(ht==="SK")return{sym:"SK",  desc:"三振（空振り）",color:"#8b0000"};
  if(ht==="KWP")return{sym:"振逃",desc:"振り逃げ出塁", color:"#6a1b9a"};
  if(ht==="OBI")return{sym:"妨",desc:"走塁妨害出塁",  color:"#ad1457"};
  if(ht==="CI") return{sym:"CI", desc:"打撃妨害出塁（捕手インターフェア）",color:"#ad1457"};
  if(ht==="K3B")return{sym:"K",  desc:"三振（3バント失敗）",color:"#c00"};
  if(ht==="GO"||ht==="SAC"||ht==="SQ"||ht==="GO_E"||ht==="SACE"){
    var s="";
    if(f1){if(f2){s=f1+"∪"+f2;if(f3)s+="∪"+f3;}else s=String(f1);}else s="G";
    if(ht==="SAC")s="SAC";
    if(ht==="SQ")s="SQ"+(f1?f1:"");
    if(ht==="SACE"){s=f1?(String(f1)+"E"+err):"E"; s+="(SAC)"; }
    if(ht==="GO_E"&&err)s+=String(f1||"")+"E"+err;
    var col={"GO":"#546e7a","SAC":"#78909c","SQ":"#2e7d32","GO_E":"#e67e22","SACE":"#e67e22"}[ht]||"#546e7a";
    var descMap={GO:"ゴロ",SAC:"犠打",SQ:"スクイズ",GO_E:"ゴロエラー出塁",SACE:"犠打エラー出塁"};
    return{sym:s,desc:(f1?POSITIONS[f1]||"":"")+descMap[ht]+(err?"("+POSITIONS[err]+"E)":""),color:col};
  }
  if(ht==="IFF"){
    return{sym:f1?(f1+"IFF"):"IFF",desc:(f1?POSITIONS[f1]||"":"")+"インフィールドフライ",color:"#546e7a"};
  }
  if(ht==="BH"){
    // バントヒット: 守備番号+BH
    var bhSym=f1?(f1+"BH"):"BH";
    var bhWho=f1?(POSITIONS[f1]+"前の"):"";
    return{sym:bhSym,desc:"バントヒット（"+bhWho+"内野安打）",color:"#1b7a3e"};
  }
  if(ht==="SQE"){
    return{sym:"SQE",desc:"スクイズ失敗（3塁走者タッチアウト）",color:"#c62828"};
  }
  if(ht==="FO"||ht==="SF"){
    var s2=f1?(f1+"∩"):"F∩";
    if(err)s2+="E"+err;
    if(ht==="SF")s2="SF";
    return{sym:s2,desc:(f1?POSITIONS[f1]||"":"")+"フライ"+(err?"("+POSITIONS[err]+"E)":""),color:err?"#e67e22":"#607d8b"};
  }
  if(ht==="LO")return{sym:f1?(f1+"L"):"L",desc:(f1?POSITIONS[f1]||"":"")+"ライナー",color:"#455a64"};
  if(ht==="DP"){
    var s3=f1?String(f1):"";
    if(f2)s3+="∪"+f2;if(f3)s3+="∪"+f3;if(!s3)s3="DP";
    return{sym:s3,desc:(f1?POSITIONS[f1]||"":"")+"→"+(f2?POSITIONS[f2]||"":"")+"ゲッツー",color:"#37474f"};
  }
  if(ht==="E")return{sym:err?(String(err)+"E"):"E",desc:(err?POSITIONS[err]||"":"")+"エラー",color:"#e67e22"};
  if(ht==="FC"){
    var fcBase=sel.throwTo?POSITIONS[sel.throwTo]||"":"";
    var fcOut=sel.runnerOutBase?{1:"一塁走者",2:"二塁走者",3:"三塁走者"}[sel.runnerOutBase]+"アウト":"";
    var sym5=f1?("FC"+f1):"FC";
    if(sel.throwTo)sym5+="→"+sel.throwTo;
    return{sym:sym5,desc:"野選"+(fcBase?"（"+fcBase+"へ送球）":"")+(fcOut?"・"+fcOut:""),color:"#0277bd"};
  }
  return{sym:ht||"?",desc:"",color:"#888"};
}

function buildDefNote(sel){
  if(!sel||!sel.fielder1)return"";
  var ht=sel.hitType||"";
  var f1=POSITIONS[sel.fielder1]||"",f2=sel.throwTo?POSITIONS[sel.throwTo]||"":"";
  var f3=sel.throwTo2?POSITIONS[sel.throwTo2]||"":"",err=sel.errorWho?POSITIONS[sel.errorWho]||"":"";
  if(ht==="1H"||ht==="2H"||ht==="3H"){
    var n=f1+"前ヒット";
    if(sel.extraBase)n+="→"+sel.extraBase+"塁";
    if(sel.extraReason==="E"&&err)n+="("+err+"エラー)";
    return n;
  }
  if(ht==="GO"||ht==="SAC"){var n2=f1+"捕球";if(f2)n2+="→"+f2+"送球";if(err)n2+="("+err+"E)";if(sel.outcome==="out")n2+=" アウト";else if(sel.outcome==="reach")n2+=" 打者出塁";return n2;}
  if(ht==="FO"||ht==="SF"){var n3=f1+"フライ";if(err)n3+="("+err+"E)";return n3;}
  if(ht==="LO")return f1+"ライナー";
  if(ht==="IFF")return(f1||"内野手")+"インフィールドフライ";
  if(ht==="GO_E"){var n2=f1?(f1+"捕球"):"ゴロ";if(f2)n2+="→"+POSITIONS[f2]+"送球";if(err)n2+="("+POSITIONS[err]+"E) 出塁";return n2;}
  if(ht==="DP")return f1+"→"+f2+(f3?"→"+f3:"")+"ゲッツー";
  if(ht==="E")return(err||f1)+"エラー";
  if(ht==="FC")return f1+"野選";
  return"";
}

function calcRunPath(rc,sel){
  sel=sel||{};
  var extra=sel.extraBase;
  if(rc==="HR"||rc==="RH")return[1,2,3,"H"];
  if(rc==="3H"){if(extra==="H")return[1,2,3,"H"];return[1,2,3];}
  if(rc==="2H"){if(extra==="3")return[1,2,3];if(extra==="H")return[1,2,3,"H"];return[1,2];}
  if(rc==="1H"){if(extra==="2")return[1,2];if(extra==="3")return[1,2,3];if(extra==="H")return[1,2,3,"H"];return[1];}
  if(["BB","HBP","E","FC","KWP","OBI","GO_E","CI","BH","SACE"].includes(rc))return[1];
  if(rc==="IFF")return[]; // インフィールドフライは打者アウト、走者は動かない
  return[];
}

    curSide:S.curSide,curInning:S.curInning,

function undoLastAtBat(){
  if(!S.history||S.history.length===0){render();return;}
  var snap=S.history[0];
  S.history=S.history.slice(1);
  S.game=snap.game;
  S.curSide=snap.curSide;S.curInning=snap.curInning;

  S.editingSlot=snap.editingSlot||null;
  if(snap.pitchers)S.pitchers=snap.pitchers;
  S.curPitches=[];S.autoMsg=null;S.pendingRunnerEvents=[];S._pitcherChangedMidAB=false;S._pitcherChangedAtPitch=0;S.modal=null;

}
