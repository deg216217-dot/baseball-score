// ウィザード
// ============================================================
function recordHitCombo(hitType, fielder){
  // ヒット統合モーダルから直接記録（1ステップ）
  var sel={hitType:hitType, fielder1: fielder!==null ? fielder : undefined};
  var sym=buildSym(sel);
  S.modal=null;
  startRunnerConfirmIfNeeded(hitType, sym, sel);
}
function defWizStart(hitType){
  // 全打球種を新ワンパネルモードで開く
  S.modal={type:"defense_wiz",wiz:{step:"panel",sel:{hitType:hitType}}};
  render();
}
function defWizAdvance(wiz){
  // ワンパネルモード: ステップ遷移不要（sel の状態だけで表示を制御）
  if(wiz.step==="panel")return;
  var sel=wiz.sel,ht=sel.hitType;
  // ヒット系
  if(ht==="1H"||ht==="2H"||ht==="3H"){
    if(sel.fielder1===undefined){wiz.step="hit_fielder";return;}
    // hit_extra_ask廃止: 余分な進塁は走者確認モーダルで対応
    // if(sel.hasExtra&&...) → 不要
    // if(sel.hasExtra&&...) → 不要
    // if(sel.hasExtra&&...) → 不要
    wiz.step="confirm";return;
  }
  if(ht==="GO"||ht==="SAC"){
    if(!sel.fielder1){wiz.step="fielder_main";return;}
    // 送球先を聞く（送球なし=skipならthrowTo="none"がセットされる）
    if(!sel.askedThrow){sel.askedThrow=true;wiz.step="throw_to";return;}
    if(sel.throwTo===undefined)return;
    // エラーの確認: 送球がある場合のみ（送球なし=自分でタッチはエラーなし前提）
    var hadThrow=(sel.throwTo&&sel.throwTo!=="none");
    if(hadThrow&&!sel.askedError){sel.askedError=true;wiz.step="error_ask";return;}
    if(hadThrow&&sel.hasError===undefined)return;
    if(sel.hasError&&!sel.errorWho){wiz.step="error_who";return;}
    // outcome（アウト/出塁）: エラーがあった場合のみ表示
    if(sel.hasError&&!sel.outcome){wiz.step="outcome";return;}
    // エラーなし or 送球なし → 即confirm（アウト確定）
    if(!sel.hasError){sel.outcome="out";}
    wiz.step="confirm";return;
  }
  if(ht==="FO"||ht==="SF"){
    if(!sel.fielder1){wiz.step="fielder_main";return;}
    // FO/SF: フライなのでエラー（落球）は稀 → 確認省略してconfirm
    // エラーがあったなら「エラーで出塁」を選んでもらう
    if(!sel.askedError){sel.askedError=true;sel.hasError=false;}
    wiz.step="confirm";return;
  }
  if(ht==="LO"){if(!sel.fielder1){wiz.step="fielder_main";return;}wiz.step="confirm";return;}
  if(ht==="DP"){
    if(!sel.fielder1){wiz.step="fielder_main";return;}
    if(!sel.throwTo){wiz.step="throw_to";return;}
    if(sel.throwTo2===undefined){wiz.step="throw_to2";return;}
    wiz.step="confirm";return;
  }
  if(ht==="IFF"){if(!sel.fielder1){wiz.step="fielder_main";return;}wiz.step="confirm";return;}
  if(ht==="E"){if(!sel.fielder1){wiz.step="fielder_main";return;}if(!sel.errorWho){wiz.step="error_who";return;}wiz.step="confirm";return;}
  if(ht==="FC"){
    if(!sel.fielder1){wiz.step="fielder_main";return;}
    // FCは送球先（どこでアウトにしようとしたか）を確認
    if(!sel.throwTo){wiz.step="throw_to";return;}
    // アウトになった走者の塁を確認
    if(sel.runnerOutBase===undefined){wiz.step="fc_runner_out";return;}
    wiz.step="confirm";return;
  }
  wiz.step="confirm";
}
function defWizBack(){
  if(!S.modal||S.modal.type!=="defense_wiz")return;
  // ワンパネルモードでは「戻る」= モーダルを閉じる
  if(S.modal.wiz&&S.modal.wiz.step==="panel"){S.modal=null;render();return;}
  var sel=S.modal.wiz.sel,ht=sel.hitType;
  var isHit=ht==="1H"||ht==="2H"||ht==="3H";
  var order=isHit
    ?["errorWho","extraReason","extraBase","hasExtra","fielder1"]
    :ht==="FC"
      ?["runnerOutBase","throwTo","fielder1"]
      :["outcome","errorWho","hasError","askedError","throwTo2","throwTo","askedThrow","fielder1"];
  for(var i=0;i<order.length;i++){
    var k=order[i];
    if(sel[k]!==undefined){
      if(k==="hasError"){delete sel.askedError;delete sel.hasError;delete sel.errorWho;}
      else if(k==="askedThrow"){delete sel.askedThrow;delete sel.throwTo;delete sel.askedError;delete sel.hasError;delete sel.errorWho;delete sel.outcome;}
      else if(k==="hasExtra"){delete sel.hasExtra;delete sel.extraBase;delete sel.extraReason;delete sel.errorWho;}
      else delete sel[k];
      break;
    }
  }
  // fielder_main / hit_fielder が最初のステップなら閉じる（キャンセル）
  var currentStep=S.modal.wiz.step;
  if(currentStep==='fielder_main'||currentStep==='hit_fielder'){
    S.modal=null;render();return;
  }
  defWizAdvance(S.modal.wiz);render();
}
function defWizConfirm(){
  if(!S.modal||S.modal.type!=="defense_wiz")return;
  var sel=S.modal.wiz.sel;
  var rc=sel.hitType;
  // GOエラー出塁 → rc="GO_E"（打者が3塁まで進んだケース等に対応）
  // FOエラー落球出塁 → rc="E"（通常通り）
  if(sel.hitType==="GO"&&sel.outcome==="reach") rc="GO_E";
  else if(sel.hitType==="SAC"&&sel.outcome==="reach") rc="SACE";
  S.modal=null;
  startRunnerConfirmIfNeeded(rc, buildSym(sel), sel);
}
function defWizCommitHitSkip(){
  if(!S.modal||S.modal.type!=="defense_wiz")return;
  var sel=S.modal.wiz.sel;
  var rc=sel.hitType;
  S.modal=null;
  startRunnerConfirmIfNeeded(rc, buildSym(sel), sel);
}

// ============================================================
// 走者進塁確認ウィザード
// 「この打席結果の時に、各走者がどこまで進んだか」を確認
// ============================================================

// 走者確認が必要かどうか判定し、必要なら先に確認、不要ならそのままcommit
function startRunnerConfirmIfNeeded(rc, sym, sel){
  var bases = S.curBases.slice();

  // 自動処理できるケース（確認不要）
  var autoOk = ["K","SK","K3B","BB","HBP","HR","RH","SAC","SQ","SQE","SF","DP","IFF","CI","OBI"].includes(rc); // KWPは走者確認あり（3塁走者の扱いのため）
  if(autoOk){
    // SQE: 打者三振(1アウト) + 3塁走者もアウト(追加1アウト) = 合計2アウト
    if(rc==="SQE"){
      var selSqe=Object.assign({},sel,{extraOuts:(sel.extraOuts||0)+1});
      commitAtBat(rc, sym, selSqe);
    } else {
      commitAtBat(rc, sym, sel);
    }
    return;
  }

  // 走者なし で ヒット系の場合: 打者の追加進塁のみ確認
  // ヒット系は打者自身がアウトになる可能性がある（2塁打→3塁でアウト等）
  // GO_E（ゴロエラー出塁）も「打者が出塁」なので、打者の到達塁を確認する
  var hitCodes = ["1H","2H","3H","BH","GO_E","E","CI","OBI","SACE"];
  var isHit = hitCodes.includes(rc);

  // 確認対象の走者を収集
  var runnersToCheck = bases.filter(function(b){return b>=1&&b<=3;});

  // ヒット系は「打者の追加進塁確認」も対象に追加
  // 打者は通常の進塁先より先に行こうとしてアウトになることがある
  // → 打者を仮想的な走者として追加（塁番号: "B" → 実際の到達塁に変換）
  // ただし打者の到達塁はdefaultで決まる（1H→1塁、2H→2塁、3H→3塁）
  // 打者が余分に進んだ/アウトになった場合のみ確認が必要

  if(runnersToCheck.length === 0 && !isHit){
    commitAtBat(rc, sym, sel);
    return;
  }
  if(runnersToCheck.length === 0 && isHit){
    // 走者なし・ヒット/出塁: 打者到達塁の確認
    // 1H→1塁, 2H→2塁, 3H→3塁, E/GO_E/CI/OBI/SACE/BH→1塁 がデフォルト
    var batterDefaultBase = rc==="2H"?2:rc==="3H"?3:1;
    var defaultMoves0 = {};
    // BH・SACE・CI・OBIは打者が1塁に行くのが確実 → 自動処理（確認不要）
    var batterIsAutoTo1 = ["BH","SACE","CI","OBI","2H","3H","HR","RH"].includes(rc);
    var batterHint0 = {"E":"エラー出塁なので打者は1塁へ。もし2塁以上に進んでいたら選択してください",
                       "GO_E":"ゴロエラーなので打者は1塁へ止まります"}[rc]||"この打者は何塁まで進みましたか？";
    defaultMoves0[0] = {to:String(batterDefaultBase), reason:"hit",
                        auto:batterIsAutoTo1, askNeeded:!batterIsAutoTo1,
                        isBatter:true, hint:batterHint0};
    S.modal={
      type:"runner_move_confirm",
      rc:rc, sym:sym, sel:sel,
      runners:[0],  // 0 = 打者
      moves:defaultMoves0,
      currentIdx:0,
      extraOuts:0
    };
    render();
    return;
  }

  // 各走者のデフォルト進塁先を計算
  var defaultMoves = calcDefaultRunnerMoves(rc, sel, bases);

  // ヒット・出塁系: 打者の到達塁も確認
  if(isHit){
    var batterDefault = rc==="2H"?2:rc==="3H"?3:1;
    var batterAutoTo1 = ["BH","SACE","CI","OBI","2H","3H","HR","RH"].includes(rc);
    var batterHint = rc==="GO_E"?"ゴロエラーの間に打者はどこまで進みましたか？":
                     rc==="E"?"エラーの間に打者はどこまで進みましたか？":
                     "この打者は何塁まで進みましたか？";
    defaultMoves[0] = {to:String(batterDefault), reason:"hit",
                       auto:batterAutoTo1, askNeeded:!batterAutoTo1,
                       isBatter:true, hint:batterHint};
    runnersToCheck = runnersToCheck.concat([0]);
  }

  S.modal = {
    type: "runner_move_confirm",
    rc: rc, sym: sym, sel: sel,
    runners: runnersToCheck,
    moves: defaultMoves,
    currentIdx: 0,
    extraOuts: 0
  };
  render();
}

// ============================================================
// 各走者のデフォルト進塁先を計算（ユーザーへの提案）
// hint: 提案理由の説明文（モーダルで表示）
// auto: true = 確認スキップ可, askNeeded: true = 必ず確認
// ============================================================
function calcDefaultRunnerMoves(rc, sel, bases){
  var moves = {};
  var hasError = !!(sel && (sel.errorWho || sel.hasError));

  bases.forEach(function(b){
    // ── ゴロ系（GO / SAC） ──
    if(rc === "GO" || rc === "SAC"){
      var forced = isForced(b, bases);
      if(forced){
        // フォース: 1つ進む（自動）
        var to = b+1>3 ? "H" : String(b+1);
        moves[b] = {to:to, reason:"force", auto:true,
          hint:"1塁が空くので自動的に1つ進みます"};
      } else if(hasError){
        // エラーあり: 非フォース走者も進む可能性→確認
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"エラーの混乱で1つ余分に進んだ場合は選択してください（通常は止まります）"};
      } else {
        // 通常ゴロ: 非フォース走者も進塁する場合あり → 確認
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"ゴロの間に進塁しましたか？（通常は止まります。打者アウトの隙に走れた場合は進んだ塁を選んでください）"};
      }
    }
    // ── フライ系（FO / SF） ──
    else if(rc === "FO" || rc === "SF"){
      if(hasError){
        // エラー落球: 走者が進める→確認
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"フライ落球エラーで走者が進んだ可能性があります"};
      } else if(b === 3){
        // 3塁走者: タッチアップでホームイン可能→確認
        moves[b] = {to:"H", reason:"tagup", auto:false, askNeeded:true,
          hint:"タッチアップ: フライが捕られた後に3塁→ホームへ走れます"};
      } else if(b === 2){
        // 2塁走者: タッチアップで3塁へ可能→確認
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"タッチアップ: フライ後に2塁→3塁へ進める場合があります"};
      } else {
        // 1塁走者: タッチアップで2塁に進む場合もある → 確認
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"フライ後、帰塁しましたか？タッチアップで2塁に進んだ場合は「2塁へ」を選択"};
      }
    }
    // ── ライナー系（LO） ──
    else if(rc === "LO"){
      // ライナー: 走者は帰塁できない可能性→全員確認
      moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
        hint:"ライナーは素早く捕られると走者が戻れない場合があります"};
    }
    // ── エラー出塁（E） ──
    else if(rc === "E"){
      var forced2 = isForced(b, bases);
      if(forced2){
        var to2 = b+1>3 ? "H" : String(b+1);
        moves[b] = {to:to2, reason:"force", auto:true,
          hint:"前の塁がつまっていないので自動で1つ進みます"};
      } else {
        // 非フォース走者: エラーの間に余分に進んだかもしれないが
        // 基本は「止まった」がデフォルト（エラーで時間稼ぎがないと通常は動かない）
        // ヒント: 連続エラーや送球エラーが起きた場合は余分に進む
        var errorerHint = "通常は止まります。";
        if(sel&&sel.fielder1&&sel.errorWho&&sel.fielder1!==sel.errorWho){
          // 捕球と送球が別の選手 → 送球エラーの可能性
          errorerHint = "送球ミスがあった場合、走者がさらに進んだかもしれません";
        } else if(sel&&sel.throwTo){
          errorerHint = "送球中にさらにミスがあった場合は選択してください";
        }
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:errorerHint};
      }
    }
    // ── 野選（FC） ──
    else if(rc === "FC"){
      var runnerOutBase2 = sel.runnerOutBase;
      if(b === runnerOutBase2){
        return; // このランナーはFCウィザードでアウト確定済み
      }
      var basesExcludingOut = bases.filter(function(bb){return bb!==runnerOutBase2;});
      var forced3 = isForced(b, basesExcludingOut);
      if(forced3){
        var to3 = b+1>3 ? "H" : String(b+1);
        moves[b] = {to:to3, reason:"force", auto:true,
          hint:"前の塁がつまっていないので自動で1つ進みます"};
      } else {
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"野選の間に走者が動いた可能性があります"};
      }
    }
    // ── 単打（1H） ──
    else if(rc === "1H"){
      if(b===3){
        moves[b]={to:"H",reason:"hit",auto:false,askNeeded:true,
          hint:"3塁走者は通常ホームに帰ります。もし阻止された場合は下のアウトボタンで"};
      } else if(b===2){
        moves[b]={to:"3",reason:"hit",auto:false,askNeeded:true,
          hint:"2塁走者は通常3塁へ進みます。さらに進んだ場合は「ホームイン」を選んでください"};
      } else if(b===1){
        // 1塁走者: 2塁か3塁か得点かを確認
        moves[b]={to:"2",reason:"hit",auto:false,askNeeded:true,
          hint:"1塁走者は2塁で止まった？それとも3塁まで進んだ？"};
      }
    }
    // ── 二塁打（2H） ──
    else if(rc === "2H"){
      if(b===3){
        moves[b]={to:"H",reason:"hit",auto:false,askNeeded:true,
          hint:"3塁走者は通常ホームインします。阻止された場合はアウトボタンを"};
      } else if(b===2){
        moves[b]={to:"H",reason:"hit",auto:false,askNeeded:true,
          hint:"2塁走者は二塁打でホームインするのが通常。3塁で止まった場合は選んでください"};
      } else if(b===1){
        // 1塁走者: 3塁か本塁か確認
        moves[b]={to:"3",reason:"hit",auto:false,askNeeded:true,
          hint:"1塁走者は3塁で止まった？それともホームまで帰った？"};
      }
    }
    // ── 三塁打（3H） ──
    else if(rc === "3H"){
      moves[b] = {to:"H", reason:"hit", auto:false, askNeeded:true,
        hint:"三塁打で全員ホームインが基本。途中でアウトになった場合は選択してください"};
    }
    // ── GOエラー出塁（GO_E）──
    else if(rc === "GO_E"){
      // ゴロエラー: 通常は走者が止まるがエラーの混乱で進む場合も
      // フォース走者は1つ進むが、非フォースは基本止まり
      var forcedGOE = isForced(b, bases);
      if(forcedGOE){
        moves[b] = {to:b+1>3?"H":String(b+1), reason:"force", auto:true,
          hint:"次の塁が空いているので自動で1つ進みます"};
      } else {
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"通常は止まります。エラーの混乱中に余分に進んだ場合は選択してください"};
      }
    }
    // ── 打撃妨害(CI) / 走塁妨害(OBI) ──
    else if(rc === "CI" || rc === "OBI"){
      // フォース走者は自動進塁
      var forcedCI = isForced(b, bases);
      if(forcedCI){
        moves[b] = {to: b+1>3?"H":String(b+1), reason:"force", auto:true,
          hint:"妨害による出塁でフォース進塁します"};
      } else {
        moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
          hint:"妨害があったので走者が余分に進んだかもしれません"};
      }
    }
    // ── インフィールドフライ（IFF）── 走者は動かない（自動）
    else if(rc === "IFF"){
      moves[b] = {to:String(b), reason:"stay", auto:true, hint:"インフィールドフライなので走者はそのまま"};
    }
    // ── バントヒット（BH）── 単打と同様
    else if(rc === "BH"){
      if(b===3){ moves[b]={to:"H",reason:"hit",auto:false,askNeeded:true,hint:"3塁走者はホームへ。阻止された場合はアウトボタンを"}; }
      else if(b===2){ moves[b]={to:"3",reason:"hit",auto:false,askNeeded:true,hint:"2塁走者は3塁へ。さらに進んだ場合は選んでください"}; }
      else if(b===1){ moves[b]={to:"2",reason:"hit",auto:false,askNeeded:true,hint:"1塁走者は2塁で止まった？それとも3塁まで進んだ？"}; }
    }
    // ── スクイズ（SQ）── 全走者1つ進む
    else if(rc === "SQ"){
      if(b===3){ moves[b]={to:"H",reason:"sq",auto:false,askNeeded:true,hint:"スクイズで3塁走者がホームへ。タッチアウトになった場合はアウトボタンを"}; }
      else if(b===2){ moves[b]={to:"3",reason:"force",auto:true,hint:"スクイズで2塁走者が3塁へ進みます"}; }
      else if(b===1){ moves[b]={to:"2",reason:"force",auto:true,hint:"スクイズで1塁走者が2塁へ進みます"}; }
    }
    // ── スクイズ失敗（SQE）── 3塁走者は確認
    else if(rc === "SQE"){
      if(b===3){ moves[b]={to:String(b),reason:"stay",auto:false,askNeeded:true,
        hint:"スクイズ失敗: 3塁走者はアウトになった？それとも戻れた？"}; }
      else { moves[b]={to:String(b),reason:"stay",auto:true}; }
    }
    // ── 犠打エラー出塁（SACE）── フォース走者は進む
    else if(rc === "SACE"){
      var forcedSACE = isForced(b, bases);
      if(forcedSACE){
        moves[b]={to:b+1>3?"H":String(b+1),reason:"force",auto:true,hint:"バントエラーで前の塁が空くので自動で進みます"};
      } else {
        moves[b]={to:String(b),reason:"stay",auto:false,askNeeded:true,hint:"バントエラーの混乱で余分に進んだかもしれません"};
      }
    }
    // ── KWP（振り逃げ）── 打者が1塁へ、フォース走者は進む、非フォースは確認
    else if(rc === "KWP"){
      var forcedKWP = isForced(b, bases);
      if(forcedKWP){
        moves[b]={to:b+1>3?"H":String(b+1),reason:"force",auto:true,
          hint:"振り逃げで打者が1塁に来るためフォース進塁します"};
      } else {
        // 非フォース走者（2塁・3塁）は動かない
        moves[b]={to:String(b),reason:"stay",auto:true,
          hint:"振り逃げで打者が1塁に出ますが、この走者はフォースされません"};
      }
    }
    // ── BB/HBP/KWP（フォアボール系）── フォース走者のみ自動進塁
    else if(rc === "BB" || rc === "HBP" || rc === "KWP"){
      var forcedBB = isForced(b, bases);
      if(forcedBB){
        moves[b]={to:b+1>3?"H":String(b+1),reason:"force",auto:true,hint:"フォアボールで押し出されて1つ進みます"};
      } else {
        moves[b]={to:String(b),reason:"stay",auto:true,hint:"フォアボールですが、押し出しではないので止まります"};
      }
    }
    // ── K/SK/K3B（三振系）── 走者は動かない
    else if(rc === "K" || rc === "SK" || rc === "K3B"){
      moves[b]={to:String(b),reason:"stay",auto:true,hint:"三振なので走者はそのまま"};
    }
    // ── それ以外 ── フォース判定してデフォルト
    else {
      var forcedDef = isForced(b, bases);
      if(forcedDef){
        moves[b]={to:b+1>3?"H":String(b+1),reason:"force",auto:false,askNeeded:true,hint:"確認してください"};
      } else {
        moves[b]={to:String(b),reason:"stay",auto:false,askNeeded:true,hint:"走者の動きを確認してください"};
      }
    }
  });
  return moves;
}

// フォース状態の判定（この走者の後ろの塁が全て埋まっているか）
function isForced(base, bases){
  // 1塁は常にフォース（打者が1塁へ向かうため）
  if(base === 1) return true;
  // 2塁は1塁に走者がいる場合
  if(base === 2) return bases.includes(1);
  // 3塁は1塁2塁両方に走者がいる場合
  if(base === 3) return bases.includes(1) && bases.includes(2);
  return false;
}

// ============================================================
// 状態操作
// ============================================================
function totalScore(side){
  return(S.game[side]||[]).reduce(function(a,i){return a+(i.score||0);},0);
}
function curTeam(){return S.curSide==="top"?S.awayTeam:S.homeTeam;}
function curInn(){
  var side=S.game[S.curSide];
  if(!side)return{atBats:[],score:0,events:[],changes:[]};
  return side[S.curInning]||{atBats:[],score:0,events:[],changes:[]};
}
function curOrder(){
  if(S.editingSlot) return (S.editingSlot.order-1);  // 0-indexed
  var inn=curInn();
  var atBats=inn.atBats||[];
  var slots=inn.slots||[];
  return(slots.length+atBats.length)%9;
}
function curOrderDisplay(){
  // 表示用（1-indexed）
  if(S.editingSlot) return S.editingSlot.order;
  var inn=curInn();
  var atBats=inn.atBats||[];
  var slots=inn.slots||[];
  // slotsとatBatsの合計でmod9（何番打者か）
  return ((slots.length+atBats.length)%9)+1;
}
function curPlayer(){return curTeam().players[curOrder()];}

function showChangeOverlay(nextSide,nextInnNum,callback){
  var old=document.getElementById("changeOverlay");
  if(old)old.remove();
  var halfLabel=nextSide==="top"?"表　先攻":"裏　後攻";
  var cls=nextSide==="top"?"to-top":"to-bottom";
  var emoji=nextSide==="top"?"⚾":"🔴";
  var el=document.createElement("div");
  el.id="changeOverlay";
  el.className="change-overlay "+cls;
  el.innerHTML='<div><div class="change-big">チェンジ！</div>'+
    '<div class="change-sub">'+emoji+' '+nextInnNum+'回 '+halfLabel+'</div>'+
    '<div class="change-inn">攻撃チームが交代します</div></div>';
  document.body.appendChild(el);
  setTimeout(function(){el.remove();callback();},1500);
}

function doChange(){
  var oldSide=S.curSide, oldInning=S.curInning;
  // ── 残塁マーク：チェンジ時に塁に残っている走者のダイヤモンドに残塁マークをつける ──
  if(S.curBases&&S.curBases.length>0){
    var changeInn=(S.game[S.curSide]||[])[S.curInning];
    if(changeInn&&changeInn.atBats){
      S.curBases.forEach(function(base){
        var ri=S.runnerInfo&&S.runnerInfo[base];
        if(!ri)return;
        var ord=ri.order;
        // その走者が出塁した打席を見つけてisLeftOnBase=trueにする
        for(var ai=changeInn.atBats.length-1;ai>=0;ai--){
          if(changeInn.atBats[ai].order===ord){
            changeInn.atBats[ai].isLeftOnBase=true;
            break;
          }
        }
      });
    }
  }
  // チェンジ時に走者をリセット
  // （走者は次の攻撃には引き継がれない — スコアブックの規則）
  S.curPitches=[];S.curBases=[];S.outs=0;S.modal=null;S.autoMsg=null;S.runnerInfo={};
  var nextSide=S.curSide==="top"?"bottom":"top";
  var nextInning=S.curSide==="top"?S.curInning:Math.min(S.curInning+1,MAX_INNINGS-1);
  // ── コールドゲーム判定（後攻チェンジ後＝イニング完了時）──
  if(S.curSide==="bottom"&&!S.gameEnded){
    var cg=S.coldGame||{};
    if(cg.enabled){
      var completedInning=S.curInning+1; // 1-indexed
      if(completedInning>=cg.fromInning){
        var awayTot=totalScore("top"),homeTot=totalScore("bottom");
        var diff=Math.abs(awayTot-homeTot);
        if(diff>=cg.runs){
          S.gameEnded=true;
          S.gameResult=awayTot>homeTot?"win":"lose";
          showChangeOverlay(nextSide,nextInning+1,function(){
            S.curSide=nextSide;S.curInning=nextInning;
            S.tab="scoreboard";
            alert("コールドゲーム成立！ "+awayTot+"-"+homeTot+" （"+diff+"点差）\nスコアボードで結果を確認してください。");
            render();
          });
          return;
        }
      }
    }
  }
  showChangeOverlay(nextSide,nextInning+1,function(){
    S.curSide=nextSide;S.curInning=nextInning;
    // ── タイブレーク: 延長イニングで2塁走者自動配置 ──
    if(S.tiebreaker&&S.tiebreaker.enabled&&nextInning>=(S.maxInnings||5)){
      if(!S.curBases.includes(2)){
        S.curBases.push(2);
        // 走者情報は不明なので仮のorderを設定
        if(!S.runnerInfo)S.runnerInfo={};
        var ord9=curOrder()+1;
        S.runnerInfo[2]={order:ord9,base:2,tiebreaker:true};
        S.autoMsg={type:"info",text:"⚡ タイブレーク！ 2塁に走者が配置されました"};
      }
    }
    render();
  });
}

function addPitch(code){
  var np=S.curPitches.concat([code]);
  var auto=checkAuto(np);
  S.curPitches=np;S.autoMsg=null;
  if(auto==="K3B_HINT"){
    S.autoMsg={type:"info",text:"⚠ 3バント！ 三振なら「✕アウト」→「3バント三振」を選択。続行も可。"};
  } else if(auto){
    S.modal={type:"auto_result",autoCode:auto};
  }
  render();
}

// ============================================================
// 空欄にして次の打者へ進む
// ============================================================
function skipBatterWithStatus(status, reachBase){
  // status: 'out' | 'reach' | 'pending'
  // reachBase: 1|2|3|'H' (出塁時の塁)
  var inn=curInn();
  if(!inn.slots)inn.slots=[];
  var order=curOrderDisplay();
  var p=curPlayer();
  var newSlotIdx=inn.slots.length;
  inn.slots.push({
    type:"pending",
    slotIdx:newSlotIdx,
    order:order,
    playerNum:(p&&p.number)||"?",
    playerName:(p&&p.name)||order+"番",
    inning:S.curInning,
    side:S.curSide,
    quickStatus:status,
    quickBase:reachBase||null,  // 出塁した塁
    basesSnapshot:S.curBases.slice(),
    outsSnapshot:S.outs,
    runnerInfoSnapshot:JSON.parse(JSON.stringify(S.runnerInfo)),
    pitchersSnapshot:JSON.parse(JSON.stringify(S.pitchers))
  });
  if(!S.pendingOrders)S.pendingOrders=[];
  S.pendingOrders.push({side:S.curSide,inning:S.curInning,order:order,slotIdx:newSlotIdx});
  // アウトの場合はアウトカウントを増やす
  if(status==='out'){
    S.outs=Math.min(S.outs+1,3);
  }
  // 出塁の場合はフッターのダイヤモンドに塁を反映（押し出しロジック付き）
  if(status==='reach'&&reachBase&&reachBase!=='H'){
    var base=Number(reachBase);
    if(base>=1&&base<=3){
      // BB/HBPと同様の押し出し処理
      // 打者が base塁に来ることで、それより前の走者を押し出す
      var nb=S.curBases.slice();
      var ri=JSON.parse(JSON.stringify(S.runnerInfo||{}));
      // base が1塁の場合は通常の押し出し
      if(base===1){
        if(nb.includes(1)&&nb.includes(2)&&nb.includes(3)){
          // 満塁→押し出し得点
          nb=nb.filter(function(b){return b!==3;});
          delete ri[3];
          curInn().score=(curInn().score||0)+1;
          // 2→3, 1→2
          if(ri[2]){ri[3]=ri[2];delete ri[2];}
          nb=nb.map(function(b){return b===2?3:b===1?2:b;});
        } else if(nb.includes(1)&&nb.includes(2)){
          if(ri[2]){ri[3]=ri[2];delete ri[2];}
          if(ri[1]){ri[2]=ri[1];delete ri[1];}
          nb=nb.map(function(b){return b===2?3:b===1?2:b;});
        } else if(nb.includes(1)){
          if(ri[1]){ri[2]=ri[1];delete ri[1];}
          nb=nb.map(function(b){return b===1?2:b;});
        }
        nb.push(1);
        nb=nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort(function(a,b){return a-b;});
        ri[1]={earned:true,order:order};
      } else {
        // 2塁・3塁への出塁（ヒット等）はシンプルに追加
        if(!nb.includes(base)){
          nb.push(base);
          nb=nb.sort(function(a,b){return a-b;});
        }
        ri[base]={earned:true,order:order};
      }
      S.curBases=nb;
      S.runnerInfo=ri;
    }
  }
  if(status==='reach'&&reachBase==='H'){
    // ホームラン: 走者も全員ホームイン
    var hr_scored=S.curBases.length+1;
    curInn().score=(curInn().score||0)+hr_scored;
    S.curBases=[];S.runnerInfo={};
  }
  S.curPitches=[];S.autoMsg=null;S.pendingRunnerEvents=[];S.modal=null;S.editingSlot=null;
  if(S.outs>=3){
    doChange();
  } else {
    render();
  }
}

function skipBatterModal(){
  // 飛ばす前に最低限の状態を選ぶモーダルを表示
  S.modal={type:'skip_batter_status'};
  render();
}

function skipBatter(){
  var inn=curInn();
  if(!inn.slots)inn.slots=[];
  var order=curOrderDisplay();
  var p=curPlayer();
  // 空欄スロットとして記録
  var newSlotIdx=inn.slots.length;
  inn.slots.push({
    type:"pending",
    slotIdx:newSlotIdx,   // data-edit-slot で使うインデックス
    order:order,
    playerNum:(p&&p.number)||"?",
    playerName:(p&&p.name)||order+"番",
    inning:S.curInning,
    side:S.curSide,
    // 記録時点のゲーム状態を保存（後で遡り入力するときに参照）
    basesSnapshot:S.curBases.slice(),
    outsSnapshot:S.outs,
    runnerInfoSnapshot:JSON.parse(JSON.stringify(S.runnerInfo)),
    pitchersSnapshot:JSON.parse(JSON.stringify(S.pitchers))
  });
  // pendingOrdersにも追加
  if(!S.pendingOrders)S.pendingOrders=[];
  S.pendingOrders.push({
    side:S.curSide, inning:S.curInning,
    order:order, slotIdx:inn.slots.length-1
  });
  // 投球数・投球情報をリセット
  S.curPitches=[];S.autoMsg=null;S.pendingRunnerEvents=[];S.modal=null;
  S.editingSlot=null;
  render();
}

// 空欄打席を選択して遡り入力モードに
function editPendingSlot(side,inning,slotIdx){
  var inn=(S.game[side]||[])[inning];
  if(!inn||!inn.slots)return;
  var slot=inn.slots[slotIdx];
  if(!slot||slot.type!=="pending")return;
  // 現在の試合状態をeditingSlotに保存（commit後に復元するため）
  S.editingSlot={
    side:side, inning:inning, slotIdx:slotIdx, order:slot.order,
    // 遡り入力完了後に戻すべき現在状態
    savedBases:S.curBases.slice(),
    savedOuts:S.outs,
    savedRunnerInfo:JSON.parse(JSON.stringify(S.runnerInfo||{}))
  };
  S.tab="input";
  // スキップ時点の走者状態を復元（走者確認モーダルの正確な動作のため）
  if(slot.basesSnapshot){
    S.curBases=slot.basesSnapshot.slice();
    S.runnerInfo=JSON.parse(JSON.stringify(slot.runnerInfoSnapshot||{}));
    S.outs=slot.outsSnapshot||0;
  }
  S.curPitches=[];S.autoMsg=null;S.pendingRunnerEvents=[];S.modal=null;
  render();
}

// 遡り入力をキャンセル
function cancelEditSlot(){
  S.editingSlot=null;
  S.curPitches=[];S.autoMsg=null;S.pendingRunnerEvents=[];S.modal=null;
  render();
}

// ============================================================
// 既存打席の修正
// data-edit-ab="innIdx-side-order" 形式で呼ばれる
// ============================================================
function editExistingAb(innIdx,side,order){
  var inn=(S.game[side]||[])[innIdx];
  if(!inn)return;
  var atBats=inn.atBats||[];
  // orderが一致する打席を探す
  var abIdx=atBats.findIndex(function(ab){return ab.order===order;});
  if(abIdx<0){
    // slotsのfilledも確認
    var slots=inn.slots||[];
    var slotIdx=slots.findIndex(function(s2){return s2.order===order&&s2.type==='filled';});
    if(slotIdx>=0){
      editPendingSlot(side,innIdx,slotIdx);
      return;
    }
    return;
  }
  // 既存打席を削除してeditingSlotとしてセット
  saveSnapshot();
  var ab=atBats[abIdx];
  // イニングのスコアなどを元に戻す
  inn.score=Math.max(0,(inn.score||0)-((ab.scored)||0));
  inn.earnedRuns=Math.max(0,(inn.earnedRuns||0)-((ab.earnedScored)||0));
  // 打席を削除
  atBats.splice(abIdx,1);
  // editingSlotとして設定（再入力用）
  S.editingSlot={side:side,inning:innIdx,slotIdx:-1,order:order,isExisting:true,removedAb:ab};
  // 元の打席の状態（走者・アウト数など）を復元するのは難しいので
  // 現在の状態はそのままにして入力モードに
  S.tab='input';
  S.curPitches=ab.pitches?ab.pitches.slice():[];
  S.modal=null;
  render();
}

function commitAtBat(rc,sym,sel){
  saveSnapshot();
  var p=curPlayer();
  var rp=calcRunPath(rc,sel);
  // 投球数を投手に加算（打席中交代があれば旧投手と新投手に分割）
  if(S._pitcherChangedMidAB&&S._pitcherChangedAtPitch>0){
    var ds4=defSide();
    var ps4=S.pitchers[ds4]||[];
    var atPitch=S._pitcherChangedAtPitch;
    // 旧投手（現在の1つ前）に交代前の投球数を加算
    if(ps4.length>=2){
      var oldP=ps4[ps4.length-2];
      if(oldP)oldP.pitchCount=(oldP.pitchCount||0)+atPitch;
    }
    // 新投手（現在）に残りの投球数を加算
    var remainPitches=Math.max(0,S.curPitches.length-atPitch);
    if(remainPitches>0)addPitchToPitcher(remainPitches);
  } else {
    addPitchToPitcher(S.curPitches.length);
  }
  // 現在打者の order を sel に付加（runnerInfoの order追跡用）
  if(!sel)sel={};
  sel._batterOrder = curOrder()+1;
  // 打者アウト（runnerMoves[0].to==="OUT"）の場合、打者は塁に到達しない
  if(sel && sel.runnerMoves && sel.runnerMoves[0] && sel.runnerMoves[0].to==="OUT"){
    rp=[];
  }
  var OUT_CODES=["K","SK","K3B","GO","FO","LO","IFF","SAC","SQ","SQE","SF","DP"];
  var isOut=OUT_CODES.includes(rc),isDP=rc==="DP";
  // sel.extraOuts: 走者確認ウィザードでアウトになった走者の数
  var extraOuts = (isDP ? 1 : 0) + (sel && sel.extraOuts ? sel.extraOuts : 0);
  var newOuts=S.outs+(isOut?1:0)+extraOuts;

  // 走者連動エンジンで新走者状態を計算
  var movement = calcRunnerMovement(rc, sel, S.curBases, S.runnerInfo, S.outs);
  var newBases = movement.newBases;
  var newRunnerInfo = movement.newRunnerInfo;
  var scored = movement.scored;
  var earnedScored = movement.earnedScored;

  var inn=curInn();
  var scoredNum=scored>0?(inn.score||0)+scored:0;
  var ab={
    order:curOrder()+1,
    playerNum:(p&&p.number)||"?",
    playerName:(p&&p.name)||"",
    pitches:S.curPitches.slice(),
    runnerEvents:(S.pendingRunnerEvents||[]).slice(), // 打席中の走者イベント（投球紐付き）
    result:rc,
    // sym が {sym:{sym:...,color:...}} と二重ラップされた場合に正規化
    sym:(sym&&sym.sym&&typeof sym.sym==='object'?sym.sym:sym)||{sym:rc,desc:"",color:"#888"},
    defense:sel||{},
    // 打席中に投手交代があった場合のフラグ（スコアブック表示用）
    pitcherChanged:!!(S._pitcherChangedMidAB||sel&&sel.pitcherChanged),
    pitcherChangedAtPitch:S._pitcherChangedAtPitch||0,
    inning:S.curInning,side:S.curSide,
    runPath:rp,
    reachedBases:rp.filter(function(b){return b!=="H";}),
    outCountAfter:Math.min(newOuts,3),
    scoredNum:scoredNum,
    scored:scored,
    earnedScored:earnedScored,
    // 自責点判定のメモ
    // エラー/FC/CI/OBI/GO_E/KWP/振り逃げ絡みの出塁は非自責の可能性
    hasErrorInPlay:!!(sel&&(sel.errorWho||sel.hasError||(["E","FC","CI","OBI","GO_E","KWP"].includes(rc)))),
    // タイムリー情報（得点に絡んだ打席かどうか）
    isTimely:scored>0&&["1H","2H","3H","HR","RH","BH","SF","SQ"].includes(rc),
    isForcedIn:scored>0&&["BB","HBP","CI","OBI","KWP"].includes(rc),
    timelyCount:scored,
    // 得点圏打率(RISP)追跡: 打席時に得点圏(2塁か3塁)に走者がいたか
    runnersOnBase:S.curBases.slice(),
    ruspAtBat:S.curBases.some(function(b){return b===2||b===3;})
  };
  // editingSlot（遡り入力 or 既存打席修正）の場合
  if(S.editingSlot){
    var esInn2=(S.game[S.editingSlot.side]||[])[S.editingSlot.inning];
    if(S.editingSlot.isExisting){
      // 既存打席の修正: atBatsに挿入（orderで並び順を維持）
      if(esInn2){
        var absArr=esInn2.atBats||[];
        var insertPos=absArr.findIndex(function(x){return x.order>ab.order;});
        if(insertPos<0)absArr.push(ab); else absArr.splice(insertPos,0,ab);
        esInn2.score=(esInn2.score||0)+scored;
        esInn2.earnedRuns=(esInn2.earnedRuns||0)+earnedScored;
      }
    } else if(esInn2&&esInn2.slots&&esInn2.slots[S.editingSlot.slotIdx]){
      // 空欄スロットを入力済みに更新
      esInn2.slots[S.editingSlot.slotIdx]=Object.assign({},ab,{type:"filled",slotIdx:S.editingSlot.slotIdx});
      // ※得点加算は後の inn.score+=scored で行うため、ここでは加算しない
      if(S.pendingOrders){
        S.pendingOrders=S.pendingOrders.filter(function(po){
          return!(po.side===S.editingSlot.side&&po.inning===S.editingSlot.inning&&po.slotIdx===S.editingSlot.slotIdx);
        });
      }
    }
    // 遡り入力完了: 現在の試合状態（他の打席に影響された状態）を復元
    if(S.editingSlot.savedBases){
      S.curBases=S.editingSlot.savedBases.slice();
      S.outs=S.editingSlot.savedOuts||0;
      S.runnerInfo=JSON.parse(JSON.stringify(S.editingSlot.savedRunnerInfo||{}));
    }
    S.editingSlot=null;
    S.tab="scorebook"; S.sbSubTab="log";
  } else {
    inn.atBats.push(ab);
  }
  inn.score=(inn.score||0)+scored;
  inn.earnedRuns=(inn.earnedRuns||0)+earnedScored;
  // 投手に被打席・失点を記録
  recordBatterToPitcher(rc, scored, earnedScored);

  // 得点した走者の元の打席に「どの打者のおかげで生還したか」を記録
  if(scored>0 && !S.editingSlot){
    var batterOrder=curOrder()+1;
    // 元の走者のうち、新しいbasesにいない走者＝得点した走者
    (S.curBases||[]).forEach(function(oldBase){
      if(!newBases.includes(oldBase)){
        // この走者が得点した
        var ri2=S.runnerInfo&&S.runnerInfo[oldBase];
        if(ri2&&ri2.order){
          // ri2.orderの打席を探してscoredByBatterOrderを記録
          var sInn=curInn();
          if(sInn&&sInn.atBats){
            for(var sai=sInn.atBats.length-1;sai>=0;sai--){
              if(sInn.atBats[sai].order===ri2.order){
                sInn.atBats[sai].scoredByBatterOrder=batterOrder;
                break;
              }
            }
          }
        }
      }
    });
  }

  S.curPitches=[];S.autoMsg=null;S.pendingRunnerEvents=[];

  if(newOuts>=3){
    S.outs=3;S.curBases=newBases;S.runnerInfo=newRunnerInfo;S._pendingChange=false;
    // 3アウト: プレビューを表示してから自動チェンジ（1秒後）
    S.modal={type:"scorebook_preview",ab:ab,autoChange:true};
    render();
    setTimeout(function(){if(S.modal&&S.modal.autoChange){S.modal=null;doChange();}},2500);
    return;
  } else {
    S.outs=newOuts;S.curBases=newBases;S.runnerInfo=newRunnerInfo;S._pendingChange=false;
    S.modal={type:"scorebook_preview",ab:ab};
  }
  render();
}

function addScore(side,inning,d){
  if(S.game[side]&&S.game[side][inning]){
    S.game[side][inning].score=Math.max(0,(S.game[side][inning].score||0)+d);
  }
  render();
}

function runnerEvent(code){
  var isOutEvent=["CS","PO","ROUT","RUNDOWN"].includes(code);
  // TS（三重盗）はDSと同様に全走者選択
  if(code==="TS"){code="DS";} // DSのロジックを流用（全走者が動く）
  if(isOutEvent){
    S.modal={type:"runner_out",eventCode:code};
    S.routDefNum=null;
    render();
    return;
  }

  var active = S.curBases.filter(function(b){return b>=1&&b<=3;});

  // SCORE: 得点追加
  if(code==="SCORE"){S.modal={type:"runner_event",eventCode:code};render();return;}

  // WP/PB/BALK: 全走者が1つ進む（デフォルト）
  // 走者が1人もいなければ何もしない
  if(["WP","PB","BALK"].includes(code)){
    if(active.length===0){
      // 走者なし → 記録だけして終了
      var lbl0=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
      var inn0=curInn();
      inn0.events.push({type:code,label:lbl0,scored:0});
      render();
      return;
    }
    // 走者あり → 全員1つ進む提案モーダル
    S.modal={type:"runner_advance",eventCode:code,suggested:active.slice()};
    render();
    return;
  }

  // SB/DS: 盗塁 → 誰が盗塁するか選択、他走者の連動確認
  if(code==="SB"||code==="DS"){
    if(active.length===0){render();return;}
    S.modal={type:"runner_event",eventCode:code};
    render();
    return;
  }

  S.modal={type:"runner_event",eventCode:code};
  render();
}

// WP/PB/BALK 一括進塁適用
function applyAdvanceAll(code, movingBases){
  var mv = calcRunnerEventMovement(code, movingBases, S.curBases, S.runnerInfo);
  var lbl=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
  var inn=curInn();
  inn.events.push({type:code,label:lbl,scored:mv.scored});
  inn.score=(inn.score||0)+mv.scored;
  inn.earnedRuns=(inn.earnedRuns||0)+mv.earnedScored;
  S.curBases=mv.newBases;
  S.runnerInfo=mv.newRunnerInfo;
  S.modal=null;
  render();
}

function applyRunnerEvent(code,bases){
  // SB後の連動確認のために、mv適用前の走者リストを保存
  var basesBeforeMove = S.curBases.slice();
  var mv=calcRunnerEventMovement(code,bases,S.curBases,S.runnerInfo);
  var lbl=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
  var inn=curInn();
  // 打席中の走者イベントとして記録（投球数と紐付け）
  if(!S.pendingRunnerEvents)S.pendingRunnerEvents=[];
  S.pendingRunnerEvents.push({
    code:code,
    label:lbl,
    pitchNum:S.curPitches.length, // 何球目の後に起きたか
    fromBases:bases.slice(),
    scored:mv.scored
  });
  inn.events.push({type:code,label:lbl,scored:mv.scored});
  inn.score=(inn.score||0)+mv.scored;
  inn.earnedRuns=(inn.earnedRuns||0)+mv.earnedScored;
  S.curBases=mv.newBases;S.runnerInfo=mv.newRunnerInfo;
  S.modal=null;

  // 盗塁後: 盗塁した走者以外の走者がいれば「連動進塁確認」を出す
  if(code==="SB"){
    // basesBeforeMove: mv適用前の全走者の塁
    // bases: 盗塁した走者の元の塁（盗塁前）
    // 他の走者 = 盗塁前にいた走者のうち、盗塁した走者以外
    var remaining=basesBeforeMove.filter(function(b){
      return b>=1&&b<=3&&!bases.includes(b);
    });
    if(remaining.length>0){
      S.modal={type:"runner_chain",eventCode:code,remaining:remaining};
    }
  }
  render();
}

function applyRunnerOut(code,base,defNum){
  // 走者アウト（塁から削除、アウトカウント増加）
  S.curBases=S.curBases.filter(function(b){return b!==base;});
  S.outs=Math.min(S.outs+1,3);
  var lbl=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
  if(defNum)lbl+="("+POSITIONS[defNum]+")";
  var inn=curInn();

  // どのatBatの走者がアウトになったかを追跡
  // runnerInfo[base] に出塁打者の order が記録されていれば紐付け
  var ri=S.runnerInfo&&S.runnerInfo[base];
  var runnerOrder=ri&&ri.order;  // どの打者の走者か

  inn.events.push({
    type:code,label:lbl,scored:0,outBase:base,
    defNum:defNum||null,
    runnerOrder:runnerOrder||null,  // 元の打者の打順
  });

  // 元の打者のab に runnerOutEvents を追記（ダイヤモンド表示用）
  (function(){
    var allAbs=inn.atBats||[];
    if(!allAbs.length)return;
    var targetAb=null;
    // runnerOrder がある場合は対象の打者を検索
    if(runnerOrder){
      for(var i2=0;i2<allAbs.length;i2++){
        if(allAbs[i2].order===runnerOrder){targetAb=allAbs[i2];break;}
      }
    }
    // 見つからなければ最後の打席にフォールバック
    if(!targetAb)targetAb=allAbs[allAbs.length-1];
    if(!targetAb.runnerOutEvents)targetAb.runnerOutEvents=[];
    targetAb.runnerOutEvents.push({
      code:code, label:lbl, outBase:base, defNum:defNum||null
    });
  })();

  delete S.runnerInfo[base];
  S.modal=null;S.routDefNum=null;
  if(S.outs>=3)doChange();
  else render();
}

function recordChange(type,name,num){
  var labelMap={pitcher:"投手交代",hitter:"代打",runner:"代走"};
  var iconMap={pitcher:"🔄",hitter:"🏏",runner:"🏃"};
  var inn=curInn();
  if(inn&&inn.changes){
    inn.changes.push({type:type,label:labelMap[type]||type,name:name||"",num:num||"",
      icon:iconMap[type]||"📝",inning:S.curInning,side:S.curSide,outs:S.outs});
  }
  if(type==="pitcher"){
    changePitcher(name,num);
    S._pitcherChangedMidAB=true;
    S._pitcherChangedAtPitch=S.curPitches.length;
  }
  // 代打・代走: 現在の打者をsubbedとしてマーク、新選手のデータで上書き
  if(type==="hitter"||type==="runner"){
    var team=curTeam();
    var ord=curOrder();
    if(team&&team.players&&team.players[ord]){
      // 旧選手に交代フラグ
      team.players[ord].subbed=true;
      team.players[ord].subbedBy=name||"?";
      // 新選手の名前・番号を設定（打順スロットを引き継ぎ）
      if(name) team.players[ord].name=name;
      if(num)  team.players[ord].number=num;
    }
  }
  S.modal=null;render();
}

function closeModal(){
  S.modal=null;S.autoMsg=null;
  if(S._pendingChange){S._pendingChange=false;doChange();}
  else render();
}

function saveToStorage(){
  try{
    var data={
      v:2,
      page:S.page,
      awayTeam:S.awayTeam,
      homeTeam:S.homeTeam,
      game:S.game,
      curSide:S.curSide, curInning:S.curInning,
      curBases:S.curBases, outs:S.outs,
      runnerInfo:S.runnerInfo,
      tab:S.tab, sbSubTab:S.sbSubTab, sbFilter:S.sbFilter,
      resultTab:S.resultTab,
      _pendingChange:S._pendingChange,
      pendingOrders:S.pendingOrders,
      pitchers:S.pitchers,
      history:S.history,
      meta:S.meta,
      maxInnings:S.maxInnings,
      gameEnded:S.gameEnded,
      gameResult:S.gameResult,
      coldGame:S.coldGame,
      tiebreaker:S.tiebreaker
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){ /* プライベートモード等でlocalStorageが使えない場合は無視 */ }
}

function loadFromStorage(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    var data=JSON.parse(raw);
    if(!data||data.v!==2)return false;
    // 読み込み可能なフィールドだけ上書き（transient状態は保持しない）
    S.page       = data.page||"setup";
    S.awayTeam   = data.awayTeam||S.awayTeam;
    S.homeTeam   = data.homeTeam||S.homeTeam;
    S.game       = data.game||makeGame();
    S.curSide    = data.curSide||"top";
    S.curInning  = data.curInning||0;
    S.curBases   = data.curBases||[];
    S.outs       = data.outs||0;
    S.runnerInfo = data.runnerInfo||{};
    S.tab        = data.tab||"input";
    S.sbSubTab   = data.sbSubTab||"log";
    S.sbFilter   = data.sbFilter||"all";
    S.resultTab  = data.resultTab||"reach";
    if(S.resultTab==="hit"||S.resultTab==="special") S.resultTab="reach";
    S._pendingChange = data._pendingChange||false;
    S.pendingOrders  = data.pendingOrders||[];
    S.pitchers   = data.pitchers||{top:[],bottom:[]};
    S.history    = data.history||[];
    S.meta       = data.meta||{date:"",tournament:"",venue:"",weather:""};
    S.maxInnings = data.maxInnings||5;
    S.gameEnded  = data.gameEnded||false;
    S.gameResult = data.gameResult||null;
    S.coldGame   = data.coldGame||{enabled:false,runs:10,fromInning:3};
    S.tiebreaker = data.tiebreaker||{enabled:false};
    // transient はクリア
    S.modal=null; S.autoMsg=null; S.curPitches=[];
    S.pendingRunnerEvents=[]; S.editingSlot=null;
    S._pitcherChangedMidAB=false; S._pitcherChangedAtPitch=0;
    return true;
  }catch(e){return false;}
}

function saveGameToSeason(){
  try{
    var awayS=totalScore("top"), homeS=totalScore("bottom");
    var entry={
      id: Date.now(),
      date: (S.meta&&S.meta.date) ? S.meta.date : new Date().toISOString().slice(0,10),
      tournament: (S.meta&&S.meta.tournament)||"",
      venue: (S.meta&&S.meta.venue)||"",
      away: S.awayTeam.name||"先攻",
      home: S.homeTeam.name||"後攻",
      awayScore: awayS,
      homeScore: homeS,
      result: S.gameResult||"draw",
      innings: S.curInning+1,
      maxInnings: S.maxInnings||5
    };
    var raw=localStorage.getItem(SEASON_KEY);
    var list=[];
    try{ list=JSON.parse(raw)||[]; }catch(e2){ list=[]; }
    if(!Array.isArray(list)) list=[];
    list.unshift(entry);
    if(list.length>50) list=list.slice(0,50);
    localStorage.setItem(SEASON_KEY, JSON.stringify(list));
  }catch(e){}
}

function render(){
  try{
    var app=document.getElementById("app");
    var mr=document.getElementById("modal-root");
    if(!app||!mr)return;
    if(S.page==="setup")app.innerHTML=renderSetup();
    else app.innerHTML=renderGame();
    var modalHtml=S.modal?renderModal():"";
    if(S.modal&&!modalHtml.trim()){
      console.warn("空モーダル検出:", S.modal&&S.modal.type);
      S.modal=null; modalHtml="";
    }
    mr.innerHTML=modalHtml;
    // モーダル表示中はappのタッチを無効化（iOS Safariのイベント透過防止）
    if(app){app.style.pointerEvents=S.modal?"none":"";}
    if(mr){mr.style.pointerEvents=S.modal?"auto":"none";}
    saveToStorage();
    bindEvents();
    // 「後で入力」ボタンをguideBarの2px上に動的配置
    setTimeout(function(){
      var gb=document.getElementById("guideBarEl");
      var btn=document.getElementById("skipBatterFooterBtn");
      if(gb&&btn){
        // guideBarの画面下端からの距離 = 画面高さ - guideBarのtop位置
        var rect=gb.getBoundingClientRect();
        var fromBottom=window.innerHeight-rect.top;
        btn.style.bottom=(fromBottom+2)+"px";
      }
    },0);
  }catch(e){console.error("render error:",e);}
}

function startGame(){
  S.page="game";
  if(!S.game||Object.keys(S.game).length===0)S.game=makeGame();
  S.curSide="top";S.curInning=0;
  S.curBases=[];S.outs=0;S.curPitches=[];S.modal=null;S.autoMsg=null;S.history=[];
  S.runnerInfo={};S._pendingChange=false;S._pitcherChangedMidAB=false;S._pitcherChangedAtPitch=0;
  S.tab="input";S.resultTab="hit";
  // 試合開始時: pendingOrdersを全てクリア
  S.pendingOrders=[];
  S.editingSlot=null;
  S.pitchers={top:[],bottom:[]};
  // 両チームの先発投手（守備側）を初期化
  // top攻撃 → bottomが守備（bottomに投手登録）
  // bottom攻撃 → topが守備（topに投手登録）
  ["top","bottom"].forEach(function(ds){
    var team=ds==="top"?S.awayTeam:S.homeTeam;
    var pitcher=team.players.find(function(p){return p.position===1;})||team.players[0];
    S.pitchers[ds]=[{
      name:pitcher?pitcher.name:"投手",
      number:pitcher?pitcher.number:"",
      pitchCount:0,
      earnedRuns:0,
      unearnedRuns:0,
      battersFaced:0,
      inningStart:0,
      inningStartOuts:0,
      isCurrent:true
    }];
  });
}

    // ── ユーティリティボタン ──
    '<div class="bb-utils">'+
      '<button class="bb-util-btn" id="memberEditBtn">👥 メンバー</button>'+
      '<button class="bb-util-btn" id="swapSidesBtn">⇄ 攻守入替</button>'+
      '<button class="bb-util-btn" id="toSetupBtn">⚙ 設定戻る</button>'+
    '</div>'+
    // ── タブ ──
    '<div class="tabs" role="navigation" aria-label="画面切り替え">'+
      [["input","入力"],["scoreboard","得点表"],["scorebook","スコア"],["pitchers","投手"],["stats","成績"],["log","記録"],["help","ヘルプ"]].map(function(t){
        return'<button class="tab-btn'+(S.tab===t[0]?" active":"")+'" data-tab="'+t[0]+'" role="tab" aria-selected="'+(S.tab===t[0]?'true':'false')+'">'+t[1]+'</button>';
      }).join("")+
    '</div></div>';
  // ガイドオーバーレイ（入力タブのみ表示）
  var guideBar="";
  if(S.tab==="input"){
    var gcnt=getCount(S.curPitches);
    var gb=gcnt.b,gs=gcnt.s;
    var gt="",gc="#1a3a6e";
    if(S._pendingChange){gt="⚡ チェンジ中...";gc="#c62828";}
    else if(S.curPitches.length===0){gt="① 投球ボタンを押す、または ② で直接選ぶ";}
    else if(checkAuto(S.curPitches)){gt="✅ 自動判定！上のポップアップを確認してください";gc="#1565c0";}
    else if(gb>=3&&gs===0){gt="B3つ — あと1球でフォアボール";}
    else if(gs>=2&&gb===0){gt="S2つ — あと1球で三振";}
    else if(gs>=2){gt="2ストライク中 — F(ファウル)はカウント増えません";}
    else if(S.outs>0){gt="打球が起きたら ↓ ② で入力。走者が進んだ場合も確認で記録できます";}
  else{gt="打球が起きたら ↓ ② アウト・ヒット・出塁を選ぶ";}
    // 「後で入力」をガイドバー右端に常時表示
    var _skipable=(!S.editingSlot&&!S._pendingChange);
    var _pc=0;
    if(_skipable){
      ["top","bottom"].forEach(function(sd){
        (S.game[sd]||[]).forEach(function(inn){
          (inn.slots||[]).forEach(function(sl){if(sl.type==="pending")_pc++;});
        });
      });
    }
    var skipGuideBtn=_skipable
      ? '<button id="skipBatterBtn" style="flex-shrink:0;margin-left:8px;background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.7);color:#fff;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;">'+
          '⏭ 後で入力'+(_pc>0?'<span style="background:#fff;color:#e65100;border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;">'+_pc+'</span>':'')+
        '</button>'
      : '';
    guideBar='<div id="guideBarEl" style="background:'+gc+';color:#fff;padding:5px 10px;font-size:12px;font-weight:bold;display:flex;align-items:center;flex-shrink:0;">'+
      '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.1px;">'+gt+'</span>'+
      skipGuideBtn+
    '</div>';
  }
  return'<div class="page-content">'+content+'</div>'+guideBar+footer;
}

function renderInputTab(){

    editingBanner='<div style="background:'+(_isExisting?'#6a1b9a':'#e65100')+';color:#fff;border-radius:9px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;" role="alert" aria-live="polite">'+

        '<div style="font-size:14px;font-weight:bold">'+(S.curInning+1)+'回 '+S.editingSlot.order+'番 #'+_esNum+' '+_esName+(_isExisting?' の打席を修正':'を記録中')+'</div>'+
        '<div style="font-size:12px;opacity:.85;margin-top:2px">'+_editSub+'</div>'+
      '</div>'+

  }

  var changeBanner=""; // 自動チェンジのため不要
  var hasRunners=S.curBases.length>0;

  // 状況ガイド（フッター上に出る小さいオーバーレイ）
  // cnt, b, sv は上で既に宣言済み
  // ガイドはrenderGame()側で生成・表示

  // ── ① 投球ボタン（全6個を1行・均等幅）──
  var pitchBtns=PITCH_BTNS.map(function(pb){

    '<span style="font-size:18px;line-height:1">⌫</span>'+
    '<span style="font-size:10px;color:#555;font-weight:bold">取消</span>'+

  // ── ② 打席結果タブ＋ボタン（2段ラベル: 大テキスト + 小テキスト） ──
  // 「特殊」タブは投球入力で自動処理されるため廃止

  var rtabs=[

  ].map(function(t){

  // specialタブが選択中だったらoutにリセット
  if(S.resultTab==="special"||S.resultTab==="hit") S.resultTab="reach";
  var grpBtns=(RESULT_GROUPS[S.resultTab]||[]).map(function(btn){
    var avail=getResultAvailability(btn.code);
    var stateCls=avail==="impossible"?" unavailable":avail==="unlikely"?" unlikely":"";
    var confirmAttr=avail==="unlikely"?' data-confirm="'+btn.code+'"':"";
    // impossibleには「この状況では使えない」を明示
    // impossibleはsubを「使えません」に、unlikelyは「⚠ 要確認」に置き換えてsubのスロットを使う
    // →余分な行を増やさないのでボタン高さが常に一定
    var displaySub = avail==="impossible" ? "× 使えません"
                   : avail==="unlikely"  ? "⚠ 要確認"
                   : (btn.sub||"");
    var subStyle = avail==="impossible" ? "opacity:.7;" : avail==="unlikely" ? "opacity:.85;" : "";
    var fullWidthStyle=' style="background:'+btn.color+'"';
    var ariaLbl=btn.label+(avail==='impossible'?' 使用不可':avail==='unlikely'?' 通常は使わない':'');
    return'<button class="rbtn'+stateCls+'"'+fullWidthStyle+
      ' data-result="'+btn.code+'" data-wiz="'+(btn.wiz?1:0)+'"'+confirmAttr+
      ' aria-label="'+ariaLbl+'"'+(avail==="impossible"?' aria-disabled="true"':'')+'>'+
      '<span class="rbtn-main">'+btn.label+'</span>'+
      (displaySub?'<span class="rbtn-sub" style="'+subStyle+'">'+displaySub+'</span>':'')+
    '</button>';
  }).join("");

  // ── ③ 走者イベント（状況に応じてok/unlikely/impossibleを判定）──
  var runnerBtns=RUNNER_EVENTS.map(function(e){
    var avail=getRunnerEventAvailability(e.code);
    var stateCls=avail==="impossible"?" unavailable":avail==="unlikely"?" unlikely":"";
    var confirmAttr=avail==="unlikely"?' data-confirm="'+e.code+'"':"";
    // impossible/unlikelyはsubに表示、ok時はe.subを表示
    var runnerSub = avail==="impossible" ? "× 使えません"
                 : avail==="unlikely"  ? "⚠ 要確認"
                 : (e.sub||"");
    var rsubStyle = avail==="impossible" ? "opacity:.7;" : avail==="unlikely" ? "opacity:.85;" : "";
    var runnerAriaLbl=e.label+(avail==='impossible'?' 使用不可':avail==='unlikely'?' 通常は使わない':'');
    return'<button class="runner-btn'+stateCls+'" style="background:'+e.bg+'"'+confirmAttr+
      ' data-runner="'+e.code+'" aria-label="'+runnerAriaLbl+'"'+(avail==="impossible"?' aria-disabled="true"':'')+'>'+
      '<span class="rlabel">'+e.label+'</span>'+
      (runnerSub?'<span class="rsub" style="'+rsubStyle+'">'+runnerSub+'</span>':'')+
    '</button>';
  }).join("");

  var undoDisabled=S.history.length===0?" disabled":"";
  var undoCount=S.history.length>0?" ("+S.history.length+")":"";


  return'<div style="padding:4px 8px 0;display:flex;flex-direction:column;gap:3px;">'+
    editingBanner+changeBanner+autoBanner+

    // ── セクション① 投球 ──
    '<div class="card" style="padding:6px 10px;">'+
      '<div class="card-label" style="margin-bottom:5px;">'+
        '<span class="step-badge">①</span>'+
        '<span>投球</span>'+
        (S.curPitches.length>0?
          '<span style="font-size:12px;color:#1565c0;margin-left:4px;font-weight:bold;background:#e8f0fe;border-radius:10px;padding:1px 7px;">'+S.curPitches.length+'球</span>':
          '<span style="font-size:10px;color:#aaa;margin-left:4px;font-weight:normal">1球ごとにタップ</span>')+
        '<button class="help-btn" id="helpPitchBtn" style="margin-left:auto">?</button>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;">'+pitchBtns+'</div>'+
    '</div>'+

    // ── セクション②③ 打席結果 + 走者イベント（アコーディオン版） ──
    '<div class="result-card" style="'+(noPitchYet||waitingChange?'opacity:.4;pointer-events:none;':'')+'">'+
      // ヘッダー行
      '<div style="background:#f0f4f8;padding:4px 10px;font-size:12px;color:#555;display:flex;align-items:center;gap:6px;border-bottom:1px solid #e8eaed;">'+
        '<span style="font-weight:bold;color:#1a3a6e;font-size:12px">② 打球の結果</span>'+
        '<button class="help-btn" id="helpResultBtn" style="margin-left:auto">?</button>'+
      '</div>'+
      // タブ（常に表示・押すと展開）
      '<div class="result-tabs" style="flex-wrap:nowrap;gap:0;">'+
        // タブをカラーで視覚的に明示、アクティブでない時も色付き
        (function(){
          var tabs=[
            {id:"reach", label:"○ 出塁",   desc:"塁に出た（安打・エラー等）", activeColor:"#2e7d32", inactiveColor:"#e8f5e9", inactiveFg:"#2e7d32"},
            {id:"out",   label:"✕ アウト", desc:"打者がアウト",              activeColor:"#455a64", inactiveColor:"#e0e2e5", inactiveFg:"#37474f"}
          ];
          return tabs.map(function(t){
            var isActive=S.resultTab===t.id;
            var ac=isActive?" active-"+t.id:"";
            var bg=isActive?t.activeColor:t.inactiveColor;
            var fg=isActive?"#fff":t.inactiveFg;
            var border=isActive?"none":"1px solid rgba(0,0,0,.06)";
            return'<button class="result-tab'+ac+'" data-rtab="'+t.id+'" style="'+
              'background:'+bg+';color:'+fg+';border:'+border+';'+
              'padding:7px 4px;flex:1;border-radius:0;transition:all .15s;'+
              (isActive?'font-weight:bold;':'')+
              '">'+
              '<span style="display:block;font-size:12px;font-weight:bold;white-space:nowrap">'+t.label+'</span>'+
              '<span style="display:block;font-size:10px;margin-top:2px;opacity:'+(isActive?.9:.7)+';font-weight:normal;white-space:nowrap">'+
                t.desc+
              '</span>'+
            '</button>';
          }).join("");
        })()+
      '</div>'+
      // タブが選択されている時だけ中身を表示
      (S.resultTab?'<div class="result-body result-body-accordion"><div class="result-grid-3col">'+grpBtns+'</div></div>':'')+
    '</div>'+

    // ── セクション③ 走者イベント（常時表示・アコーディオンなし）──
    '<div class="card" style="padding:0;overflow:hidden;border:1.5px solid '+(hasRunners?'#c8e6c9':'#e0e0e0')+';border-radius:10px;">'+
      '<div class="card-label" style="padding:7px 10px;margin:0;background:'+(hasRunners?'#f1f8f0':'#fafafa')+';border-bottom:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between;">'+
        '<div style="display:flex;align-items:center;gap:6px;">'+
          '<span class="step-badge" style="background:'+(hasRunners?'#388e3c':'#9e9e9e')+'">③</span>'+
          '<span style="font-weight:bold;font-size:12px;color:'+(hasRunners?'#1b5e20':'#555')+'">走者のイベント</span>'+
          (hasRunners?'<span style="background:#c8e6c9;color:#1b5e20;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:bold">走者あり</span>':'<span style="font-size:10px;color:#aaa">走者がいるとき使う</span>')+
        '</div>'+
        '<button class="help-btn" id="helpRunnerBtn">?</button>'+
      '</div>'+
      '<div style="padding:8px 10px;"><div class="runner-grid-4col">'+runnerBtns+'</div></div>'+
    '</div>'+

// ── 状況先読みヒント ──
    (function(){
      var bases=S.curBases||[];
      var outs=S.outs||0;
      var has1=bases.includes(1),has2=bases.includes(2),has3=bases.includes(3);
      var n=bases.length;
      var hints=[];

      // ダブルスチール: 走者2人以上
      if(n>=2){
        hints.push({code:"DS",label:"重盗",desc:"2人同時に盗塁",color:"#1b5e20",runner:true});
      }
      // 3塁走者がいてノーアウトまたは1アウト
      if(has3&&outs<=1){
        hints.push({code:"SQ",label:"スクイズ",desc:"バント→3塁走者生還",color:"#455a64",runner:false});
        hints.push({code:"WP",label:"暴投",desc:"投球逸れ走者進塁",color:"#283593",runner:true});
      }
      // 走者1塁のみ: 盗塁
      if(has1&&!has2){
        hints.push({code:"SB",label:"盗塁",desc:"1塁→2塁へ",color:"#1b5e20",runner:true});
      }
      // 走者2塁のみ: 盗塁
      if(has2&&!has1&&!has3){
        hints.push({code:"SB",label:"盗塁",desc:"2塁→3塁へ",color:"#1b5e20",runner:true});
      }
      // 2アウトで走者あり: 得点チャンス
      if(outs===2&&n>0){
        hints.push({code:"1H",label:"タイムリー",desc:"2アウトからタイムリー",color:"#2e7d32",runner:false});
      }
      // エラーの後（直前の打席がE系）
      var lastAb=null;
      var inn=curInn();
      if(inn&&inn.atBats&&inn.atBats.length>0){
        lastAb=inn.atBats[inn.atBats.length-1];
      }
      if(lastAb&&["E","GO_E","SACE"].includes(lastAb.result)){
        hints.push({code:"E",label:"連続エラー",desc:"連続エラーに注意",color:"#0277bd",runner:false});
      }

      if(hints.length===0)return"";

      var hintBtns=hints.slice(0,3).map(function(h){
        return'<button class="situation-hint-btn" data-hint-code="'+h.code+'" data-hint-runner="'+(h.runner?1:0)+
          '" style="background:'+h.color+';color:#fff;border:none;border-radius:9px;padding:9px 8px;font-size:13px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1;line-height:1.2">'+
          '<span style="font-size:14px;font-weight:bold;white-space:nowrap">'+h.label+'</span>'+
          '<span style="font-size:10px;opacity:.9;white-space:nowrap;font-weight:normal;overflow:hidden;text-overflow:ellipsis;max-width:100%">'+h.desc+'</span>'+
        '</button>';
      }).join("");

      return'<div class="card" style="padding:10px 12px;background:linear-gradient(135deg,#f0f8ff,#e8f0fe);">'+
        '<div style="font-size:12px;color:#1565c0;font-weight:bold;margin-bottom:8px">💡 この状況で起きやすいこと</div>'+
        '<div style="display:flex;gap:6px;">'+hintBtns+'</div>'+
      '</div>';
    })()+

    // ── 交代・操作 ──
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;">'+
      '<button class="runner-btn" style="background:#37474f" data-change="pitcher"><span class="rlabel">投手交代</span></button>'+
      '<button class="runner-btn" style="background:#00695c" data-change="hitter"><span class="rlabel">代打</span></button>'+
      '<button class="runner-btn" style="background:#1565c0" data-change="runner"><span class="rlabel">代走</span></button>'+
    '</div>'+

    // ── 取消・チェンジ（アクションバー） ──
    '<div style="display:flex;gap:5px;padding-bottom:2px;">'+
      '<button class="undo-btn" style="flex:1;margin:0;display:flex;flex-direction:column;align-items:center;gap:1px;"'+undoDisabled+(undoDisabled?' aria-disabled="true"':'')+' id="undoBtn">'+
        '<span style="font-size:13px;font-weight:bold;">↩ 取り消す'+undoCount+'</span>'+
        '<span style="font-size:11px;opacity:.7">'+(S.history.length>0?"直前の打席に戻る":"履歴なし")+'</span>'+
      '</button>'+
      '<button id="changeBtn" style="flex:1;background:'+(S.outs>=3?"#c62828":"#455a64")+';color:#fff;border:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;'+(S.outs>=3?"box-shadow:0 0 0 2px #ff8a80;animation:pulse .8s infinite;":"")+'">'+
        '<span>'+(S.outs>=3?"✅ チェンジ！":"⇄ チェンジ")+'</span>'+
        '<span style="font-size:11px;opacity:.85">'+(S.outs>=3?"3アウト！攻守交代":"攻守交代するとき押す")+'</span>'+
      '</button>'+
    '</div>'+

  '</div>';
}

// ============================================================
// ワンパネルウィザード（守備詳細）
// 設計: 完了済みセクション→サマリーチップに折り畳み、アクティブセクション→1つだけ展開
// ============================================================
function renderDefWizPanel(wiz){
  var sel=wiz.sel, ht=sel.hitType||"";
  var isHit=["1H","2H","3H","BH"].includes(ht);
  var isEType=ht==="E";
  var sym4=buildSym(sel);

  var needsThrow=["GO","SAC","DP","FC"].includes(ht);
  var needsThrow2=ht==="DP";
  var needsErrorAsk=["GO","SAC"].includes(ht);
  var needsOutcome=["GO","SAC"].includes(ht);
  var needsFcOut=ht==="FC";

  // isEType は section1 が errorWho 担当
  var sec1done=isEType?(sel.errorWho!==undefined):(sel.fielder1!==undefined);
  var s1val=isEType?sel.errorWho:sel.fielder1;
  var sec2done=sel.throwTo!==undefined;
  var sec2skip=sel.throwTo==="none";
  var sec3done=sel.throwTo2!==undefined;
  var sec4done=sel.hasError!==undefined;
  var sec5done=sel.errorWho!==undefined;
  var sec6done=sel.outcome!==undefined;
  var sec7done=sel.runnerOutBase!==undefined;

  // 全詳細はオプション: 急いでいる場合は何も選ばずすぐ記録可能
  // 詳細を入力するほどスコアブックが充実する設計
  var canSubmit=true;

  var stepNums=["①","②","③","④","⑤","⑥","⑦"];
  var si=0;

  // ── ヘルパー: 完了済みセクション（サマリーチップ表示）──
  function doneSec(num,lbl,chipText,editKey,danger){
    var chipBg=danger?"#fee2e2":"#dcfce7";
    var chipTc=danger?"#7f1d1d":"#14532d";
    return'<div class="wiz-section wiz-done" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px">'+
      '<div style="display:flex;align-items:center;gap:7px;min-width:0;flex:1;overflow:hidden">'+
        '<span class="wiz-num">'+num+'</span>'+
        '<span style="font-size:11px;color:#555;flex-shrink:0">'+lbl+'</span>'+
        '<span style="background:'+chipBg+';color:'+chipTc+';font-size:12px;font-weight:bold;padding:2px 10px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">✓ '+chipText+'</span>'+
      '</div>'+
      '<button style="flex-shrink:0;font-size:11px;color:#1a3a6e;background:none;border:1.5px solid #bfdbfe;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:bold" data-wiz-edit-sec="'+editKey+'">変更</button>'+
    '</div>';
  }

  // ── ヘルパー: ポジショングリッド（内野6＋外野3、除外あり）──
  function posGrid(key,errMode,excl){
    excl=excl||[];
    function pb(n){
      var isSel=sel[key]===n;
      var bg=isSel?(errMode?"#c62828":"#1b7a3e"):POS_COLORS[n];
      var shadow=isSel?(errMode?"0 0 0 3px rgba(198,40,40,.4)":"0 0 0 3px rgba(27,122,62,.4)"):"";
      var cls="pos-btn"+(isSel?(errMode?" wiz-selected-err":" wiz-selected"):"");
      return'<button class="'+cls+'" data-wiz-pos="'+n+'" data-wiz-key="'+key+'" style="background:'+bg+';color:#fff;'+(shadow?'box-shadow:'+shadow+';':'')+'" aria-pressed="'+isSel+'"><span class="pn">'+n+'</span><span class="pp">'+POSITIONS[n]+'</span></button>';
    }
    var inner=[1,2,3,4,5,6].filter(function(n){return!excl.includes(n);});
    var outer=[7,8,9].filter(function(n){return!excl.includes(n);});
    var h='';
    if(inner.length) h+='<div class="wiz-pos-sub">内野手</div><div class="pos-grid" style="grid-template-columns:repeat('+inner.length+',1fr);margin-bottom:0">'+inner.map(pb).join('')+'</div>';
    if(outer.length) h+='<div class="wiz-pos-sub" style="margin-top:6px">外野手</div><div class="pos-grid" style="grid-template-columns:repeat(3,1fr)">'+outer.map(pb).join('')+'</div>';
    return h;
  }

  var sec1lbl={
    GO:"最初に拾った選手",SAC:"バントを処理した選手",SQ:"バントを処理した選手",
    FO:"フライを捕った選手",LO:"ライナーを捕った選手",IFF:"内野フライを捕った選手",
    DP:"最初にボールを触った選手",SF:"フライを捕った選手",SQE:"バントを処理した選手",
    E:"エラーをした選手",FC:"最初にボールを触った選手",
    GO_E:"ゴロを処理した選手",SACE:"バントを処理しようとした選手",
    BH:"バント処理（任意）","1H":"打球方向（任意）","2H":"打球方向（任意）","3H":"打球方向（任意）"
  }[ht]||"ボールに触れた選手";

  var html='';

  // ── プレビュー ──
  html+='<div class="sym-preview" style="margin-bottom:10px"><div class="sym" style="color:'+(sym4.color||"#fff")+'">'+sym4.sym+'</div>'+
    '<div class="desc" style="font-size:13px">'+(sym4.desc||"守備選手を選んでください…")+'</div></div>';

  // ── Section 1: 最初に触った選手 ──
  var wKey1=isEType?"errorWho":"fielder1";
  if(sec1done){
    var s1chip=s1val===null?"スキップ":(s1val+' '+POSITIONS[s1val]);
    html+=doneSec(stepNums[si++],sec1lbl,s1chip,wKey1,isEType);
  } else {
    html+='<div class="wiz-section wiz-active">';
    html+='<div class="wiz-section-hdr"><span class="wiz-num">'+stepNums[si++]+'</span>'+sec1lbl+'</div>';
    html+=posGrid(wKey1,isEType,[]);
    if(!isEType){
      html+='<button class="choice-btn light" style="width:100%;padding:9px;font-size:12px;margin-top:4px" data-wiz-skip="fielder_main">わからない・スキップ</button>';
    }
    html+='</div>';
  }

  // ── Section 2: 送球先 ──
  if(needsThrow&&sec1done&&s1val!==null){
    var s2lbl=ht==="DP"?"①の送球先（1stアウト）":"送球先";
    if(sec2done){
      var s2chip=sec2skip?"送球なし（自分でタッチ）":(sel.throwTo+' '+POSITIONS[sel.throwTo]);
      html+=doneSec(stepNums[si++],s2lbl,s2chip,"throwTo",false);
    } else {
      var excl2=s1val?[s1val]:[];
      html+='<div class="wiz-section wiz-active">';
      html+='<div class="wiz-section-hdr"><span class="wiz-num">'+stepNums[si++]+'</span>'+s2lbl+'</div>';
      html+=posGrid("throwTo",false,excl2);
      html+='<button class="choice-btn light" style="width:100%;padding:9px;font-size:12px;margin-top:4px" data-wiz-skip="throw_to" data-wiz-throw-none="1">送球なし（自分でタッチアウト）</button>';
      html+='</div>';
    }
  }

  // ── Section 3: DP 2投目 ──
  if(needsThrow2&&sec2done&&!sec2skip){
    if(sec3done){
      var s3chip=sel.throwTo2===null?"2投目なし":(sel.throwTo2+' '+POSITIONS[sel.throwTo2]);
      html+=doneSec(stepNums[si++],"2投目の送球先",s3chip,"throwTo2",false);
    } else {
      var excl3=[s1val,sel.throwTo].filter(function(v){return v!=null;});
      html+='<div class="wiz-section wiz-active">';
      html+='<div class="wiz-section-hdr"><span class="wiz-num">'+stepNums[si++]+'</span>2人目はどこでアウトにしましたか？</div>';
      html+='<div style="font-size:11px;color:#64748b;margin-bottom:6px">2投目の送球先（2ndアウト）</div>';
      html+=posGrid("throwTo2",false,excl3);
      html+='<button class="choice-btn light" style="width:100%;padding:9px;font-size:12px;margin-top:4px" data-wiz-skip="throw_to2">2投目なし（自分でタッチ）</button>';
      html+='</div>';
    }
  }

  // ── Section 4: エラー確認 ──
  if(needsErrorAsk&&sec2done){
    if(sec4done){
      html+=doneSec(stepNums[si++],"エラーは？",sel.hasError?"エラーあり":"エラーなし","hasError",sel.hasError);
    } else {
      html+='<div class="wiz-section wiz-active">';
      html+='<div class="wiz-section-hdr"><span class="wiz-num">'+stepNums[si++]+'</span>守備ミス（エラー）はありましたか？</div>';
      html+='<div style="font-size:11px;color:#64748b;margin-bottom:7px">捕球ミス・送球ミス・落球などがあった場合は「あり」</div>';
      html+='<div class="choice-grid">';
      html+='<button class="choice-btn" style="background:#f0fdf4;border:2px solid #16a34a;color:#14532d;font-weight:bold;padding:13px 8px" data-wiz-error="no">✓ ミスなし<br><span style="font-size:11px;opacity:.8">正常なプレー</span></button>';
      html+='<button class="choice-btn" style="background:#fff5f5;border:2px solid #c62828;color:#7f1d1d;font-weight:bold;padding:13px 8px" data-wiz-error="yes">⚠ ミスあり<br><span style="font-size:11px;opacity:.8">捕球・送球ミス等</span></button>';
      html+='</div></div>';
    }
  }

  // ── Section 5: エラーした選手（GO/SAC のエラーあり時） ──
  if(!isEType&&sec4done&&sel.hasError===true){
    if(sec5done){
      html+=doneSec(stepNums[si++],"エラーした選手",sel.errorWho+' '+POSITIONS[sel.errorWho],"errorWho",true);
    } else {
      html+='<div class="wiz-section wiz-active">';
      html+='<div class="wiz-section-hdr"><span class="wiz-num">'+stepNums[si++]+'</span>ミスをした選手は誰ですか？</div>';
      html+='<div style="font-size:11px;color:#64748b;margin-bottom:6px">落球・暴投した選手を選んでください</div>';
      html+=posGrid("errorWho",true,[]);
      html+='</div>';
    }
  }

  // ── Section 6: アウト/出塁 ──
  if(needsOutcome&&sec5done&&sel.hasError===true){
    if(sec6done){
      html+=doneSec(stepNums[si++],"打者の結果",sel.outcome==="out"?"アウト":"出塁（エラー）","outcome",sel.outcome==="out");
    } else {
      html+='<div class="wiz-section wiz-active">';
      html+='<div class="wiz-section-hdr"><span class="wiz-num">'+stepNums[si++]+'</span>打者はアウトになりましたか？</div>';
      html+='<div style="font-size:11px;color:#64748b;margin-bottom:7px">ミスがあっても打者がアウトになることがあります</div>';
      html+='<div class="choice-grid">';
      html+='<button class="choice-btn" style="background:#fff5f5;border:2px solid #c62828;color:#7f1d1d;font-weight:bold;padding:13px 8px" data-wiz-outcome="out">✕ アウトになった<br><span style="font-size:11px;opacity:.8">打者もアウト</span></button>';
      html+='<button class="choice-btn" style="background:#f0fdf4;border:2px solid #16a34a;color:#14532d;font-weight:bold;padding:13px 8px" data-wiz-outcome="reach">✓ 塁に出た（エラー出塁）<br><span style="font-size:11px;opacity:.8">打者が1塁などに残った</span></button>';
      html+='</div></div>';
    }
  }

  // ── Section 7: FC 走者アウト ──
  if(needsFcOut&&sec2done&&S.curBases.filter(function(b){return b>=1&&b<=3;}).length>0){
    var fcBases=S.curBases.filter(function(b){return b>=1&&b<=3;});
    var fcL={1:"一塁走者",2:"二塁走者",3:"三塁走者"};
    if(sec7done){
      var s7chip=sel.runnerOutBase===null?"アウトなし":fcL[sel.runnerOutBase]+"がアウト";
      html+=doneSec(stepNums[si++],"アウトになった走者",s7chip,"runnerOutBase",sel.runnerOutBase!==null);
    } else {
      html+='<div class="wiz-section wiz-active">';
      html+='<div class="wiz-section-hdr"><span class="wiz-num">'+stepNums[si++]+'</span>野手が狙った走者は誰ですか？</div>';
      html+='<div style="font-size:11px;color:#64748b;margin-bottom:7px">打者が1塁に向かう間、守備が別の走者をアウトにしようとした走者</div>';
      html+='<div style="display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:6px">';
      fcBases.forEach(function(b){
        html+='<button class="choice-btn" style="background:#fff5f5;border:2px solid #c62828;color:#7f1d1d;font-weight:bold;padding:10px" data-wiz-fc-out="'+b+'">'+fcL[b]+'をアウトにした（しようとした）</button>';
      });
      html+='</div>';
      html+='<button class="choice-btn" style="background:#f0fdf4;border:2px solid #16a34a;color:#14532d;font-weight:bold;padding:10px" data-wiz-fc-out="none">走者へのプレーなし / 不明</button>';
      html+='</div>';
    }
  }

  // ── 記録ボタン ──
  // 詳細の入力状況に応じてラベルを変える（常に押せる）
  var filledCount=[sec1done,sec2done&&needsThrow,sec3done&&needsThrow2,sec4done&&needsErrorAsk].filter(Boolean).length;
  var recordLbl=isHit?'✅ 記録する':(filledCount>0?'✅ 記録する（詳細あり）':'⚡ 今すぐ記録する（詳細なし）');
  html+='<div style="margin-top:14px;padding-top:10px;border-top:2px solid #e2e8f0;">';
  html+='<button class="confirm-btn" id="wizConfirmBtn">'+recordLbl+'</button>';
  if(!isHit&&filledCount===0){
    html+='<div style="font-size:11px;color:#64748b;text-align:center;margin-top:5px">詳細を入力しなくてもOK。後から「後で入力」で追記できます</div>';
  }
  html+='<button class="modal-cancel" id="defWizCancelBtn" style="margin-top:6px">'+(isHit?"スキップして記録する":"キャンセル")+'</button>';
  html+='</div>';

  var titleMap={
    GO:"ゴロ — 守備を記録",SAC:"送りバント — 守備を記録",SQ:"スクイズ — 守備を記録",
    FO:"フライアウト — 守備を記録",LO:"ライナーアウト — 守備を記録",IFF:"内野フライ — 守備を記録",
    DP:"ゲッツー — 守備を記録",SF:"犠牲フライ — 守備を記録",
    E:"エラー — どの選手？",FC:"野選（フィルダースチョイス）— 守備を記録",
    "1H":"ヒット — 守備方向（任意）","2H":"二塁打 — 守備方向（任意）","3H":"三塁打 — 守備方向（任意）",BH:"バントヒット — 守備方向（任意）",
    GO_E:"ゴロエラー — 守備を記録",SACE:"バントエラー — 守備を記録"
  };
  var modalTitle=titleMap[ht]||(isHit?"打球方向（任意）":"守備詳細");
  return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">'+
    '<div class="modal-sheet">'+
    '<div class="modal-title" style="margin-bottom:6px;font-size:15px">⚾ '+modalTitle+'</div>'+
    html+'</div></div>';
}

function renderModal(){
  var m=S.modal;
  if(!m)return"";
  var type=m.type||"";

  // ── ヒット塁数選択モーダル ──
  if(type==="hit_combo"){
    var hcType=m.hitType||"1H";
    var hcTypes=[
      {code:"1H",label:"シングル",sub:"1塁へ"},
      {code:"2H",label:"二塁打",sub:"2塁へ"},
      {code:"3H",label:"三塁打",sub:"3塁へ"}
    ];
    var posInner=[1,2,3,4,5,6];
    var posOuter=[7,8,9];
    function hcPosBtn(n){
      return'<button class="pos-btn" data-hc-fielder="'+n+'" style="background:'+POS_COLORS[n]+';color:#fff;cursor:pointer"><span class="pn">'+n+'</span><span class="pp">'+POSITIONS[n]+'</span></button>';
    }
    return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">'+
      '<div class="modal-sheet" style="padding:16px 14px 12px;">'+
        '<div class="modal-title" style="margin-bottom:10px">⚾ ヒット</div>'+
        '<div style="font-size:11px;font-weight:bold;color:#555;margin-bottom:6px">① 何塁打？</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px">'+
          hcTypes.map(function(t){
            var sel=hcType===t.code;
            return'<button class="rbtn" data-hc-type="'+t.code+'" style="background:'+(sel?'#1b5e20':'#e8f5e9')+';color:'+(sel?'#fff':'#2e7d32')+';border:2px solid '+(sel?'#1b5e20':'#a5d6a7')+';min-height:56px;">'+
              '<span class="rbtn-main" style="font-size:16px;color:inherit">'+t.label+'</span>'+
              '<span class="rbtn-sub" style="color:inherit;opacity:0.85">'+t.sub+'</span>'+
            '</button>';
          }).join("")+
        '</div>'+
        '<div style="font-size:11px;font-weight:bold;color:#555;margin-bottom:4px">② 打球方向（任意 — タップで即記録）</div>'+
        '<div class="wiz-pos-sub">内野手</div>'+
        '<div class="pos-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:4px">'+
          posInner.map(hcPosBtn).join("")+
        '</div>'+
        '<div class="wiz-pos-sub" style="margin-top:4px">外野手</div>'+
        '<div class="pos-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px">'+
          posOuter.map(hcPosBtn).join("")+
        '</div>'+
        '<button id="hcSkipBtn" style="width:100%;background:#f5f5f5;color:#555;border:1.5px dashed #bbb;border-radius:9px;padding:11px;font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:8px">方向なし・スキップして記録</button>'+
        '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
      '</div></div>';
  }

  // ── 走者進塁確認ウィザード ──
  if(type==="runner_move_confirm"){
    var rm=m;
    var runners=rm.runners||[];
    var idx=rm.currentIdx||0;

    // 全走者確認完了 → commit（再帰render防止のためdefer）
    if(idx>=runners.length){
      S.modal=null;
      var _rm1=rm;
      setTimeout(function(){ commitAtBatWithRunnerMoves(_rm1.rc, _rm1.sym, _rm1.sel, _rm1.moves, _rm1.extraOuts||0); }, 0);
      return"";
    }

    var base=runners[idx];
    var move=rm.moves[base]||{to:base===0?"1":String(base),reason:"stay",auto:false};
    // autoで確認不要なものを飛ばす
    if(move.auto && !move.askNeeded){
      var nextIdx2=null;
      for(var ii2=idx+1;ii2<runners.length;ii2++){
        var mii2=rm.moves[runners[ii2]]||{auto:true};
        if(!mii2.auto||mii2.askNeeded){nextIdx2=ii2;break;}
      }
      if(nextIdx2===null){
        S.modal=null;
        var _rm2=rm;
        setTimeout(function(){ commitAtBatWithRunnerMoves(_rm2.rc, _rm2.sym, _rm2.sel, _rm2.moves, _rm2.extraOuts||0); }, 0);
        return"";
      }
      rm.currentIdx=nextIdx2;
      base=runners[nextIdx2];
      move=rm.moves[base]||{to:base===0?"1":String(base),reason:"stay",auto:false};
    }

    var bName=base===0?"今の打者":{1:"一塁走者",2:"二塁走者",3:"三塁走者"}[base]||base+"塁走者";
    var defTo=move.to||(base===0?"1":String(base));
    var hint=move.hint||"";

    // ── 守備番号確認サブステップ ──
    if(rm.awaitingOutDetail){
      var aod=rm.awaitingOutDetail;
      var atBaseNameA={1:"一塁",2:"二塁",3:"三塁",H:"本塁"}[aod.atBase]||aod.atBase;
      var whoName2=aod.base===0?"打者":{1:"一塁走者",2:"二塁走者",3:"三塁走者"}[aod.base]||"走者";
      var defPos2=POS_OPTIONS.map(function(n){
        return'<button class="rm-out-pos" data-base="'+aod.base+'" data-atbase="'+aod.atBase+'" data-defnum="'+n+          '" style="background:'+POS_COLORS[n]+';color:#fff;border:none;border-radius:9px;padding:10px 4px;font-weight:bold;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;">'+
          '<span style="font-size:18px;font-weight:bold">'+n+'</span>'+
          '<span style="font-size:10px;opacity:.9">'+POSITIONS[n]+'</span>'+
        '</button>';
      }).join("");
      return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
        '<div style="background:#ffebee;border-radius:9px;padding:10px 12px;margin-bottom:12px;">'+
          '<div style="font-size:11px;color:#c62828;font-weight:bold;margin-bottom:2px">✕ アウト確定</div>'+
          '<div style="font-size:15px;font-weight:bold;color:#b71c1c">'+whoName2+'が'+atBaseNameA+'でアウト</div>'+
        '</div>'+
        '<div style="font-size:13px;font-weight:bold;color:#333;margin-bottom:9px">アウトにした守備の選手は？（わからなければスキップ）</div>'+
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">'+defPos2+'</div>'+
        '<button class="rm-out-pos" data-base="'+aod.base+'" data-atbase="'+aod.atBase+'" data-defnum="" '+
          'style="width:100%;background:#37474f;color:#fff;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:6px">'+
          'スキップ（守備番号なし）'+
        '</button>'+
        '<button id="rmCancelOutDetail" style="width:100%;background:#fff;color:#555;border:1px solid #ddd;border-radius:9px;padding:11px;font-size:13px;font-weight:bold;cursor:pointer;">◀ 戻る（選び直す）</button>'+
      '</div></div>';
    }

    // ── 進塁先選択ステップ ──
    var bnm={1:"一塁",2:"二塁",3:"三塁",H:"本塁"};

    // プログレス表示
    var progressHtml=runners.map(function(b2,i2){
      var isActive=i2===idx;
      var doneMove2=rm.moves[b2];
      var isDone2=doneMove2&&doneMove2.confirmed;
      var doneLabel2="";
      if(isDone2){
        if(doneMove2.to==="OUT") doneLabel2="✕";
        else if(doneMove2.to==="H") doneLabel2="得点";
        else doneLabel2=doneMove2.to+"塁";
      }
      var n2=b2===0?"打":String(b2);
      var bg2=isActive?"#1565c0":isDone2&&doneMove2.to==="OUT"?"#c62828":isDone2?"#2e7d32":"#e0e0e0";
