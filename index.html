        '<div class="hint">捕球ミス・送球ミス・落球など</div>'+
        '<div class="choice-grid">'+
          '<button class="choice-btn danger" data-wiz-error="yes">🔴 エラーあり<br><span style="font-size:11px;opacity:.85">捕球・送球ミス等</span></button>'+
          '<button class="choice-btn success" data-wiz-error="no">✅ エラーなし<br><span style="font-size:11px;opacity:.85">正常なプレー</span></button>'+
        '</div>';
    }
    else if(step==="error_who"){
      body='<button class="back-btn" id="wizBack">◀ 戻る</button>'+
        '<div class="step-label">エラーした選手</div>'+
        '<div class="step-q">ミスをしたのは誰ですか？</div>'+
        '<div class="hint">例：一塁手が送球を取れなかった→「一（3番）」</div>'+
        preview+posGrid("errorWho");
    }
    else if(step==="fc_runner_out"){
      // FC: 誰がアウトになったか（送球先の走者 or 誰もアウトにならなかった）
      var fcBases=S.curBases.filter(function(b){return b>=1&&b<=3;});
      var fcBLabel={1:"一塁走者",2:"二塁走者",3:"三塁走者"};
      var fcOutBtns=fcBases.map(function(b){
        return'<button class="choice-btn danger" data-wiz-fc-out="'+b+'">'+fcBLabel[b]+'がアウト</button>';
      }).join("");
      body='<button class="back-btn" id="wizBack">◀ 戻る</button>'+preview+
        '<div class="step-q">誰がアウトになりましたか？</div>'+
        '<div class="hint">野選では守備が打者ではなく別の走者をアウトにしようとします。実際にアウトになった走者を選んでください。</div>'+
        '<div style="display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:8px">'+fcOutBtns+'</div>'+
        '<button class="choice-btn gray" style="width:100%" data-wiz-fc-out="none">誰もアウトにならなかった</button>';
    }
    else if(step==="outcome"){
      body='<button class="back-btn" id="wizBack">◀ 戻る</button>'+preview+
        '<div class="step-q">打者は最終的にどうなりましたか？</div>'+
        '<div class="choice-grid">'+
          '<button class="choice-btn danger" data-wiz-outcome="out">✕ アウト<br><span style="font-size:11px;opacity:.85">打者はアウト</span></button>'+
          '<button class="choice-btn success" data-wiz-outcome="reach">✓ 出塁<br><span style="font-size:11px;opacity:.85">打者が塁に出た</span></button>'+
        '</div>';
    }
    else if(step==="confirm"){
      var dn2=buildDefNote(sel);
      body='<button class="back-btn" id="wizBack">◀ 戻る（入力し直す）</button>'+
        '<div style="background:#e8f5e9;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:#1b5e20;font-weight:bold;">'+
          '✅ これで合っていれば「記録する」を押してください。違う場合は「戻る」で修正できます。'+
        '</div>'+
        '<div class="step-label">記録内容の確認</div>'+
        '<div style="background:#f8f9fa;border-radius:9px;padding:10px;margin-bottom:10px">'+
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'+
            '<span style="background:'+sym4.color+';color:#fff;border-radius:7px;padding:5px 12px;font-size:18px;font-weight:900;font-family:monospace">'+sym4.sym+'</span>'+
            '<span style="font-size:13px;font-weight:bold">'+sym4.desc+'</span>'+
          '</div>'+
          (dn2?'<div style="background:#e3f2fd;border-radius:7px;padding:6px 9px;font-size:11px;color:#1565c0;font-weight:bold">🛡 '+dn2+'</div>':"")+
        '</div>'+
        '<button class="confirm-btn" id="wizConfirmBtn">✅ この内容で記録する</button>';
    }
    var cancelLabel=isHit?"スキップして記録する":"キャンセル";
    return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
      '<div class="modal-title">'+(isHit?"⚾ ヒット守備詳細":"⚾ 守備詳細入力")+'</div>'+
      body+
      '<button class="modal-cancel" id="defWizCancelBtn">'+cancelLabel+'</button>'+
    '</div></div>';
  }

  // WP/PB/BALK: 一括進塁提案モーダル
  if(type==="runner_advance"){
    var code_adv=m.eventCode||"";
    var evtLbl=(RUNNER_EVENTS.find(function(r){return r.code===code_adv;})||{label:code_adv}).label;
    var suggested=m.suggested||[];
    var active_adv=S.curBases.filter(function(b){return b>=1&&b<=3;});
    var bLabel_adv={1:"一塁走者→二塁",2:"二塁走者→三塁",3:"三塁走者→ホームイン🏠（得点）"};
    var codeHint={WP:"ワイルドピッチ（暴投）",PB:"パスボール（捕逸）",BALK:"ボーク"};
    return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
      '<div class="modal-title">🌀 '+evtLbl+'</div>'+
      '<div class="modal-sub">'+(codeHint[code_adv]||"")+'：走者が1つ進みます</div>'+
      '<div style="background:#e8f5e9;border-radius:10px;padding:11px;margin-bottom:12px">'+
        '<div style="font-size:11px;font-weight:bold;color:#1b5e20;margin-bottom:6px">✅ 自動提案（全走者が1つ進む）</div>'+
        active_adv.map(function(b){return'<div style="font-size:13px;font-weight:bold;padding:3px 0">'+bLabel_adv[b]+'</div>';}).join("")+
      '</div>'+
      '<button id="advanceAllBtn" style="width:100%;background:#1b7a3e;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:8px">✅ この通りに記録する</button>'+
      '<button id="advanceCustomBtn" style="width:100%;background:#fff;color:#1a3a6e;border:2px solid #1a3a6e;border-radius:10px;padding:11px;font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:6px">⚙️ 2つ以上進んだ・一部だけ進んだ場合はこちら</button>'+
      '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
    '</div></div>';
  }

  // 盗塁後の連動確認（他の走者への影響）
  if(type==="runner_chain"){
    var code_ch=m.eventCode||"";
    var remaining=m.remaining||[];
    var bLabel_ch={1:"一塁走者",2:"二塁走者",3:"三塁走者"};
    return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
      '<div class="modal-title">🏃 他の走者への影響</div>'+
      '<div class="modal-sub">盗塁と同時に他の走者も動きましたか？</div>'+
      '<div style="font-size:11px;font-weight:bold;color:#555;margin-bottom:8px">残りの走者：</div>'+
      '<div id="runnerCBs">'+
        remaining.map(function(b){
          return'<label style="display:flex;align-items:center;gap:9px;padding:10px;background:#f8f9fa;border-radius:9px;margin-bottom:5px;cursor:pointer;">'+
            '<input type="checkbox" value="'+b+'" style="width:18px;height:18px">'+
            '<span style="font-size:13px;font-weight:bold">'+bLabel_ch[b]+' → '+(b<3?(b+1)+'塁へ（重盗）':'🏠ホームイン（得点）')+'</span>'+
          '</label>';
        }).join("")+
      '</div>'+
      '<button id="chainConfirmBtn" style="background:#1b7a3e;color:#fff;border:none;border-radius:10px;width:100%;padding:12px;font-size:13px;font-weight:bold;cursor:pointer;margin:7px 0">✅ 選択した走者も進塁記録</button>'+
      '<button class="modal-cancel" id="closeModalBtn">なし（他は動かなかった）</button>'+
    '</div></div>';
  }

  // 走者アウト（牽制・走塁死・盗塁失敗）
  if(type==="runner_out"){
    var code=m.eventCode||"";
    var evtLabelMap={CS:"盗塁失敗（CS）",PO:"牽制アウト（PO）",ROUT:"走塁死",RUNDOWN:"挟殺（ランダウン）アウト"};
    var evtLabel=evtLabelMap[code]||code;
    var hintMap={CS:"盗塁しようとして捕手に刺された",PO:"牽制球でアウトになった",ROUT:"余分な進塁を試みてアウトになった",RUNDOWN:"塁間で挟まれてタッチアウト（ランダウンプレー）"};
    var hint2=hintMap[code]||"";
    var active=S.curBases.filter(function(b){return b>=1&&b<=3;});
    var bLabelMap={1:"一塁走者",2:"二塁走者",3:"三塁走者"};
    var routDef=S.routDefNum;
    return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
      '<div class="modal-title">⚾ '+evtLabel+'</div>'+
      '<div class="modal-sub">'+hint2+'</div>'+
      (active.length===0?'<div style="text-align:center;padding:16px;color:#aaa">走者がいません</div>':
        '<div style="font-size:11px;font-weight:bold;color:#555;margin-bottom:8px">アウトになった走者は？</div>'+
        '<div id="routRunnerBtns" style="display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:12px">'+
          active.map(function(b){return'<button class="choice-btn danger" data-rout-base="'+b+'">'+bLabelMap[b]+'（'+b+'塁）がアウト</button>';}).join("")+
        '</div>'+
        '<div style="font-size:11px;font-weight:bold;color:#555;margin-bottom:6px">誰がアウトにした？（任意）</div>'+
        '<div class="pos-grid">'+
          POS_OPTIONS.map(function(n){
            var sel2=routDef===n;
            return'<button class="pos-btn" style="background:'+(sel2?"#fff":""+POS_COLORS[n])+';color:'+(sel2?POS_COLORS[n]:"#fff")+';border:'+(sel2?"2px solid "+POS_COLORS[n]:"none")+'" data-rout-def="'+n+'"><span class="pn">'+n+'</span><span class="pp">'+POSITIONS[n]+'</span></button>';
          }).join("")+
        '</div>')+
      '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
    '</div></div>';
  }

  // 走者イベント（進塁）
  if(type==="runner_event"){
    var code2=m.eventCode||"";
    var evtLabel2=(RUNNER_EVENTS.find(function(r){return r.code===code2;})||{label:code2}).label;
    if(code2==="SCORE"){
      return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
        '<div class="modal-title">🏠 得点追加</div>'+
        '<div class="choice-grid">'+[1,2,3].map(function(n){return'<button class="choice-btn danger" data-score="'+n+'">+'+n+'点</button>';}).join("")+'</div>'+
        '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
      '</div></div>';
    }
    var active2=S.curBases.filter(function(b){return b>=1&&b<=3;});
    if(active2.length===0){
      return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
        '<div class="modal-title">'+evtLabel2+'</div>'+
        '<div style="text-align:center;padding:18px;color:#aaa;font-size:13px">走者がいません</div>'+
        '<button class="modal-cancel" id="closeModalBtn">閉じる</button>'+
      '</div></div>';
    }
    var bLabel2={1:"一塁走者",2:"二塁走者",3:"三塁走者"};
    var bTo={1:"2塁へ",2:"3塁へ",3:"🏠ホームイン"};

    // ── 盗塁(SB)の特別処理 ──
    if(code2==="SB"){
      var has1=active2.includes(1),has2=active2.includes(2),has3=active2.includes(3);

      // 走者1人のみ → 選択不要、即記録
      if(active2.length===1){
        var onlyBase=active2[0];
        // 即applyRunnerEventを呼ぶのではなく、確認なしで記録するボタンを大きく1つだけ表示
        return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
          '<div class="modal-title">盗塁</div>'+
          '<div style="background:#e8f5e9;border-radius:10px;padding:14px;margin-bottom:14px;text-align:center">'+
            '<div style="font-size:16px;font-weight:bold;color:#1b5e20">'+bLabel2[onlyBase]+'が '+bTo[onlyBase]+'</div>'+
            '<div style="font-size:12px;color:#555;margin-top:5px">盗塁成功として記録します</div>'+
          '</div>'+
          '<button id="applyRunner" data-auto-bases="'+onlyBase+'" style="background:#1b5e20;color:#fff;border:none;border-radius:11px;width:100%;padding:14px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:8px">✅ 記録する</button>'+
          '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
        '</div></div>';
      }

      // 走者1塁＋2塁 → 重盗の可能性を考慮した選択
      if(has1&&has2&&!has3){
        return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
          '<div class="modal-title">盗塁</div>'+
          '<div style="font-size:13px;color:#555;margin-bottom:10px">1・2塁に走者がいます。どの走者が盗塁しましたか？</div>'+
          '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">'+
            '<button class="choice-btn success" data-auto-bases="1" id="applyRunner">一塁走者のみ盗塁（2塁へ）</button>'+
            '<button class="choice-btn success" data-auto-bases="2" id="applyRunner2">二塁走者のみ盗塁（3塁へ）</button>'+
            '<button class="choice-btn primary" data-auto-bases="1,2" id="applyRunner3">両方同時に盗塁（重盗）</button>'+
          '</div>'+
          '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
        '</div></div>';
      }

      // 走者1塁＋3塁（2塁なし）
      if(has1&&!has2&&has3){
        return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
          '<div class="modal-title">盗塁</div>'+
          '<div style="font-size:13px;color:#555;margin-bottom:10px">1・3塁に走者がいます。どの走者が盗塁しましたか？</div>'+
          '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">'+
            '<button class="choice-btn success" data-auto-bases="1" id="applyRunner">一塁走者のみ盗塁（2塁へ）</button>'+
            '<button class="choice-btn success" data-auto-bases="3" id="applyRunner2">三塁走者のみ本塁へ（得点）</button>'+
            '<button class="choice-btn primary" data-auto-bases="1,3" id="applyRunner3">両方同時（1→2塁、3→本塁）</button>'+
          '</div>'+
          '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
        '</div></div>';
      }

      // 走者2塁＋3塁（1塁なし）→ 2塁走者のみ3塁は不可（3塁が埋まっている）
      if(!has1&&has2&&has3){
        return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
          '<div class="modal-title">盗塁</div>'+
          '<div style="font-size:13px;color:#555;margin-bottom:10px">2・3塁に走者がいます。どの走者が盗塁しましたか？</div>'+
          '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">'+
            '<button class="choice-btn success" data-auto-bases="3" id="applyRunner">三塁走者のみ本塁へ（得点）</button>'+
            '<button class="choice-btn primary" data-auto-bases="2,3" id="applyRunner2">重盗（2→3塁、3→本塁）</button>'+
            '<button class="choice-btn" disabled style="opacity:0.4;cursor:not-allowed;background:#ccc;color:#666;border-radius:9px;padding:12px;font-size:13px;font-weight:bold">⚠ 二塁走者のみ3塁へ：不可（3塁が埋まっています）</button>'+
          '</div>'+
          '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
        '</div></div>';
      }

      // 満塁 → 1or2塁走者のみの盗塁は不可。三重盗 or 3塁走者のみ本塁のみ有効
      if(has1&&has2&&has3){
        return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
          '<div class="modal-title">盗塁（満塁）</div>'+
          '<div style="font-size:13px;color:#555;margin-bottom:10px">満塁です。有効な盗塁を選択してください。</div>'+
          '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">'+
            '<button class="choice-btn success" data-auto-bases="3" id="applyRunner">三塁走者のみ本塁へ（得点）</button>'+
            '<button class="choice-btn primary" data-auto-bases="1,2,3" id="applyRunner2">三重盗（全走者1つ進む）</button>'+
            '<button class="choice-btn" disabled style="opacity:0.4;cursor:not-allowed;background:#ccc;color:#666;border-radius:9px;padding:12px;font-size:13px;font-weight:bold">⚠ 一・二塁走者のみ：不可（前の塁が埋まっています）</button>'+
          '</div>'+
          '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
        '</div></div>';
      }

      // それ以外（走者複数、組み合わせが複雑）→ チェックボックス選択
    }

    // ── 通常の進塁選択（WP/PB/BALKなど、または複雑な盗塁） ──
    return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
      '<div class="modal-title">'+evtLabel2+'</div>'+
      '<div class="modal-sub">進塁した走者を選択してください</div>'+
      '<div id="runnerCBs">'+
        active2.map(function(b){
          var bName=bLabel2[b]||b+"塁走者";
          var opts=[];
          if(b===1){opts.push({to:"2",lbl:"2塁へ"});opts.push({to:"3",lbl:"3塁へ"});opts.push({to:"H",lbl:"🏠ホームイン"});}
          if(b===2){opts.push({to:"3",lbl:"3塁へ"});opts.push({to:"H",lbl:"🏠ホームイン"});}
          if(b===3){opts.push({to:"H",lbl:"🏠ホームイン"});}
          return'<div style="margin-bottom:12px">'+
            '<div style="font-size:12px;font-weight:bold;color:#1a3a6e;margin-bottom:5px">'+bName+'</div>'+
            '<div style="display:flex;gap:5px">'+
            opts.map(function(o){
              return'<button class="runner-dest-btn" data-base="'+b+'" data-to="'+o.to+'" '+
                'style="flex:1;background:#1a3a6e;color:#fff;border:none;border-radius:9px;padding:10px 4px;font-size:12px;font-weight:bold;cursor:pointer">'+o.lbl+'</button>';
            }).join("")+
            '<button class="runner-dest-btn" data-base="'+b+'" data-to="stay" '+
              'style="flex:1;background:#f0f0f0;color:#888;border:none;border-radius:9px;padding:10px 4px;font-size:11px;cursor:pointer">動かない</button>'+
            '</div>'+
          '</div>';
        }).join("")+
      '</div>'+
      '<button id="applyRunner" style="background:#1b7a3e;color:#fff;border:none;border-radius:11px;width:100%;padding:14px;font-size:15px;font-weight:bold;cursor:pointer;margin:8px 0">✅ 記録する</button>'+
      '<button class="modal-cancel" id="closeModalBtn">キャンセル</button>'+
    '</div></div>';
  }

  // 投手管理ヘルプ
  if(type==="pitcher_help"){
    return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
      '<div class="modal-title">投手管理について</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px;padding-bottom:8px">'+
        '<div style="background:#f0f4f8;border-radius:9px;padding:12px">'+
          '<div style="font-weight:bold;font-size:14px;margin-bottom:6px;color:#1a3a6e">投手の成績として記録されるもの</div>'+
          '<div style="font-size:13px;color:#444;line-height:1.8">'+
            '⚾ <b>球数</b>：投げた球の合計数<br>'+
            '👤 <b>打者数</b>：対戦した打者の人数<br>'+
            '📊 <b>投球回</b>：何イニング投げたか（例：2.1 = 2回と1/3）<br>'+
            '🔴 <b>自責点</b>：守備ミスなしで入った点（投手の責任）'+
          '</div>'+
        '</div>'+
        '<div style="background:#fff8e1;border-radius:9px;padding:12px">'+
          '<div style="font-weight:bold;font-size:14px;margin-bottom:6px;color:#5d4037">「自責点」って何？</div>'+
          '<div style="font-size:13px;color:#5d4037;line-height:1.7">'+
            '守備側がミス（エラー）をしなければ入らなかった点は、投手の責任ではないとみなされます。<br><br>'+
            'エラーで出塁した走者がホームに帰っても、その点は投手の成績に入りません。'+
            'アプリが自動で判断します。'+
          '</div>'+

}

function buildWriteGuide(ab){
  if(!ab)return"";
  var rc=ab.result||"",sel=ab.defense||{};
  var sym=ab.sym||{sym:rc,color:"#333"};
  var rp=ab.runPath||[],scored=rp.includes("H")||((ab.scored||0)>0);
  var bNames={"1":"1塁","2":"2塁","3":"3塁","H":"ホーム"};
  var steps=[];
  var step=1;

  // 投球記号（左上）
  if(ab.pitches&&ab.pitches.length>0){
    steps.push(step+++'. <strong>左上</strong>に投球記号を小さく記入 — '+ab.pitches.length+'球投げました');
  }
  // 結果記号（右下）
  if(sym.sym){
    steps.push(step+++'. <strong>右下</strong>に結果を記入: <span style="color:'+sym.color+';font-family:monospace;font-weight:900;font-size:14px">'+sym.sym+'</span>');
  }
  // HR/RH の右上
  if(rc==="HR"||rc==="RH"){
    steps.push(step+++'. <strong>右上</strong>に <span style="color:#c62828;font-family:monospace;font-weight:900">'+rc+'</span> と書く（本塁打の印）');
  }
  // タイムリー打点（右上）
  if(ab.isTimely&&ab.timelyCount>0&&rc!=="HR"&&rc!=="RH"){
    steps.push(step+++'. <strong>右上</strong>に <span style="color:#c62828;font-weight:900">'+ab.timelyCount+'打点</span> と書く（タイムリー）');
  }
  // 走塁ライン（赤線）
  if(rp.length>0){
    var pathStr=["ホーム"].concat(rp.map(function(b){return bNames[String(b)]||b;})).join(" → ");
    steps.push(step+++'. <strong style="color:#e53935">赤線</strong>を引く: '+pathStr);
  }
  // 得点の場合
  if(scored&&ab.scoredNum>0){
    steps.push(step+++'. <strong>中央</strong>に丸囲みの得点番号 <span style="color:#e53935;font-weight:900">'+ab.scoredNum+'</span> を書く');
    steps.push(step+++'. ダイヤモンド全体を<strong style="color:#e53935">赤丸</strong>で囲む（得点の印）');
  }
  // アウトカウント
  if(["K","SK","K3B","GO","FO","LO","SAC","SF","DP","IFF","SQ","SQE"].includes(rc)){
    var outRoman=["","I","II","III"][Math.min(ab.outCountAfter||0,3)];
    if(outRoman)steps.push(step+++'. <strong style="color:#c62828">'+outRoman+'</strong> と書く（アウトカウント）');
  }
  // 牽制・走者アウト
  if(ab.runnerOutEvents&&ab.runnerOutEvents.length>0){
    var roeDesc={PO:"牽制",CS:"盗塁失敗",ROUT:"走塁死",RUNDOWN:"挟殺"};
    ab.runnerOutEvents.forEach(function(ev){
      var base=bNames[String(ev.outBase)]||ev.outBase;
      steps.push(step+++'. '+base+'で走者がアウト（'+((roeDesc[ev.code]||ev.code))+'） — 走塁線に<strong style="color:#c62828">✕</strong>を書く');
    });
  }

  if(steps.length===0)return'';
  return steps.map(function(s){return '<div style="margin-bottom:5px;line-height:1.6">'+s+'</div>';}).join('');
}

function renderSheetScorebook(){
  var baseInnings=S.maxInnings||5;
  var playedInnings=S.curInning+1;
  ["top","bottom"].forEach(function(side){
    (S.game[side]||[]).forEach(function(inn,i){
      if(inn&&((inn.atBats&&inn.atBats.length>0)||(inn.events&&inn.events.length>0)||inn.score>0)){
        playedInnings=Math.max(playedInnings,i+1);
      }
    });
  });
  var dispInnings=Math.max(baseInnings,playedInnings);

  var sides=[
    {side:"top",  team:S.awayTeam, label:"先攻", color:"#c62828"},
    {side:"bottom",team:S.homeTeam, label:"後攻", color:"#1565c0"}
  ];

  var html='<div style="padding:6px 4px 80px;">';

  sides.forEach(function(t){
    var team=t.side==="top"?S.awayTeam:S.homeTeam;
    var players=team.players||[];

    // チームヘッダー
    html+='<div style="background:'+t.color+';color:#fff;padding:8px 12px;border-radius:10px 10px 0 0;margin-top:8px;font-size:13px;font-weight:bold;">'+
      escH(team.name)+' <span style="font-size:11px;opacity:.8">'+t.label+'</span></div>';

    // テーブル
    html+='<div style="overflow-x:auto;background:#fff;border:1px solid #ddd;border-top:none;border-radius:0 0 10px 10px;margin-bottom:4px;">';
    html+='<table style="border-collapse:collapse;min-width:'+(200+dispInnings*76)+'px;width:100%">';

    // ヘッダー行
    html+='<thead><tr style="background:#f5f7fa;border-bottom:2px solid #ccc;">';
    html+='<th style="padding:4px 6px;font-size:10px;color:#888;border-right:1px solid #e0e0e0;min-width:30px;text-align:center">打順</th>';
    html+='<th style="padding:4px 6px;font-size:10px;color:#888;border-right:1px solid #e0e0e0;min-width:50px;text-align:left">選手</th>';
    html+='<th style="padding:4px 3px;font-size:10px;color:#888;border-right:1px solid #e0e0e0;width:22px;text-align:center">守</th>';
    for(var ci=0;ci<dispInnings;ci++){
      var isCur=S.curInning===ci&&S.curSide===t.side;
      html+='<th style="padding:4px 2px;font-size:11px;font-weight:bold;text-align:center;border-right:1px solid #e0e0e0;min-width:72px;'+
        (isCur?'background:#fff3e0;color:#e65100':'color:#555')+';">'+(ci+1)+'</th>';
    }
    html+='</tr></thead><tbody>';

    // 各打順行
    for(var order=1;order<=9;order++){
      var p=players[order-1];
      var pName2=p?p.name:"";
      var pNum2=p?p.number:"";
      var pPos2=p?POSITIONS[p.position]||"":"";
      // 代打記録のチェック
      var subInfo="";
      (S.game[t.side]||[]).forEach(function(inn){
        (inn.changes||[]).forEach(function(ch){
          if((ch.type==="hitter"||ch.type==="runner")){
            // この打順に関連する交代を表示
          }
        });
      });

      html+='<tr style="border-bottom:1px solid #e8e8e8;">';
      // 打順
      html+='<td style="padding:2px 4px;text-align:center;font-weight:bold;font-size:13px;color:#1a3a6e;border-right:1px solid #e0e0e0;background:#f8f9fc">'+order+'</td>';
      // 選手名
      html+='<td style="padding:2px 6px;font-size:11px;font-weight:bold;border-right:1px solid #e0e0e0;background:#f8f9fc;white-space:nowrap;">'+
        (pNum2?'<span style="color:#999;font-size:10px">#'+escH(pNum2)+'</span> ':'')+escH(pName2)+'</td>';
      // 守備位置
      html+='<td style="padding:2px 3px;text-align:center;font-size:11px;color:#555;border-right:1px solid #e0e0e0;background:#f8f9fc">'+escH(pPos2)+'</td>';

      // 各イニングのセル
      for(var ii=0;ii<dispInnings;ii++){
        var inn2=S.game[t.side][ii];
        // この打順のat-batを探す
        var matchAbs=[];
        if(inn2&&inn2.atBats){
          matchAbs=inn2.atBats.filter(function(ab2){return ab2.order===order;});
        }
        // slotsもチェック
        var matchSlots=[];
        if(inn2&&inn2.slots){
          matchSlots=inn2.slots.filter(function(sl){return sl.order===order;});
        }

        var isCurCell=S.curInning===ii&&S.curSide===t.side;
        var cellBg=isCurCell?"#fffde7":"#fff";

        html+='<td style="padding:1px;text-align:center;vertical-align:middle;border-right:1px solid #e0e0e0;background:'+cellBg+';min-height:68px">';

        if(matchAbs.length>0){
          matchAbs.forEach(function(mab,mIdx){

            html+='<div style="display:inline-block;position:relative;cursor:pointer" data-edit-ab="'+ii+'-'+t.side+'-'+mab.order+'">';
            html+=wasedaDiamondSvg(mab,66);
            html+='</div>';
          });
        } else if(matchSlots.length>0){
          matchSlots.forEach(function(msl){
            var qs=msl.quickStatus||"pending";
            var qsIcon=qs==="out"?"✕":qs==="reach"?"○":"…";
            var qsColor=qs==="out"?"#90a4ae":qs==="reach"?"#66bb6a":"#ffb74d";
            html+='<div style="width:66px;height:66px;display:inline-flex;align-items:center;justify-content:center;border:2px dashed '+qsColor+';border-radius:6px;margin:1px auto;cursor:pointer;font-size:18px;color:'+qsColor+'" '+
              'data-edit-slot="'+ii+'-'+(msl.slotIdx||0)+'-'+t.side+'">'+qsIcon+'</div>';
          });
        } else {
          // 空セル
          html+='<div style="width:66px;height:66px;display:inline-block;opacity:.15">'+
            '<svg width="66" height="66" viewBox="0 0 66 66"><polygon points="33,57 57,33 33,9 9,33" fill="none" stroke="#ccc" stroke-width="1"/></svg>'+
          '</div>';
        }

        html+='</td>';
      }
      html+='</tr>';
    }

    html+='</tbody></table></div>';
  });

  html+='</div>';
  return html;
}

// ============================================================
// 打撃・投手成績計算
// ============================================================
// ヒット判定コード
var HIT_CODES  = ["1H","2H","3H","HR","RH","BH"];
var SINGLE_CODES = ["1H","BH"];
var DOUBLE_CODES = ["2H"];
var TRIPLE_CODES = ["3H"];
var HR_CODES   = ["HR","RH"];
var BB_CODES   = ["BB","IBB"];
var HBP_CODES  = ["HBP"];
var K_CODES    = ["K","SK","K3B","KWP"];
var SAC_CODES  = ["SAC","SQ","SACE","SQE"];
var SF_CODES   = ["SF"];
// AB除外コード（打席数にはカウントするがABから除外）
var NO_AB_CODES = BB_CODES.concat(HBP_CODES,SAC_CODES,SF_CODES,["CI","OBI"]);

function fmt3(n){ return isNaN(n)?".---":("."+("000"+Math.round(n*1000)).slice(-3)); }
function fmtERA(er,ip){ if(ip<=0)return"---"; return (er*9/ip).toFixed(2); }
function pitchWarnBadge(count){
  if(count>=85) return'<span class="pitch-warn-badge pitch-warn-r">'+count+'球 ⚠</span>';
  if(count>=75) return'<span class="pitch-warn-badge pitch-warn-o">'+count+'球 注意</span>';
  if(count>=60) return'<span class="pitch-warn-badge pitch-warn-y">'+count+'球</span>';
  return'';
}

function calcPlayerStats(side){
  // 選手ユニークキー(打順+名前+背番号)→stats のマップ
  // 代打・代走で同じ打順に別選手が入った場合も分離して集計
  var map={};
  function get(order,name,num){
    var key=order+"_"+name+"_"+num;
    if(!map[key])map[key]={order:order,name:name,num:num,
      pa:0,ab:0,h:0,single:0,double:0,triple:0,hr:0,
      bb:0,hbp:0,k:0,sac:0,sf:0,rbi:0,r:0,sb:0,cs:0,
      ibb:0,ruspAb:0,ruspH:0};
    return map[key];
  }
  (S.game[side]||[]).forEach(function(inn){
    // 通常打席
    (inn.atBats||[]).forEach(function(ab){
      var st=get(ab.order,ab.playerName||ab.order+"番",ab.playerNum||"");
      var rc=ab.result;
      st.pa++;
      if(!NO_AB_CODES.includes(rc)) st.ab++;
      if(HIT_CODES.includes(rc))  st.h++;
      if(SINGLE_CODES.includes(rc)) st.single++;
      if(DOUBLE_CODES.includes(rc)) st.double++;
      if(TRIPLE_CODES.includes(rc)) st.triple++;
      if(HR_CODES.includes(rc))   st.hr++;
      if(BB_CODES.includes(rc))   st.bb++;
      if(rc==="IBB") st.ibb++;
      if(HBP_CODES.includes(rc))  st.hbp++;
      if(K_CODES.includes(rc))    st.k++;
      if(SAC_CODES.includes(rc))  st.sac++;
      if(SF_CODES.includes(rc))   st.sf++;
      // RBI: タイムリー or 押し出し
      if((ab.isTimely||ab.isForcedIn)&&ab.timelyCount>0) st.rbi+=ab.timelyCount;
      // R: HR/RH で打者自身が生還
      if(HR_CODES.includes(rc)) st.r++;
      // R: 走者として後から生還（scoredByBatterOrder が設定されている打席）
      if(ab.scoredByBatterOrder) st.r++;
      // 盗塁/盗塁失敗: 打席中の走者イベント
      (ab.runnerEvents||[]).forEach(function(ev){
        var c=ev.type||ev.code;
        if(c==="SB") st.sb++;
        if(c==="CS") st.cs++;
      });
      // RISP (得点圏打率)
      if(ab.ruspAtBat&&!NO_AB_CODES.includes(rc)){st.ruspAb++;if(HIT_CODES.includes(rc))st.ruspH++;}
    });
    // 空欄スロット（filled済み）
    (inn.slots||[]).forEach(function(slot){
      if(slot.type!=="filled")return;
      var ab=slot;
      var st=get(ab.order,ab.playerName||ab.order+"番",ab.playerNum||"");
      var rc=ab.result;
      st.pa++;
      if(!NO_AB_CODES.includes(rc)) st.ab++;
      if(HIT_CODES.includes(rc))  st.h++;
      if(SINGLE_CODES.includes(rc)) st.single++;
      if(DOUBLE_CODES.includes(rc)) st.double++;
      if(TRIPLE_CODES.includes(rc)) st.triple++;
      if(HR_CODES.includes(rc))   st.hr++;
      if(BB_CODES.includes(rc))   st.bb++;
      if(HBP_CODES.includes(rc))  st.hbp++;
      if(K_CODES.includes(rc))    st.k++;
      if(SAC_CODES.includes(rc))  st.sac++;
      if(SF_CODES.includes(rc))   st.sf++;
      if((ab.isTimely||ab.isForcedIn)&&ab.timelyCount>0) st.rbi+=ab.timelyCount;
      if(HR_CODES.includes(rc)) st.r++;
      if(ab.scoredByBatterOrder) st.r++;
      // RISP
      if(ab.ruspAtBat&&!NO_AB_CODES.includes(rc)){st.ruspAb++;if(HIT_CODES.includes(rc))st.ruspH++;}
    });
  });
  // 指標計算
  var list=Object.keys(map).sort(function(a,b){return(map[a].order||0)-(map[b].order||0);}).map(function(k){
    var s=map[k];
    var avg = s.ab>0 ? s.h/s.ab : NaN;
    var obp_denom = s.ab+s.bb+s.hbp+s.sf;
    var obp = obp_denom>0 ? (s.h+s.bb+s.hbp)/obp_denom : NaN;
    var slg_denom = s.ab;
    var tb = s.single + s.double*2 + s.triple*3 + s.hr*4;
    var slg = slg_denom>0 ? tb/slg_denom : NaN;
    var ops = (!isNaN(obp)&&!isNaN(slg)) ? obp+slg : NaN;
    var rusp = s.ruspAb>0 ? s.ruspH/s.ruspAb : NaN;
    return Object.assign({},s,{avg:avg,obp:obp,slg:slg,ops:ops,tb:tb,rusp:rusp});
  });
  // チーム集計行
  var tot={order:0,name:"チーム計",num:"",
    pa:0,ab:0,h:0,single:0,double:0,triple:0,hr:0,
    bb:0,hbp:0,k:0,sac:0,sf:0,rbi:0,r:0,sb:0,cs:0,tb:0,ruspAb:0,ruspH:0};
  list.forEach(function(s){
    ["pa","ab","h","single","double","triple","hr","bb","hbp","k","sac","sf","rbi","r","sb","cs","tb","ruspAb","ruspH"].forEach(function(f){tot[f]+=s[f]||0;});
  });
  var tot_obp_d=tot.ab+tot.bb+tot.hbp+tot.sf;
  tot.avg=tot.ab>0?tot.h/tot.ab:NaN;
  tot.obp=tot_obp_d>0?(tot.h+tot.bb+tot.hbp)/tot_obp_d:NaN;
  tot.slg=tot.ab>0?tot.tb/tot.ab:NaN;
  tot.ops=(!isNaN(tot.obp)&&!isNaN(tot.slg))?tot.obp+tot.slg:NaN;
  tot.rusp=tot.ruspAb>0?tot.ruspH/tot.ruspAb:NaN;
  return {rows:list, total:tot};
}

function renderBattingStats(){
  var sides=[
    {side:"top",   team:S.awayTeam, label:"先攻"},
    {side:"bottom",team:S.homeTeam, label:"後攻"}
  ];
  var html='<div style="padding:8px 8px 4px">';

  // 投手成績サマリー（ERA付き）
  html+='<div style="background:#1a3a6e;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;">';
  html+='<div style="font-size:13px;font-weight:bold;margin-bottom:6px;">投手成績</div>';
  html+='<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:360px;">';
  html+='<thead><tr style="opacity:.75;">';
  ["投手","IP","球数","被打者","失点","自責","ERA"].forEach(function(h){
    html+='<th style="padding:3px 5px;text-align:center;white-space:nowrap;font-weight:bold;">'+h+'</th>';
  });
  html+='</tr></thead><tbody>';
  sides.forEach(function(t){
    var ps=S.pitchers[t.side]||[];
    if(ps.length===0)return;
    html+='<tr><td colspan="7" style="padding:3px 5px;font-size:11px;opacity:.7;padding-top:6px;">'+escH(t.team.name)+'</td></tr>';
    ps.forEach(function(p,idx){
      var ip=calcPitcherIP(t.side,idx);
      var ipNum=parseFloat(ip)||0;
      // 小数部分を正規化 (例 2.1 = 2+1/3, 2.2 = 2+2/3)
      var ipReal=Math.floor(ipNum)+(ipNum%1)*10/3;
      var era=fmtERA(p.earnedRuns||0,ipReal);
      html+='<tr style="'+(p.isCurrent?"background:rgba(255,255,255,.12)":"")+'">'+
        '<td style="padding:3px 6px;white-space:nowrap;">'+(p.isCurrent?'<span style="font-size:10px;background:#f9a825;color:#fff;border-radius:8px;padding:1px 5px;margin-right:3px;">登板中</span>':'')+(p.number?"#"+escH(p.number)+" ":"")+escH(p.name)+'</td>'+
        '<td style="text-align:center;padding:3px 4px;font-weight:bold;">'+ip+'</td>'+
        '<td style="text-align:center;padding:3px 4px;">'+(p.pitchCount||0)+'</td>'+
        '<td style="text-align:center;padding:3px 4px;">'+(p.battersFaced||0)+'</td>'+
        '<td style="text-align:center;padding:3px 4px;color:'+(((p.earnedRuns||0)+(p.unearnedRuns||0))>0?"#ff8a80":"#fff")+'">'+(((p.earnedRuns||0)+(p.unearnedRuns||0)))+'</td>'+
        '<td style="text-align:center;padding:3px 4px;color:'+((p.earnedRuns||0)>0?"#ff8a80":"#fff")+'">'+(p.earnedRuns||0)+'</td>'+
        '<td style="text-align:center;padding:3px 4px;font-weight:bold;color:'+((p.earnedRuns||0)>0?"#ffb74d":"#aef")+'">'+era+'</td>'+
      '</tr>';
    });
  });
  html+='</tbody></table></div></div>';

  // 打撃成績
  sides.forEach(function(t){
    var stats=calcPlayerStats(t.side);
    var rows=stats.rows;
    var tot=stats.total;
    var teamColor=t.side==="top"?"#c62828":"#1565c0";

    html+='<div style="background:#fff;border-radius:10px;margin-bottom:12px;overflow:hidden;">';
    html+='<div style="background:'+teamColor+';padding:9px 14px;display:flex;align-items:center;gap:8px;">'+
      '<span style="color:#fff;font-size:14px;font-weight:bold;">'+escH(t.team.name)+'</span>'+
      '<span style="color:rgba(255,255,255,.7);font-size:11px;">'+t.label+'・打撃成績</span>'+
    '</div>';

    if(rows.length===0){
      html+='<div style="padding:20px;text-align:center;color:#bbb;font-size:13px;">まだ打席記録がありません</div></div>';
      return;
    }

    html+='<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:520px;">';
    html+='<thead><tr style="background:#f5f7fa;">';
    var heads=["#","選手","打席","打数","安打","二打","三打","本塁","打点","得点","四球","死球","三振","盗塁","盗死","打率","得圏打率","出塁率","長打率","OPS"];
    var tips= ["","","PA","AB","H","2B","3B","HR","RBI","R","BB","HBP","K","SB","CS","AVG","RISP","OBP","SLG","OPS"];
    heads.forEach(function(h,i){
      html+='<th title="'+tips[i]+'" style="padding:5px 4px;text-align:center;white-space:nowrap;color:#555;font-size:11px;border-bottom:2px solid #e0e0e0;cursor:default;">'+h+'</th>';
    });
    html+='</tr></thead><tbody>';

    rows.forEach(function(s,ri){
      var opsColor="#333";
      if(!isNaN(s.ops)){
        if(s.ops>=1.0) opsColor="#b71c1c";
        else if(s.ops>=0.85) opsColor="#e65100";
        else if(s.ops>=0.70) opsColor="#1565c0";
      }
      html+='<tr style="background:'+(ri%2===0?"#fff":"#fafafa")+';border-bottom:1px solid #f0f0f0;">'+
        '<td style="padding:5px 4px;text-align:center;color:#888;font-size:11px;">'+(s.num?"#"+escH(s.num):"")+'</td>'+
        '<td style="padding:5px 6px;white-space:nowrap;font-weight:bold;"><span style="font-size:10px;color:#aaa;margin-right:2px">'+s.order+'</span>'+escH(s.name)+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.pa+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.ab+'</td>'+
        '<td style="text-align:center;padding:4px;font-weight:bold;color:'+(s.h>0?"#2e7d32":"#333")+'">'+s.h+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.double+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.triple+'</td>'+
        '<td style="text-align:center;padding:4px;color:'+(s.hr>0?"#b71c1c":"#333")+';font-weight:'+(s.hr>0?"bold":"normal")+'">'+s.hr+'</td>'+
        '<td style="text-align:center;padding:4px;color:'+(s.rbi>0?"#e65100":"#333")+';font-weight:'+(s.rbi>0?"bold":"normal")+'">'+s.rbi+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.r+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.bb+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.hbp+'</td>'+
        '<td style="text-align:center;padding:4px;color:'+(s.k>0?"#546e7a":"#333")+'">'+s.k+'</td>'+
        '<td style="text-align:center;padding:4px;">'+s.sb+'</td>'+
        '<td style="text-align:center;padding:4px;color:'+(s.cs>0?"#c62828":"#333")+'">'+s.cs+'</td>'+
        '<td style="text-align:center;padding:4px;font-weight:bold;">'+fmt3(s.avg)+'</td>'+
        '<td style="text-align:center;padding:4px;font-weight:bold;color:'+((!isNaN(s.rusp)&&s.rusp>=.300)?"#b71c1c":((!isNaN(s.rusp)&&s.rusp>=.200)?"#e65100":"#333"))+'">'+fmt3(s.rusp)+'</td>'+
        '<td style="text-align:center;padding:4px;font-weight:bold;">'+fmt3(s.obp)+'</td>'+
        '<td style="text-align:center;padding:4px;font-weight:bold;">'+fmt3(s.slg)+'</td>'+
        '<td style="text-align:center;padding:4px;font-weight:bold;color:'+opsColor+';">'+(!isNaN(s.ops)?s.ops.toFixed(3):"---")+'</td>'+
      '</tr>';
    });

    // チーム合計行
    var totOpsColor="#333";
    if(!isNaN(tot.ops)){
      if(tot.ops>=1.0) totOpsColor="#b71c1c";
      else if(tot.ops>=0.85) totOpsColor="#e65100";
      else if(tot.ops>=0.70) totOpsColor="#1565c0";
    }
    html+='<tr style="background:#e8eaf6;font-weight:bold;border-top:2px solid #9fa8da;">'+
      '<td colspan="2" style="padding:5px 6px;color:#3949ab;">合計</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.pa+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.ab+'</td>'+
      '<td style="text-align:center;padding:4px;color:#2e7d32;">'+tot.h+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.double+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.triple+'</td>'+
      '<td style="text-align:center;padding:4px;color:#b71c1c;">'+tot.hr+'</td>'+
      '<td style="text-align:center;padding:4px;color:#e65100;">'+tot.rbi+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.r+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.bb+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.hbp+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.k+'</td>'+
      '<td style="text-align:center;padding:4px;">'+tot.sb+'</td>'+
      '<td style="text-align:center;padding:4px;color:'+(tot.cs>0?"#c62828":"#333")+'">'+tot.cs+'</td>'+
      '<td style="text-align:center;padding:4px;">'+fmt3(tot.avg)+'</td>'+
      '<td style="text-align:center;padding:4px;">'+fmt3(tot.rusp)+'</td>'+
      '<td style="text-align:center;padding:4px;">'+fmt3(tot.obp)+'</td>'+
      '<td style="text-align:center;padding:4px;">'+fmt3(tot.slg)+'</td>'+
      '<td style="text-align:center;padding:4px;color:'+totOpsColor+';">'+(!isNaN(tot.ops)?tot.ops.toFixed(3):"---")+'</td>'+
    '</tr>';

    html+='</tbody></table></div>';

    // 指標説明
    html+='<div style="padding:8px 12px;font-size:11px;color:#888;line-height:1.7;">'+
      '打率(AVG)=安打÷打数　得圏打率(RISP)=得点圏(2・3塁)での安打÷打数　'+
      '出塁率(OBP)=(安打+四球+死球)÷(打数+四球+死球+犠飛)　'+
      '長打率(SLG)=塁打÷打数　OPS=出塁率+長打率'+
    '</div>';
    html+='</div>';
  });

  html+='</div>';
  return html;
}

function renderScoreboard(){
  // 表示イニング数: 基本はS.maxInnings、試合進行で超えたら自動拡張、手動拡張も可能
  var baseInnings=S.maxInnings||5;
  // 実際にプレーされた最後のイニングを検出（空配列要素は無視）
  var playedInnings=S.curInning+1;
  ["top","bottom"].forEach(function(side){
    (S.game[side]||[]).forEach(function(inn,i){
      if(inn&&((inn.atBats&&inn.atBats.length>0)||(inn.events&&inn.events.length>0)||inn.score>0)){
        playedInnings=Math.max(playedInnings,i+1);
      }
    });
  });
  var displayInnings=S.sbExpandedInnings||Math.max(baseInnings, playedInnings);
  if(displayInnings<playedInnings) displayInnings=playedInnings;
  var canExpand=displayInnings<MAX_INNINGS;
  var canShrink=displayInnings>Math.max(baseInnings, playedInnings);

  var innH=Array.from({length:displayInnings},function(_,i){return'<th class="'+(S.curInning===i?"cur-inn":"")+'" style="'+(i>=baseInnings?'color:#1565c0;':'') +'">'+(i+1)+'</th>';}).join("");
  var rows=[["top",escH(S.awayTeam.name),"先攻"],["bottom",escH(S.homeTeam.name),"後攻"]].map(function(arr){
    var side=arr[0],name=arr[1],label=arr[2];
    var cells=Array.from({length:displayInnings},function(_,i){
      var sc=(S.game[side][i]&&S.game[side][i].score)||0;
      var cur=S.curSide===side&&S.curInning===i;
      return'<td class="'+(cur?"sbd-cur":"")+'"><div class="sbd-score" style="color:'+(sc>0?"#e53935":"#333")+'">'+sc+'</div>'+
        '<div class="sbd-btns"><button class="sbd-btn plus" data-side="'+side+'" data-inning="'+i+'" data-d="1">+</button>'+
        '<button class="sbd-btn minus" data-side="'+side+'" data-inning="'+i+'" data-d="-1">-</button></div></td>';
    }).join("");
    // 自責点行
    var erCells=Array.from({length:displayInnings},function(_,i){
      var er=(S.game[side][i]&&S.game[side][i].earnedRuns)||0;
      return'<td style="font-size:10px;color:'+(er>0?"#e65100":"#aaa")+'">'+er+'</td>';
    }).join("");
    return'<tr><td class="team-td"><div style="font-weight:bold;font-size:11px">'+name+'</div><div style="font-size:11px;color:#999">'+label+'</div></td>'+
      cells+'<td class="total-td" style="color:'+(side==="top"?"#e53935":"#1a3a6e")+'">'+totalScore(side)+'</td></tr>'+
      '<tr style="background:#fffde7"><td style="padding:2px 7px;font-size:11px;color:#888">自責点</td>'+erCells+'<td style="font-size:11px;font-weight:bold;color:#e65100;text-align:center;background:#fffde7">'+
        (S.game[side]||[]).reduce(function(a,i){return a+(i.earnedRuns||0);},0)+'</td></tr>';
  }).join("");
  var expandBtn=canExpand
    ?'<button id="sbExpandBtn" style="margin-top:6px;background:#e3f2fd;border:1px solid #90caf9;color:#1565c0;border-radius:7px;padding:5px 14px;font-size:11px;font-weight:bold;cursor:pointer;">延長 ＋1回追加</button>'
    :'';
  var shrinkBtn=canShrink
    ?'<button id="sbShrinkBtn" style="margin-top:6px;margin-left:6px;background:#fff;border:1px solid #ddd;color:#888;border-radius:7px;padding:5px 14px;font-size:11px;font-weight:bold;cursor:pointer;">延長を戻す</button>'
    :'';
  var innCtrl=(expandBtn||shrinkBtn)?'<div style="display:flex;align-items:center;gap:4px;padding:0 2px">'+expandBtn+shrinkBtn+'</div>':'';
  return'<div style="padding:10px 10px 8px"><div class="card" style="padding:8px 6px;overflow-x:auto;">'+
    '<table class="sbd-table"><thead><tr><th class="team-th">チーム</th>'+innH+'<th class="total-th">計</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    innCtrl+
    '<div style="font-size:10px;color:#888;margin-top:6px;padding:0 2px">💡 「自責点」＝守備ミスなしで入った点。投手の成績として記録されます</div>'+
  '</div>'+
  '<button id="copyScoreBtn" style="display:block;width:calc(100% - 20px);margin:8px 10px 4px;padding:10px;background:#fff;border:1.5px solid #1a3a6e;color:#1a3a6e;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer">📋 スコアをコピー</button>'+
  (S.gameEnded
    ? (function(){
        var awayS=totalScore("top"), homeS=totalScore("bottom");
        var resultLabel=awayS>homeS?"先攻チーム勝利":homeS>awayS?"後攻チーム勝利":"引き分け";
        var resultColor=awayS>homeS?"#c62828":homeS>awayS?"#1565c0":"#555";
        return'<div style="margin:0 10px 8px;background:'+resultColor+';color:#fff;border-radius:10px;padding:12px 16px;text-align:center;">'+
          '<div style="font-size:11px;opacity:.85;margin-bottom:2px">試合終了</div>'+
          '<div style="font-size:18px;font-weight:bold">'+resultLabel+'</div>'+
          '<div style="font-size:20px;font-weight:bold;margin-top:4px">'+awayS+' - '+homeS+'</div>'+
          '<button id="reopenGameBtn" style="margin-top:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:7px;padding:6px 16px;font-size:12px;cursor:pointer;">試合を再開する</button>'+
        '</div>';
      })()
    : '<button id="endGameBtn" style="display:block;width:calc(100% - 20px);margin:0 10px 8px;padding:10px;background:#c62828;border:none;color:#fff;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer">🏁 試合終了</button>')+
  '<button id="seasonHistoryBtn" style="display:block;width:calc(100% - 20px);margin:0 10px 8px;padding:9px;background:#fff;border:1.5px solid #546e7a;color:#546e7a;border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer">📋 過去の試合履歴</button>'+
  '</div>';
}

function renderPitchers(){
  var sides=[
    {side:"bottom", label:"先攻投手陣（ビジター守備）", team:S.awayTeam},
    {side:"top",    label:"後攻投手陣（ホーム守備）",   team:S.homeTeam}
  ];
  // 現在の攻撃側に合わせて守備側を先に表示
  if(S.curSide==="bottom"){
    sides=[
      {side:"top",    label:"先攻投手陣（ビジター守備）", team:S.awayTeam},
      {side:"bottom", label:"後攻投手陣（ホーム守備）",   team:S.homeTeam}
    ];
  }

  var html='<div style="padding:10px 10px 4px">';

  // 投手管理とは？ のヘルプバナー
  html+='<div style="background:#f0f4f8;border-radius:9px;padding:9px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;">'+
    '<span style="font-size:16px">📋</span>'+
    '<div style="flex:1;font-size:12px;color:#555">投手ごとの投球数・被打席・失点を管理します</div>'+
    '<button class="help-btn" id="pitcherHelpBtn">?</button>'+
  '</div>';

  sides.forEach(function(s){
    var ps=S.pitchers[s.side]||[];
    var teamColor=s.side==="bottom"?"#1565c0":"#c62828";
    var isDefending=(S.curSide==="top"&&s.side==="bottom")||(S.curSide==="bottom"&&s.side==="top");

    html+='<div style="background:#fff;border-radius:12px;margin-bottom:12px;overflow:hidden;">';
    // ヘッダー
    html+='<div style="background:'+teamColor+';padding:10px 14px;display:flex;align-items:center;gap:8px;">'+
      '<span style="color:#fff;font-size:14px;font-weight:bold">'+escH(s.team.name)+'</span>'+
      (isDefending?'<span style="background:rgba(255,255,255,.25);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:bold">今守備中</span>':'')+
    '</div>';

    if(ps.length===0){
      html+='<div style="padding:16px;text-align:center;color:#bbb;font-size:13px">投手情報がありません</div>';
    } else {
      // 投手一覧カード形式（見やすく）
      ps.forEach(function(p,idx){
        var isCur=p.isCurrent;
        var ip=calcPitcherIP(s.side,idx);
        var cardBg=isCur?"#fffde7":"#fafafa";
        var borderLeft=isCur?"4px solid #f9a825":"4px solid #e0e0e0";
        html+='<div style="border-left:'+borderLeft+';background:'+cardBg+';margin:0 12px 10px;padding:12px 14px;border-radius:0 9px 9px 0;">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
            '<div style="display:flex;align-items:center;gap:8px">'+
              (isCur
                ?'<span style="background:#f9a825;color:#fff;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:bold;flex-shrink:0">登板中</span>'
                :'<span style="background:#e0e0e0;color:#777;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:bold;flex-shrink:0">交代済</span>')+
              '<span style="font-size:15px;font-weight:bold;color:#1a1a2e">'+(p.number?"#"+escH(p.number)+"&thinsp;":"")+escH(p.name)+'</span>'+
            '</div>'+
            '<span style="font-size:11px;color:#aaa">'+calcPitcherInnings(s.side,idx)+'</span>'+
          '</div>'+
          '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center">'+
            '<div style="background:#fff;border-radius:8px;padding:8px 4px">'+
              (function(c){
                var wc=c>=85?"#fecaca":c>=75?"#fed7aa":c>=60?"#fef08a":"#1a3a6e";
                var tc=c>=60?"#7f1d1d":"#1a3a6e";
                return'<div style="font-size:22px;font-weight:bold;color:'+tc+';line-height:1;background:'+wc+';border-radius:6px;padding:4px 0">'+c+'</div>'+
                  (c>=85?'<div style="font-size:10px;color:#c62828;font-weight:bold;margin-top:2px">⚠ 要交代</div>':
                   c>=75?'<div style="font-size:10px;color:#e65100;font-weight:bold;margin-top:2px">注意</div>':
                   c>=60?'<div style="font-size:10px;color:#854d0e;margin-top:2px">要注意</div>':
                   '<div style="font-size:11px;color:#888;margin-top:3px">球数</div>');
              })(p.pitchCount||0)+
            '</div>'+
            '<div style="background:#fff;border-radius:8px;padding:8px 4px">'+
              '<div style="font-size:22px;font-weight:bold;color:#444;line-height:1">'+(p.battersFaced||0)+'</div>'+
              '<div style="font-size:11px;color:#888;margin-top:3px">打者数</div>'+
            '</div>'+
            '<div style="background:#fff;border-radius:8px;padding:8px 4px">'+
              '<div style="font-size:22px;font-weight:bold;line-height:1;color:'+(p.earnedRuns>0?"#c62828":"#444")+'">'+(p.earnedRuns||0)+'</div>'+
              '<div style="font-size:10px;color:#888;margin-top:3px">自責点</div>'+
              '<div style="font-size:10px;color:#999;line-height:1.3">守備ミスなしの<br>失点</div>'+
            '</div>'+
            '<div style="background:#fff;border-radius:8px;padding:8px 4px">'+
              '<div style="font-size:22px;font-weight:bold;color:#444;line-height:1">'+ip+'</div>'+
              '<div style="font-size:11px;color:#888;margin-top:3px">投球回</div>'+
            '</div>'+
          '</div>'+
        '</div>';
      });
    }

// 投手のイニング数を計算（表示用）
function calcPitcherInnings(side, pitcherIdx){
  var ps=S.pitchers[side]||[];
  var p=ps[pitcherIdx];
  if(!p)return"";
  var startInning=p.inningStart||0;
  var startOuts=p.inningStartOuts||0;
  var isCur=p.isCurrent;

  if(isCur){
    var curInnNum=S.curInning+1;
    return startInning+1+"回〜"+(curInnNum>startInning+1?curInnNum+"回":"現在");
  } else {
    var next=ps[pitcherIdx+1];
    if(next){
      return startInning+1+"回〜"+next.inningStart+"回";
    }
    return startInning+1+"回〜";
  }
}

// 投球回数を小数表記で計算（例: 2回1/3 → "2.1"）
// アウト合計 / 3 = 回数
function calcPitcherIP(side, pitcherIdx){
  var ps=S.pitchers[side]||[];
  var p=ps[pitcherIdx];
  if(!p)return"0.0";
  
  // 担当した打者からアウト数を概算
  // より正確にはatBatsのoutCountAfterを追跡する必要があるが
  // battersFaced と outs の差から推定
  var bf=p.battersFaced||0;
  if(bf===0)return"0.0";
  
  // 簡易計算: 自分が関わった合計アウト数
  // next pitcherの登板時のアウト状況との差を計算
  var totalOutsStart = (p.inningStart||0)*3 + (p.inningStartOuts||0);
  var totalOutsEnd;
  if(p.isCurrent){
    totalOutsEnd = S.curInning*3 + S.outs;
  } else {
    var next=ps[pitcherIdx+1];
    if(next){
      totalOutsEnd = (next.inningStart||0)*3 + (next.inningStartOuts||0);
    } else {
      totalOutsEnd = totalOutsStart + bf; // 近似
    }
  }
  var totalOuts = Math.max(0, totalOutsEnd - totalOutsStart);
  var innings = Math.floor(totalOuts/3);
  var remainOuts = totalOuts % 3;
  return innings + (remainOuts>0?"."+remainOuts:"");
}

function renderLog(){
  return'<div style="padding:10px 10px 8px">'+
    [["top",escH(S.awayTeam.name)],["bottom",escH(S.homeTeam.name)]].map(function(arr){
      var side=arr[0],tname=arr[1];
      var blocks=(S.game[side]||[]).map(function(inn,innIdx){
        if(!inn||(inn.atBats||[]).length===0&&(inn.events||[]).length===0&&(inn.changes||[]).length===0)return"";
        var changeRows=(inn.changes||[]).map(function(ch){
          return'<div style="background:#fff8e1;border-radius:7px;padding:5px 9px;margin-bottom:5px;font-size:11px;font-weight:bold;color:#5d4037">'+escH(ch.icon)+' '+escH(ch.label)+'：'+escH(ch.name||"")+(ch.num?" #"+escH(ch.num):"")+'</div>';
        }).join("");
        var abRows=(inn.atBats||[]).map(function(ab){
          var sym6=ab.sym||{sym:ab.result||"",color:"#888"};
          var dn4=buildDefNote(ab.defense||{});
          return'<div class="log-ab">'+
            '<span class="log-num">'+escH(ab.playerNum||"?")+'</span>'+
            '<span class="log-name">'+escH(ab.playerName||ab.order+"番")+'</span>'+
            '<div class="log-pitches">'+(ab.pitches||[]).map(function(p5){return pitchSvg(p5,13);}).join("")+'</div>'+
            '<div class="log-right">'+
              '<span class="result-badge" style="background:'+sym6.color+'">'+sym6.sym+'</span>'+
              (dn4?'<span class="defense-badge">'+dn4+'</span>':"")+
            '</div></div>';
        }).join("");
        var evtRows=(inn.events||[]).map(function(ev){
          return'<div style="font-size:10px;padding:2px 3px;display:flex;gap:5px;align-items:center">'+
            '<span class="event-badge">'+ev.label+'</span>'+(ev.scored?'<span style="color:#e53935;font-weight:bold">+'+ev.scored+'点</span>':"")+
          '</div>';
        }).join("");
        var hits=(inn.atBats||[]).filter(function(a){return["1H","2H","3H","HR","RH"].includes(a.result);}).length;
        return'<div class="log-inn">'+
          '<div class="log-inn-hdr"><span>'+(innIdx+1)+'回'+(side==="top"?"表":"裏")+'</span>'+
          '<span>得点<strong style="color:#e53935;font-size:13px;margin-left:3px">'+(inn.score||0)+'</strong>　安打<strong style="color:#1b7a3e;font-size:13px;margin-left:3px">'+hits+'</strong></span></div>'+
          changeRows+abRows+evtRows+'</div>';
      }).join("");
      var has=(S.game[side]||[]).some(function(i){return(i.atBats||[]).length>0||(i.events||[]).length>0||(i.changes||[]).length>0;});
      return'<div style="margin-bottom:13px"><div style="font-size:12px;font-weight:bold;color:#1a3a6e;margin-bottom:6px">'+tname+'（'+(side==="top"?"先攻":"後攻")+'）</div>'+
        (has?blocks:'<div style="color:#ccc;font-size:12px;text-align:center;padding:12px">記録なし</div>')+'</div>';
    }).join("")+'</div>';
}

// イベントバインド
// ============================================================
function on(id,ev,fn){var el=document.getElementById(id);if(el)el.addEventListener(ev,fn);}
function onAll(sel,ev,fn){document.querySelectorAll(sel).forEach(function(el){el.addEventListener(ev,fn);});}

function bindEvents(){
  try{
    // ── タップ連打防止ユーティリティ ──
    // iOS Safariのゴーストタップ防止: ボタン押下後300ms無効化
    function onceSafe(id, fn){
      var el=document.getElementById(id);
      if(!el)return;
      el.addEventListener("click",function handler(e){
        el.removeEventListener("click",handler);
        el.style.opacity="0.5";
        el.style.pointerEvents="none";
        fn(e);
      });
    }
    // 状況確認OKボタン（unlikelyだが押した場合の処理）
    on("situationProceedBtn","click",function(){
      if(!S.modal||S.modal.type!=="situation_confirm")return;
      var code_p=S.modal.code;
      var isRunner_p=S.modal.isRunner;
      var isWiz_p=S.modal.isWiz;
      S.modal=null;
      if(isRunner_p){
        runnerEvent(code_p);
      } else {
        if(isWiz_p)defWizStart(code_p);
        else startRunnerConfirmIfNeeded(code_p,buildSym({hitType:code_p}),{hitType:code_p});
      }
    });
    // 走者進塁確認ボタン（進んだ / 止まった）
    onAll(".rm-opt-btn","click",function(e){
      var btn=e.currentTarget;
      var base=Number(btn.dataset.base);
      var to=btn.dataset.to;
      rmSelectMove(base,to);
    });
    // 走者アウトボタン（アウトになった → 守備番号確認へ）
    onAll(".rm-out-btn","click",function(e){
      var btn=e.currentTarget;
      var base=Number(btn.dataset.base);
      var atBase=btn.dataset.atbase;
      if(!S.modal||S.modal.type!=="runner_move_confirm")return;
      S.modal.awaitingOutDetail={base:base,atBase:atBase};
      render();
    });
    // 守備番号選択（アウト確定）
    onAll(".rm-out-pos","click",function(e){
      var btn=e.currentTarget;
      var base=Number(btn.dataset.base);
      var atBase=btn.dataset.atbase;
      var defNum=btn.dataset.defnum?Number(btn.dataset.defnum):null;
      rmSelectOut(base, atBase, defNum);
    });
    // 守備番号確認をキャンセルして戻る
    on("rmCancelOutDetail","click",function(){
      if(!S.modal||S.modal.type!=="runner_move_confirm")return;
      S.modal.awaitingOutDetail=null;
      render();
    });
    // 前の走者の選択に戻る
    on("rmBackBtn","click",function(){
      if(!S.modal||S.modal.type!=="runner_move_confirm")return;
      var rm=S.modal;
      rm.awaitingOutDetail=null;
      // 1つ前の確認済み走者を見つけてやり直し
      var runners=rm.runners||[];
      var curIdx=rm.currentIdx||0;
      var prevIdx=curIdx-1;
      if(prevIdx>=0){
        // その走者のconfirmedをリセット
        var prevBase=runners[prevIdx];
        if(rm.moves[prevBase]){
          rm.moves[prevBase].confirmed=false;
          rm.moves[prevBase].auto=false;
          if(rm.moves[prevBase].to==="OUT"){
            // アウト選択を取り消す→extraOutsを減らす
            rm.extraOuts=Math.max(0,(rm.extraOuts||0)-1);
            rm.moves[prevBase].to=String(prevBase);
            rm.moves[prevBase].reason="stay";
          }
        }
        rm.currentIdx=prevIdx;
        render();
      }
    });
    // 残りを自動処理（デフォルト推定で記録）
    on("rmAutoAll","click",function(){
      if(!S.modal||S.modal.type!=="runner_move_confirm")return;
      var rm=S.modal;
      rm.awaitingOutDetail=null;
      // 未確認の走者に対してデフォルト値を適用
      var runners=rm.runners||[];
      for(var i=rm.currentIdx;i<runners.length;i++){
        var b=runners[i];
        if(!rm.moves[b]||!rm.moves[b].confirmed){
          var mv=rm.moves[b]||{to:b===0?"1":String(b)};
          rm.moves[b]=Object.assign({},mv,{confirmed:true,auto:true});
        }
      }
      S.modal=null;

    // メタ情報入力
    (function(){
      var metaFields={metaDate:"date",metaTournament:"tournament",metaVenue:"venue",metaWeather:"weather"};
      Object.keys(metaFields).forEach(function(id){
        var el=document.getElementById(id);
        if(!el)return;

    // 試合開始
    // チュートリアルボタン
    on("tutSkip","click",function(){ startGame(); render(); });

      else render();

    on("tutFinish","click",function(){ startGame(); render(); });
    on("startBtn","click",function(){
      // メタ情報を最終確定
      if(!S.meta)S.meta={};
      ["metaDate","metaTournament","metaVenue","metaWeather"].forEach(function(id){

    // データリセット
    on("resetDataBtn","click",function(){

    // ハプティクス共通ヘルパー

          message:getUnavailableMessage(rc)};
        render();return;
      }
      if(isWiz)defWizStart(rc);
      else startRunnerConfirmIfNeeded(rc,buildSym({hitType:rc}),{hitType:rc});

      hap(10);
      var key=e.currentTarget.dataset.wizEditSec;
      var sel=S.modal.wiz.sel;

      var downstream={

    onAll("[data-wiz-outcome]","click",function(e){

      if(!S.modal)return;
      var code3=S.modal.eventCode;
      var autoBases=el&&el.dataset&&el.dataset.autoBases;
      if(autoBases){
        var bases3=autoBases.split(",").map(Number).filter(function(n){return n>0;});

        if(destBtns.length>0){

            var base=Number(btn.dataset.base);
            var to=btn.dataset.to;
            if(to!=="stay") moveMap[base]=to;
          });
          var movingBases=Object.keys(moveMap).map(Number);
          // 全て1つ進みかどうか確認
          var simpleMove=movingBases.every(function(b){
            return (b<3&&moveMap[b]===String(b+1))||(b===3&&moveMap[b]==="H");
          });
          if(simpleMove){
            applyRunnerEvent(code3,movingBases);

            applyRunnerEventAdvanced(code3,moveMap);

          var checked=Array.from(document.querySelectorAll("#runnerCBs input:checked")).map(function(c2){return Number(c2.value);});

      S.routDefNum=Number(e.currentTarget.dataset.routDef);render();
    });
    onAll("[data-rout-base]","click",function(e){
      if(!S.modal)return;
      applyRunnerOut(S.modal.eventCode,Number(e.currentTarget.dataset.routBase),S.routDefNum);
    });
    // 得点追加
    onAll("[data-score]","click",function(e){
      var inn3=curInn();if(inn3)inn3.score=(inn3.score||0)+Number(e.currentTarget.dataset.score);
      S.modal=null;render();
    });
    // スコアボード
    onAll(".sbd-btn","click",function(e){
      var el=e.currentTarget;addScore(el.dataset.side,Number(el.dataset.inning),Number(el.dataset.d));
    });
    onAll("[data-sbfilter]","click",function(e){S.sbFilter=e.currentTarget.dataset.sbfilter;render();});
    // 交代
    onAll("[data-change]","click",function(e){S.modal={type:"change_input",changeType:e.currentTarget.dataset.change};render();});
    on("changeConfirmBtn","click",function(){
      var nm=(document.getElementById("changeName")||{}).value||"";
      var nu=(document.getElementById("changeNum")||{}).value||"";
      if(S.modal)recordChange(S.modal.changeType,nm,nu);
    });
    // フッターボタン
    // フッターダイヤモンド（走者位置修正）
    on("footerDiamondBtn","click",function(){
      S.modal={type:"runner_position_fix"};render();
    });
    // 走者移動ボタン
    onAll(".runner-fix-btn","click",function(e){
      var from=Number(e.currentTarget.dataset.from);
      var to=e.currentTarget.dataset.to;
      if(to==="del"){
        S.curBases=S.curBases.filter(function(b){return b!==from;});
        if(S.runnerInfo)delete S.runnerInfo[from];
      } else {
        var toNum=Number(to);
        S.curBases=S.curBases.filter(function(b){return b!==from;});
        if(!S.curBases.includes(toNum)){
          S.curBases.push(toNum);
          S.curBases.sort();
          if(S.runnerInfo){
            S.runnerInfo[toNum]=S.runnerInfo[from]||{earned:true};
            delete S.runnerInfo[from];
          }
        }
      }
      S.modal={type:"runner_position_fix"};render();
    });
    // 走者追加ボタン
    onAll(".runner-add-btn","click",function(e){
      var base=Number(e.currentTarget.dataset.base);
      if(!S.curBases.includes(base)){
        S.curBases.push(base);
        S.curBases.sort();
        if(!S.runnerInfo)S.runnerInfo={};
        S.runnerInfo[base]={earned:true};
      }
      S.modal={type:"runner_position_fix"};render();
    });
    // アウト数修正ボタン
    onAll(".outs-fix-btn","click",function(e){
      S.outs=Number(e.currentTarget.dataset.outs);
      S.modal={type:"runner_position_fix"};render();
    });
    on("memberEditBtn","click",function(){S.modal={type:"member_edit",editSide:S.curSide==="top"?"away":"home"};render();});
    on("changePitcherBtn","click",function(){
      S.modal={type:"change_input",changeType:"pitcher"};render();
    });
    on("pitcherHelpBtn","click",function(){
      S.modal={type:"pitcher_help"};render();
    });
    on("swapSidesBtn","click",function(){S.modal={type:"swap_sides"};render();});
    on("toSetupBtn","click",function(){S.page="setup";render();});
    on("copyScoreBtn","click",function(){
      try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
      var lines=[];
      lines.push("【"+S.awayTeam.name+" vs "+S.homeTeam.name+"】");
      var innNums=Array.from({length:MAX_INNINGS},function(_,i){return i+1;});
      lines.push("      "+innNums.map(function(n){return n<10?" "+n:n;}).join(" ")+"  計");
      ["top","bottom"].forEach(function(side){
        var name=(side==="top"?S.awayTeam.name:S.homeTeam.name).slice(0,4);
        var scores=innNums.map(function(_,i){var sc=(S.game[side][i]&&S.game[side][i].score)||0;return sc<10?" "+sc:sc;});
        lines.push(name.padEnd(4)+" "+scores.join(" ")+" "+totalScore(side));
      });
      var txt=lines.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){alert("コピーしました！");}).catch(function(){prompt("コピーしてください",txt);});
      } else {prompt("コピーしてください",txt);}
    });
    // スコアボード延長ボタン
    on("sbExpandBtn","click",function(){
      var cur=S.sbExpandedInnings||S.maxInnings||5;
      if(cur<MAX_INNINGS){S.sbExpandedInnings=cur+1;render();}
    });
    on("sbShrinkBtn","click",function(){
      var base=S.maxInnings||5;
      var played=Math.max(S.curInning+1,(S.game.top||[]).length,(S.game.bottom||[]).length);
      var min=Math.max(base,played);
      var cur=S.sbExpandedInnings||min;
      if(cur>min){S.sbExpandedInnings=cur-1;render();}
    });
    // 試合終了ボタン
    on("endGameBtn","click",function(){
      if(confirm("試合を終了しますか？\nスコアボードの記録はそのまま残ります。")){
        S.gameEnded=true;
        var awayS=totalScore("top"),homeS=totalScore("bottom");
        S.gameResult=awayS>homeS?"win":homeS>awayS?"lose":"draw";
        saveGameToSeason();
        render();
      }
    });
    on("reopenGameBtn","click",function(){
      S.gameEnded=false;S.gameResult=null;render();
    });
    on("seasonHistoryBtn","click",function(){
      S.modal={type:"season_history"};render();
    });
    on("shClearAllBtn","click",function(){
      if(confirm("試合履歴をすべて削除しますか？")){
        localStorage.removeItem(SEASON_KEY);
        S.modal={type:"season_history"};render();
      }
    });
    onAll(".sh-delete-btn","click",function(e){
      var idx=parseInt(e.currentTarget.dataset.shidx,10);
      var list_d=[];
      try{ list_d=JSON.parse(localStorage.getItem(SEASON_KEY)||"[]")||[]; }catch(e2){ list_d=[]; }
      if(!Array.isArray(list_d)) list_d=[];
      list_d.splice(idx,1);
      localStorage.setItem(SEASON_KEY, JSON.stringify(list_d));
      S.modal={type:"season_history"};render();
    });
    // メンバー編集内チーム切替
    onAll("[data-edit-side]","click",function(e){
      if(S.modal&&S.modal.type==="member_edit"){S.modal.editSide=e.currentTarget.dataset.editSide;render();}
    });
    on("confirmSwap","click",function(){
      var tmp=S.awayTeam;S.awayTeam=S.homeTeam;S.homeTeam=tmp;
      var tmpG=S.game.top;S.game.top=S.game.bottom;S.game.bottom=tmpG;
      S.curSide=S.curSide==="top"?"bottom":"top";
      S.modal=null;render();
    });
    // モーダル共通閉じる
    on("closeModalBtn","click",closeModal);
    on("modalCancel","click",closeModal);
    // ── ヒット統合モーダル: 塁数選択 ──
    onAll("[data-hc-type]","click",function(e){
      hap(15);
      if(!S.modal||S.modal.type!=="hit_combo")return;
      S.modal.hitType=e.currentTarget.dataset.hcType;
      render();
    });
    // ── ヒット統合モーダル: 守備方向選択 → 即記録 ──
    onAll("[data-hc-fielder]","click",function(e){
      hap(15);
      if(!S.modal||S.modal.type!=="hit_combo")return;
      var ht=S.modal.hitType||"1H";
      var fielder=Number(e.currentTarget.dataset.hcFielder);
      recordHitCombo(ht,fielder);
    });
    // ── ヒット統合モーダル: 方向なしスキップ ──
    on("hcSkipBtn","click",function(){
      hap(15);
      if(!S.modal||S.modal.type!=="hit_combo")return;
      var ht=S.modal.hitType||"1H";
      recordHitCombo(ht,null);
    });
    var mo=document.getElementById("modalOverlay");
    if(mo)mo.addEventListener("click",function(e){
      if(e.target!==mo)return;
      var type=S.modal&&S.modal.type;
      // 走者確認は誤タップで閉じないよう除外
      if(type==="runner_move_confirm")return;
      closeModal();
    });
  }catch(e){console.error("bindEvents error:",e);}
}

// ============================================================
// 走者進塁確認モーダルのボタン処理
// ============================================================
// 走者が「進んだ / 止まった」を選択
function rmSelectMove(base, to){
  if(!S.modal||S.modal.type!=="runner_move_confirm")return;
  var rm=S.modal;
  rm.awaitingOutDetail=null;
  rm.moves[base]={to:to, reason:"user", auto:false, confirmed:true};

  // 自動連動: 2塁走者がHを選んだら3塁走者も自動でH
  // (前の走者がホームに帰るなら、より進んでいた走者も当然帰る)
  if(to==="H" && base!==0){
    var runners=rm.runners||[];
    runners.forEach(function(b){
      if(b!==base && b!==0 && b>base){
        // より塁が進んでいる走者も自動でH
        if(!rm.moves[b]||!rm.moves[b].confirmed){
          rm.moves[b]={to:"H", reason:"auto_cascade", auto:true, confirmed:true,
            hint:"前の走者がホームインしたため自動でホームイン"};
        }
      }
    });
  }

  rmAdvanceToNext(rm, base);
}

// 走者が「アウトになった」を選択（守備番号確認へ）
function rmSelectOut(base, atBase, defNum){
  if(!S.modal||S.modal.type!=="runner_move_confirm")return;
  var rm=S.modal;
  rm.awaitingOutDetail=null;
  rm.moves[base]={
    to:"OUT",
    atBase:atBase,
    defNum:defNum||null,
    reason:"out",
    auto:false,
    confirmed:true
  };
  if(!rm.extraOuts)rm.extraOuts=0;
  rm.extraOuts++;
  rmAdvanceToNext(rm, base);
}

// 次の走者へ進む（共通）
function rmAdvanceToNext(rm, doneBase){
  var runners=rm.runners||[];
  var doneIdx=runners.indexOf(doneBase);
  var nextIdx=null;
  for(var i=doneIdx+1;i<runners.length;i++){
    var b=runners[i];
    var mv=rm.moves[b]||{auto:false};
    if(!mv.auto||mv.askNeeded){nextIdx=i;break;}
  }
  if(nextIdx!==null){
    rm.currentIdx=nextIdx;
    render();
  } else {
    // 全走者確認完了
    S.modal=null;
    commitAtBatWithRunnerMoves(rm.rc, rm.sym, rm.sel, rm.moves, rm.extraOuts||0);
  }
}

// 走者の確定した移動先を元にcommitAtBatを呼ぶ
function commitAtBatWithRunnerMoves(rc, sym, sel, moves, extraOuts){
  var selWithMoves = Object.assign({}, sel, {runnerMoves: moves, extraOuts: extraOuts||0});
  commitAtBat(rc, sym, selWithMoves);
}

// 走者が2つ以上進む場合の走者イベント処理
function applyRunnerEventAdvanced(code, moveMap){
  var nb=S.curBases.slice();
  var ri=JSON.parse(JSON.stringify(S.runnerInfo||{}));
  var scored=0, earnedScored=0;
  var bases=Object.keys(moveMap).map(Number).sort(function(a,b){return b-a;});
  bases.forEach(function(from){
    var to=moveMap[from];
    var toNum=to==="H"?4:Number(to);
    var idx=nb.indexOf(from);
    if(idx===-1)return;
    nb.splice(idx,1);
    if(toNum>3){
      scored++;
      if(ri[from]&&ri[from].earned) earnedScored++;
      delete ri[from];
    } else {
      ri[toNum]=ri[from]||{earned:true};
      delete ri[from];
      nb.push(toNum);
    }
  });
  nb=nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
  var lbl=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
  var inn=curInn();
  inn.events.push({type:code,label:lbl,scored:scored});
  inn.score=(inn.score||0)+scored;
  inn.earnedRuns=(inn.earnedRuns||0)+earnedScored;
  S.curBases=nb; S.runnerInfo=ri;
  S.modal=null;
  render();
}

// ============================================================
// 初期化
// ============================================================
window.addEventListener('DOMContentLoaded', function(){
  initState();
  loadFromStorage();
  render();
});
