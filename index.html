






<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>少年野球スコアボード補助アプリ</title>
<meta name="description" content="少年野球のスコア記録をスマホで補助するアプリです。">

<meta property="og:title" content="少年野球スコアボード補助アプリ">
<meta property="og:description" content="少年野球のスコア記録をスマホで補助するアプリです。">
<meta property="og:image" content="https://deg216217-dot.github.io/baseball-score/ogp.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deg216217-dot.github.io/baseball-score/">
<meta property="og:site_name" content="少年野球スコアボード補助アプリ">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  /* ── 役割別カラー（6色に絞る）── */
  --navy:#0f1f3d;--navy2:#1a3a6e;
  --c-out:#455a64;        /* アウト系 - より濃いブルーグレー（白文字コントラスト確保） */
  --c-hit:#2e7d32;        /* ヒット系 - 緑 */
  --c-reach:#0277bd;      /* 出塁系  - 青 */
  --c-runner:#37474f;     /* 走者系  - 暗グレー */
  --c-danger:#e65100;     /* 取消・警告 - オレンジ */
  --c-change:#455a64;     /* チェンジ  - スレートグレー */
  /* ── 維持 ── */
  --red:#e53935;--green:#1b7a3e;--bg:#f4f6f9;--white:#fff;--gray:#555;
}
html,body{height:100%;font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation;}
#app{height:100vh;height:100dvh;min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative;}
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}

/* ===フッター 表=青 裏=赤=== */
.bottom-bar{flex-shrink:0;color:#fff;padding:5px 10px 6px;box-shadow:0 -3px 16px rgba(0,0,0,.3);transition:background .5s;}
.bottom-bar.top-side{background:linear-gradient(to top,#0a1628,#1a3a6e);}
.bottom-bar.bottom-side{background:linear-gradient(to top,#1a0a0a,#7b1a2a);}

/* フッター上段：打者情報＋ダイヤモンド＋スコア＋カウント */
.footer-main{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
/* 左：イニング＋アウト */
.footer-inn{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:38px;}
.inning-half-tag{font-size:13px;font-weight:900;padding:1px 5px;border-radius:20px;white-space:nowrap;}
.top-side .inning-half-tag{background:#ff8a80;color:#1a3a6e;}
.bottom-side .inning-half-tag{background:#ffb3ba;color:#7b1a2a;}
.inning-num{font-size:16px;font-weight:900;line-height:1;}
.out-area{display:flex;align-items:center;gap:2px;}
.out-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);}
.out-dot.on{background:#ff5252;}.out-dot.off{background:rgba(255,255,255,.18);}
/* 中左：打者＋ダイヤモンド */
.footer-batter{flex:1;min-width:0;display:flex;align-items:center;gap:5px;}
.footer-batter-info{flex:1;min-width:0;}
.footer-batter-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.footer-batter-sub{font-size:11px;opacity:.7;white-space:nowrap;}
.footer-pitch-seq{display:flex;flex-wrap:nowrap;gap:2px;margin-top:2px;overflow:hidden;max-width:80px;}
/* 中右：スコア */
.footer-score{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.footer-score-team{text-align:center;}
.footer-score-name{font-size:10px;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.footer-score-num{font-size:24px;font-weight:900;line-height:1;}
.footer-score-num.away{color:#ff8a80;}.footer-score-num.home{color:#80d8ff;}
.footer-score-sep{font-size:13px;opacity:.75;}
.footer-score-team.batting .footer-score-name{opacity:1;}
.footer-score-team.batting .footer-score-num{text-shadow:0 0 8px rgba(255,255,255,.4);}
/* カウントドット */
.footer-count{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.count-row{display:flex;align-items:center;gap:2px;}
.count-label{font-size:11px;color:rgba(255,255,255,.6);width:8px;}
.cdot{width:8px;height:8px;border-radius:50%;}
.cdot-B.on{background:#ffeb3b;}.cdot-B.off{background:rgba(255,255,255,.15);}
.cdot-S.on{background:#ff8a80;}.cdot-S.off{background:rgba(255,255,255,.15);}
/* ユーティリティボタン行 */
.bb-utils{display:flex;gap:4px;margin-bottom:3px;}
.bb-util-btn{flex:1;border:none;border-radius:7px;padding:5px 3px;font-size:11px;font-weight:bold;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bb-util-btn:active{background:rgba(255,255,255,.28);}
/* タブ */
.tabs{display:flex;border-top:1px solid rgba(255,255,255,.1);}
.tab-btn{flex:1;padding:7px 0;border:none;background:none;color:#fff;cursor:pointer;font-size:13px;font-weight:bold;opacity:.8;border-top:2px solid transparent;transition:all .15s;}
.tab-btn.active{opacity:1;border-top:2px solid #ff8a80;}

/* ===チェンジ演出=== */
.change-overlay{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:changeAnim 1.6s ease forwards;pointer-events:none;}
@keyframes changeAnim{0%{opacity:0;transform:scale(.85);}15%{opacity:1;transform:scale(1.05);}70%{opacity:1;}100%{opacity:0;transform:scale(1.1);}}
.change-overlay.to-top{background:linear-gradient(135deg,rgba(10,22,40,.9),rgba(26,58,110,.9));}
.change-overlay.to-bottom{background:linear-gradient(135deg,rgba(26,10,10,.9),rgba(123,26,42,.9));}
.change-big{font-size:52px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5);}
.change-sub{font-size:16px;margin-top:8px;color:rgba(255,255,255,.9);font-weight:bold;}
.change-inn{font-size:13px;margin-top:4px;color:rgba(255,255,255,.65);}

/* ===カード=== */
.card{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:5px;}
.card-label{font-size:13px;color:#555;font-weight:bold;margin-bottom:6px;letter-spacing:0;display:flex;align-items:center;gap:5px;}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--navy2);color:#fff;font-size:11px;font-weight:900;flex-shrink:0;}
/* 走者エリア：走者なし時にdimmed */
.runner-section.no-runners .runner-grid{opacity:.38;pointer-events:none;}
.runner-section.no-runners .section-label{opacity:.5;}
.runner-section.no-runners::after{content:"走者がいるときに使用";display:block;font-size:9px;color:#bbb;text-align:center;margin-top:3px;}

/* ===打者カード（フッター内に移動、旧カードは廃止）=== */
.pitch-seq-inline{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;}
.auto-banner{border-radius:9px;padding:9px 12px;font-size:14px;font-weight:bold;display:flex;align-items:center;gap:7px;animation:pop .3s ease;margin-bottom:5px;}
@keyframes pop{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.auto-banner.bb{background:#e3f2fd;color:#0d47a1;border:1.5px solid #1565c0;}
.auto-banner.k{background:#ffebee;color:#b71c1c;border:1.5px solid #c62828;}

/* ===投球ボタン=== */
.pitch-row{display:flex;align-items:center;gap:4px;}
.pitch-grid{display:flex;gap:4px;flex:1;}
.btn{border:none;border-radius:9px;padding:4px 0 5px;height:54px;font-size:17px;font-weight:900;cursor:pointer;
transition:transform .08s,opacity .08s;flex:1;min-width:0;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.btn-sub{font-size:12px;font-weight:bold;opacity:.88;line-height:1;letter-spacing:0;}
.btn:active{transform:scale(.94);opacity:.85;}
.btn.disabled{opacity:.5;pointer-events:none;cursor:not-allowed;}
.btn-ball{background:var(--navy);color:#fff;}
.btn-smiss{background:#e8edf5;color:#0f1f3d;font-weight:900;}
.btn-swing{background:#fde8e8;color:#b00;}
.btn-foul{background:#f5e6d0;color:#6b3300;}
.btn-hbp{background:#f0e090;color:#4a3200;}
.btn-del{background:#ededf0;color:#444;flex:0 0 44px;font-size:16px;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:52px;}
/* ヘルプボタン */
.help-btn{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);
background:#fff;color:#888;font-size:12px;font-weight:900;cursor:pointer;
display:flex;align-items:center;justify-content:center;line-height:1;}
.help-btn:active{background:#f0f0f0;}

/* ===打席結果タブ=== */
.result-card{background:#fff;border-radius:10px;margin-bottom:5px;overflow:hidden;}
.result-tabs{display:flex;background:#eef0f3;position:relative;}
/* 非アクティブ: 役割の色味をtintで表示 */
.result-tab{flex:1;padding:9px 2px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:bold;color:#888;border-bottom:3px solid transparent;letter-spacing:0;transition:all .15s;}
.result-tab[data-rtab="out"]   {color:#78909c;}
.result-tab[data-rtab="hit"]   {color:#388e3c;}
.result-tab[data-rtab="reach"] {color:#1565c0;}
.result-tab[data-rtab="special"]{color:#6a35a0;}
/* アクティブ: 強調 + 白背景 */
.result-tab.active-out{
color:#fff;background:var(--c-out);border-bottom:3px solid var(--c-out);
border-radius:6px 6px 0 0;}
.result-tab.active-hit{
color:#fff;background:var(--c-hit);border-bottom:3px solid var(--c-hit);
border-radius:6px 6px 0 0;}
.result-tab.active-reach{
color:#fff;background:var(--c-reach);border-bottom:3px solid var(--c-reach);
border-radius:6px 6px 0 0;}
.result-tab.active-special{
color:#fff;background:#5c35a0;border-bottom:3px solid #5c35a0;
border-radius:6px 6px 0 0;}
/* 結果エリアの左ボーダーでもカテゴリを表現 */
.result-body{padding:5px 6px 7px;border-top:3px solid #eef0f3;transition:border-color .15s;}
.result-body.tab-out   {border-top-color:var(--c-out);}
.result-body.tab-hit   {border-top-color:var(--c-hit);}
.result-body.tab-reach {border-top-color:var(--c-reach);}
.result-body.tab-special{border-top-color:#5c35a0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
/* ②3列グリッド（高さ削減版） */
.result-grid-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
/* ③4列グリッド */
.runner-grid-4col{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.rbtn{
border:none;border-radius:8px;
padding:6px 3px;
min-height:52px;
max-height:52px;
font-weight:bold;cursor:pointer;color:#fff;
transition:transform .08s,opacity .1s;
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2px;width:100%;text-align:center;
overflow:hidden;
}
.rbtn:active{transform:scale(.95);opacity:.85;}
.rbtn-main{font-size:15px;font-weight:bold;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.rbtn-sub{font-size:11px;opacity:.9;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;}
/* 状況的に起こり得ないボタン */
/* impossible: 完全グレーアウト・タップ不可 */
.rbtn.unavailable{opacity:.35;cursor:not-allowed;pointer-events:none;}
.rbtn.unavailable:active{transform:none;}
.runner-btn.unavailable{opacity:.35;cursor:not-allowed;pointer-events:none;}
.runner-btn.unavailable:active{transform:none;}
/* unlikely: 半透明・タップ可（確認ダイアログあり） */
.rbtn.unlikely{opacity:.7;cursor:pointer;}
.rbtn.unlikely:active{transform:scale(.93);}
.runner-btn.unlikely{opacity:.7;cursor:pointer;}
.runner-btn.unlikely:active{transform:scale(.93);}

/* ===走者イベント=== */
.runner-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:1px;}
.runner-btn{
border:none;border-radius:8px;
padding:5px 2px;
min-height:48px;
max-height:48px;
font-weight:bold;cursor:pointer;color:#fff;
transition:transform .08s,opacity .1s;
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2px;width:100%;text-align:center;
overflow:hidden;
}
.runner-btn:active{transform:scale(.95);opacity:.85;}
.rlabel{font-size:13px;font-weight:bold;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.rsub{font-size:11px;opacity:.9;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;}
.runner-btn:active{transform:scale(.93);}

/* ===取り消しボタン=== */
.undo-btn{width:100%;background:#fff;color:var(--c-danger);border:2px solid var(--c-danger);border-radius:9px;padding:10px;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.undo-btn:disabled{background:#f8f8f8;color:#ccc;border-color:#e0e0e0;cursor:default;}
.undo-btn:not(:disabled):active{background:#fff3e0;}

/* ===モーダル=== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px 16px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;}
.modal-title{font-size:18px;font-weight:bold;margin-bottom:4px;color:var(--navy2);}
.modal-sub{font-size:13px;color:var(--gray);margin-bottom:11px;line-height:1.5;}
.modal-cancel{width:100%;background:#f0f0f0;color:#333;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:6px;}
.step-label{font-size:10px;color:#bbb;font-weight:bold;letter-spacing:.5px;margin-bottom:3px;}
.step-q{font-size:16px;font-weight:bold;color:#1a3a6e;margin-bottom:10px;line-height:1.4;}
.hint{font-size:13px;color:#666;background:#f8f9fa;border-radius:6px;padding:7px 9px;margin-bottom:8px;line-height:1.5;}
.sym-preview{background:#1a3a6e;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:9px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.18);}
.sym-preview .sym{font-size:20px;font-weight:900;font-family:monospace;}
.sym-preview .desc{font-size:11px;opacity:.8;flex:1;}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.pos-btn{border:none;border-radius:9px;padding:10px 4px;cursor:pointer;transition:transform .07s,opacity .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;}
.pos-btn:active{transform:scale(.92);}
.pn{font-size:20px;font-weight:900;}
.pos-btn .pp{font-size:11px;display:block;margin-top:1px;opacity:.9;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.choice-btn{border:none;border-radius:10px;padding:15px 10px;font-size:15px;font-weight:bold;cursor:pointer;transition:transform .07s;text-align:center;line-height:1.3;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.choice-btn:active{transform:scale(.93);}
.choice-btn.danger {background:#c62828; color:#fff;}   /* 赤 */
.choice-btn.success{background:#2e7d32; color:#fff;}   /* 緑 */
.choice-btn.warning{background:#d84315; color:#fff;}   /* 濃いオレンジ（amber→より暗く） */
.choice-btn.gray   {background:#546e7a; color:#fff;}   /* ブルーグレー */
.choice-btn.light  {background:#fff;    color:#1a3a6e; border:2px solid #1a3a6e;} /* 白×紺 */
.choice-btn.primary{background:#1a3a6e; color:#fff;}   /* 紺 */
.back-btn{background:#f5f5f5;border:1px solid #e0e0e0;color:#444;font-size:13px;cursor:pointer;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:4px;border-radius:8px;font-weight:bold;width:100%;}
.confirm-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:4px;}

/* スコアブックプレビュー */
.sb-modal .sb-diamond-wrap{display:flex;justify-content:center;background:#f8fffe;border-radius:11px;padding:8px;}
.write-guide{background:#fffde7;border-radius:9px;padding:9px 11px;margin-bottom:12px;border-left:3px solid #f9a825;}
.write-guide-title{font-size:13px;color:#e65100;font-weight:bold;margin-bottom:5px;}
.write-guide-body{font-size:13px;color:#333;line-height:1.8;}

/* ===スコアボード=== */
.sbd-table{width:100%;border-collapse:collapse;font-size:11px;}
.sbd-table th{padding:6px 2px;text-align:center;background:var(--navy2);color:#fff;font-size:10px;}
.sbd-table th.team-th{text-align:left;padding-left:7px;min-width:62px;}
.sbd-table th.cur-inn{background:var(--red);}
.sbd-table th.total-th{background:#0d2044;}
.sbd-table td{padding:4px 2px;text-align:center;border-bottom:1px solid #f0f0f0;}
.sbd-table td.team-td{padding:4px 7px;text-align:left;}
.sbd-table td.total-td{font-size:17px;font-weight:900;background:#f8f9fa;}
.sbd-score{font-weight:bold;font-size:13px;margin-bottom:1px;}
.sbd-btns{display:flex;justify-content:center;gap:1px;}
.sbd-btn{border:none;border-radius:3px;width:14px;height:14px;cursor:pointer;font-size:11px;padding:0;line-height:14px;font-weight:bold;}
.sbd-btn.plus{background:#e8f5e9;color:#2e7d32;}.sbd-btn.minus{background:#fce4ec;color:#c62828;}
.sbd-cur{background:#fff9c4 !important;}

/* ===スコアブックタブ=== */
.sb-filter{display:flex;gap:5px;margin-bottom:9px;overflow-x:auto;padding-bottom:2px;}
.sb-filter-btn{border:none;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap;}
.sb-filter-btn.active{background:var(--navy2);color:#fff;}
.sb-filter-btn:not(.active){background:#e8ecf2;color:#555;}
.sb-inn-group{margin-bottom:13px;}
.sb-inn-label{font-size:13px;font-weight:bold;color:var(--navy2);margin-bottom:7px;padding:3px 8px;background:#e8edf5;border-radius:6px;display:inline-block;}
.sb-ab-list{display:flex;flex-wrap:wrap;gap:7px;}
.waseda-card{background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 5px rgba(0,0,0,.1);width:calc(50% - 4px);min-width:136px;cursor:pointer;}
.waseda-card:active{opacity:.8;}
.change-card{background:#fff8e1;border:1.5px solid #ffcc02;border-radius:10px;padding:7px 10px;width:100%;margin-bottom:4px;font-size:11px;color:#5d4037;font-weight:bold;}
.waseda-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.waseda-order{background:var(--navy2);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0;}
.waseda-player{font-size:11px;font-weight:bold;color:#333;margin-left:4px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.waseda-sym{font-size:11px;font-weight:900;font-family:monospace;}
.waseda-pitches{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;justify-content:center;}

/* ===記録タブ=== */
.log-inn{background:#fff;border-radius:11px;padding:9px;margin-bottom:7px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.log-inn-hdr{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);font-weight:bold;margin-bottom:7px;}
.log-ab{display:flex;align-items:center;gap:5px;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid #f5f5f5;}
.log-ab:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.log-num{background:var(--navy2);color:#fff;border-radius:50%;min-width:21px;height:21px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;}
.log-name{font-size:13px;font-weight:bold;min-width:42px;}
.log-pitches{display:flex;gap:2px;flex:1;flex-wrap:wrap;}
.log-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.result-badge{border-radius:5px;padding:2px 6px;font-size:10px;font-weight:bold;color:#fff;white-space:nowrap;font-family:monospace;}
.defense-badge{border-radius:4px;padding:2px 5px;font-size:11px;font-weight:bold;background:#e3f2fd;color:#0d47a1;white-space:nowrap;}
.event-badge{border-radius:4px;padding:2px 5px;font-size:11px;font-weight:bold;background:var(--purple);color:#fff;}

/* ===セットアップ=== */
.setup-page{height:100dvh;display:flex;flex-direction:column;background:var(--bg);}
.setup-hdr{background:var(--navy);padding:14px 14px 0;color:#fff;flex-shrink:0;}
.setup-title{font-size:18px;font-weight:bold;text-align:center;margin-bottom:10px;}
.team-toggle{display:flex;border-radius:10px;overflow:hidden;border:1px solid #334;}
.ttbtn{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:13px;font-weight:bold;color:#fff;background:transparent;transition:background .2s;}
.ttbtn.away.active{background:var(--red);}.ttbtn.home.active{background:#1565c0;}
.setup-body{flex:1;background:var(--bg);border-radius:16px 16px 0 0;margin-top:10px;padding:12px;overflow-y:auto;}
.team-name-input{width:100%;font-size:15px;font-weight:bold;border:2px solid var(--navy2);border-radius:9px;padding:8px 12px;margin-bottom:10px;background:#fff;outline:none;}
.player-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#fff;border-radius:9px;padding:7px 9px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.order-badge{background:var(--navy2);color:#fff;border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;}
.num-input{width:40px;border:1px solid #ddd;border-radius:7px;padding:5px 3px;font-size:15px;text-align:center;outline:none;}
.name-input{flex:1;border:1px solid #ddd;border-radius:7px;padding:5px 7px;font-size:15px;outline:none;}
.pos-select{border:1px solid #ddd;border-radius:7px;padding:5px 3px;font-size:14px;background:#fff;outline:none;}
.start-btn{width:100%;background:linear-gradient(135deg,var(--navy2),var(--red));color:#fff;border:none;border-radius:13px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;}
.setup-footer{background:var(--bg);padding:10px 12px 26px;flex-shrink:0;}
.modal-text-input{width:100%;border:2px solid #ddd;border-radius:9px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;margin-bottom:6px;}
.modal-text-input:focus{border-color:var(--navy2);}

/* ===チュートリアル=== */
.tut-page{height:100dvh;display:flex;flex-direction:column;background:var(--navy);overflow:hidden;}
.tut-hdr{padding:14px 16px 10px;color:#fff;flex-shrink:0;}
.tut-title{font-size:17px;font-weight:bold;margin-bottom:3px;}
.tut-sub{font-size:11px;opacity:.7;margin-bottom:10px;}
.tut-steps{display:flex;gap:6px;margin-bottom:4px;}
.tut-step-dot{height:4px;border-radius:2px;flex:1;background:rgba(255,255,255,.2);transition:background .3s;}
.tut-step-dot.active{background:#ff8a80;}
.tut-body{flex:1;overflow-y:auto;padding:0 14px 14px;}
.tut-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.tut-card-top{padding:12px 14px 0;}
.tut-label{font-size:10px;font-weight:bold;color:#aaa;letter-spacing:.5px;margin-bottom:4px;}
.tut-situation{font-size:14px;font-weight:bold;color:var(--navy2);margin-bottom:10px;line-height:1.4;}
.tut-diamond-row{display:flex;align-items:flex-start;gap:12px;padding:0 14px 12px;}
.tut-diamond-wrap{background:#f0f8f0;border-radius:10px;padding:8px;flex-shrink:0;}
.tut-explanation{flex:1;}
.tut-sym-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.tut-sym{font-size:20px;font-weight:900;font-family:monospace;padding:3px 10px;border-radius:7px;color:#fff;}
.tut-sym-desc{font-size:12px;color:#333;font-weight:bold;}
.tut-points{list-style:none;padding:0;margin:0;}
.tut-points li{font-size:11px;color:#555;line-height:1.6;padding-left:12px;position:relative;}
.tut-points li::before{content:"▶";position:absolute;left:0;font-size:8px;color:#aaa;top:2px;}
.tut-rule-box{background:#f8f9fa;margin:0 10px 10px;border-radius:9px;padding:9px 11px;}
.tut-footer{flex-shrink:0;padding:10px 14px 24px;display:flex;gap:8px;}
.tut-skip{flex:1;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:11px;padding:12px;font-size:13px;font-weight:bold;cursor:pointer;}
.tut-next{flex:2;background:#ff8a80;color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:bold;cursor:pointer;}

/* ━━━ WCAG 2.4.7 Focus Visible ━━━ */
/* キーボードフォーカス時に明確なリングを表示 */
button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
outline: 3px solid #1565c0;
outline-offset: 2px;
border-radius: 4px;
}
/* タッチ操作時はフォーカスリングを非表示（見た目改善） */
button:focus:not(:focus-visible) { outline: none; }

/* ━━━ WCAG 1.4.11 Non-text Contrast ━━━ */
/* ボタンの境界線がわかるように */
.rbtn:focus-visible,
.runner-btn:focus-visible,
.choice-btn:focus-visible {
outline: 3px solid #ffffff;
outline-offset: 2px;
box-shadow: 0 0 0 5px #1565c0;
}

/* ━━━ 色覚異常対応：アウト/ヒット/出塁を色だけで区別しない ━━━ */

.rbtn.unavailable::after {
content: '';
position: absolute;
inset: 0;
background: repeating-linear-gradient(
45deg,
transparent,
transparent 4px,
rgba(0,0,0,0.1) 4px,
rgba(0,0,0,0.1) 5px
);
border-radius: 8px;
pointer-events: none;
}
.rbtn { position: relative; }


#modal-root{position:fixed;inset:0;z-index:200;pointer-events:none;}
.page-content{overscroll-behavior:contain;}
button,input,select,textarea,label,[role="button"]{touch-action:manipulation;}
.btn,.rbtn,.runner-btn,.choice-btn,.bb-util-btn,.tab-btn,.sbd-btn,.undo-btn,.start-btn{-webkit-user-select:none;user-select:none;}
@supports (-webkit-touch-callout: none){
  html{height:-webkit-fill-available;}
  body{min-height:-webkit-fill-available;}
  #app,.setup-page,.tut-page{min-height:-webkit-fill-available;}
}
@media (max-width: 375px){
  .btn{height:50px;font-size:16px;}

  .bb-util-btn{font-size:10px;padding:5px 2px;}
}

function getResultAvailability(code){
var bases=S.curBases||[];
var outs=S.outs||0;

var balls=pitches.filter(function(p){return p==="B";}).length;
var strikes=pitches.filter(function(p){return["S","SW","F"].includes(p);}).length;

// ── ゴロ / フライ / ライナー ── 常に起こり得る

// ── ゲッツー ──
// 1塁走者がいてアウト1以下でないと成立しない

  if(outs>=2) return"impossible";   // 2アウトでは成立不可

  return"ok";

// ── 犠打（送りバント） ──
// 走者なし・2アウトは無意味
case "SAC":
  if(outs>=2) return"impossible";   // 2アウトでバントはない
  if(!hasAny) return"unlikely";     // 走者なしバントは稀（セーフティバント等）
  return"ok";

// ── バントヒット ── いつでも起こり得る
case "BH": return"ok";

// ── スクイズ ──
// 3塁走者必須・2アウトは稀
case "SQ":
  if(!has3) return"impossible";     // 3塁走者なしでスクイズは成立しない
  if(outs>=2) return"unlikely";     // 2アウトスクイズは稀
  return"ok";

// ── 犠打エラー出塁 ──
case "SACE":
  if(outs>=2) return"unlikely";     // 2アウトバントは稀
  if(!hasAny) return"unlikely";     // 走者なし
  return"ok";

// ── スクイズ失敗 ──
case "SQE":
  if(!has3) return"impossible";     // 3塁走者なしでは成立しない
  return"ok";

// ── 犠牲フライ ──
// 3塁走者が必要
case "SF":
  if(!has3) return"impossible";     // 3塁走者なしでは犠飛にならない
  return"ok";

// ── IFF（インフィールドフライ） ──
case "IFF":
  if(outs>=2) return"impossible";
  if(!has1&&!has2) return"impossible";
  return"ok";

// ── 打撃妨害(CI) ── いつでも起こり得る
case "CI": return"ok";

// ── 走塁妨害(OBI) ──
case "OBI":
  if(!hasAny) return"unlikely";     // 走者なしでは走塁妨害は起こらない
  return"ok";

// ── 3バント失敗 ──
case "K3B":
  if(strikes<2) return"unlikely";   // 2ストライク未満では3バント失敗はない
  return"ok";

// ── 振り逃げ ──
case "KWP":
  if(outs>=2) return"ok";         // 2アウトなら常に振り逃げ可
  if(!has1) return"ok";            // 1塁が空なら振り逃げ可
  return"impossible";               // 1塁走者あり・2アウト未満は振り逃げ不可（野球ルール）

default: return"ok";

}
}

// 走者イベントの可否判定
function getRunnerEventAvailability(code){
var bases=S.curBases||[];
var outs=S.outs||0;
var hasAny=bases.length>0;
var has1=bases.includes(1),has2=bases.includes(2),has3=bases.includes(3);
// 盗塁できる走者（3塁走者は盗塁の意味が薄い）
var hasSBRunner=has1||has2; // 1塁か2塁に走者
var numRunners=bases.length;

switch(code){

// ── 盗塁(SB) ──
// 走者なし → impossible
// 3塁走者のみ → unlikely（3塁から盗塁は非常に稀）
case "SB":
  if(!hasAny) return"impossible";
  if(!hasSBRunner) return"unlikely"; // 3塁走者のみ
  return"ok";

// ── 重盗(DS) ──
// 走者2人以上が必要
case "DS":
  if(numRunners<2) return"impossible";
  return"ok";

// ── 盗塁失敗(CS) ──
// 走者なし → impossible
// 3塁走者のみ → unlikely
case "CS":
  if(!hasAny) return"impossible";
  if(!hasSBRunner) return"unlikely";
  return"ok";

// ── 牽制アウト(PO) ──
// 走者必須
case "PO":
  if(!hasAny) return"impossible";
  return"ok";
case "POE":
  // 牽制エラー: 走者がいるときのみ有効（エラーで走者が進む・打者はそのまま）
  if(!hasAny) return"impossible";
  return"ok";

// ── 走塁死(ROUT) ──
// 走者必須
case "ROUT":
  if(!hasAny) return"impossible";
  return"ok";

// ── 挟殺(RUNDOWN) ──
// 走者必須
// ── 三重盗(TS) ──
case "TS":
  if(numRunners<3) return"impossible";
  return"ok";

case "RUNDOWN":
  if(!hasAny) return"impossible";
  return"ok";

// ── 暴投(WP) / 捕逸(PB) ──
// 走者なし → unlikely（記録はできるが進塁しない）
case "WP":
case "PB":
  if(!hasAny) return"unlikely";
  return"ok";

// ── ボーク(BALK) ──
// 走者なし → impossible（ボークは走者がいる場面のルール）
case "BALK":
  if(!hasAny) return"impossible";
  return"ok";

// ── 得点追加(SCORE) ──
// 走者なし → impossible（得点できる走者がいない）
case "SCORE":
  if(!hasAny) return"impossible";
  return"ok";

default: return"ok";

}
}

// 「賢い状況推察」- 押されたボタン×現在の状況から推察とヒントを生成
// ============================================================
function getSituationAdvice(code){
var bases=S.curBases||[];
var outs=S.outs||0;
var has1=bases.includes(1),has2=bases.includes(2),has3=bases.includes(3);
var hasAny=bases.length>0;
// why: なぜ通常使わないか / guess: 何が起きたと推察 / hint: 代替案
var why="",guess="",hint="";

if(code==="SAC"&&!hasAny){
why="犠打（送りバント）は塁に走者がいるときに、意図的にバントして走者を進める作戦です。今は走者がいません。";
guess="もしかして...バントしてアウトになった？　→ その場合は「ゴロ」でアウトを記録するのが正確です。";
hint="バントでもアウトなら「ゴロ」タブで記録してください";
} else if(code==="SF"&&!has3){
why="犠牲フライは「3塁にいる走者をホームに帰すための外野フライ」です。今3塁に走者がいません。";
guess="もしかして...外野にフライが上がって捕られた？　→ 「フライ」でアウトを記録してください。";
hint="走者が3塁にいないフライアウト → 「フライ」を選んでください";
} else if(code==="DP"&&!has1){
why="ゲッツー（ダブルプレー）は1塁走者がいるときに起こります。ゴロを打って1塁走者と打者の両方が同時にアウトになるプレーです。";
guess="もしかして...普通のゴロアウトだった？　→ 「ゴロ」でアウトを記録してください。";
hint="ゴロを打ってアウトになった → 「ゴロ」を選んでください";
} else if(code==="DP"&&outs>=2){
why="2アウトではゲッツーが成立しません。すでに2アウトなのでもう1人アウトにするとチェンジになるだけです。";
guess="もしかして...ゴロでアウトになった？　→ 「ゴロ」でアウトを記録してください。";
hint="2アウトのゴロアウト → 「ゴロ」を選んでください";
} else if(code==="IFF"&&!has1&&!has2){
why="インフィールドフライは「1塁・2塁に走者がいるとき」だけ審判が宣告する特別なルールです。走者なしでは使いません。";
guess="もしかして...内野に高いフライが上がった？　→ 「フライ」でアウトを記録してください。";
hint="内野のフライアウト → 「フライ」を選んでください";
} else if(code==="SQ"&&!has3){
why="スクイズは「3塁走者をホームに生還させるバント作戦」です。3塁に走者がいないと意味がありません。";
guess="もしかして...バントしてゴロを打った？　→ 「犠打」または「ゴロ」で記録してください。";
hint="走者がいないバント → 「犠打」か「ゴロ」を選んでください";
} else if(code==="SB"&&!hasAny){
why="盗塁は走者がいるときに走者が次の塁に走ることです。走者がいないと盗塁できません。";
guess="まず打者が塁に出た後、次の投球中に走ります。打席の結果（出塁）を先に記録してから「盗塁」を押してください。";
hint="先に打席の結果（出塁）を記録 → それから「盗塁」ボタンを押す";
} else if((code==="WP"||code==="PB")&&!hasAny){
var ev=code==="WP"?"暴投（投球が大きく逸れた）":"捕逸（捕手がボールを後ろに逸らした）";
why=ev+"は走者がいるときに走者が進塁します。走者がいない場合、記録してもランナーへの影響はありません。";
guess="走者なしの場合、通常はカウント（ボール）として①に記録するだけで十分です。";
hint="走者なしなら①で「B（ボール）」を押すだけで大丈夫です";
} else if(code==="BALK"&&!hasAny){
why="ボークは「投手の反則投球で走者を1つ進める」ルールです。走者がいない場合、走者への影響はありません（ボール1つが加算されます）。";
guess="走者なしのボークは「B（ボール）」として投球カウントするのが一般的です。";
hint="走者なしなら①で「B（ボール）」を押してください";
} else if(code==="SCORE"&&!hasAny){
why="「得点追加」は走者がホームに帰ったときに使います。走者がいないので通常は発生しません。";
guess="得点の記録漏れがあった場合は記録できますが、確認してから操作してください。";
hint="得点の記録漏れがあった場合のみ使用してください";
} else {
why="この状況では通常起こらないプレーです。";
guess="本当にこのプレーが起きたか、もう一度確認してください。";
hint="違うと思ったら「キャンセル」を押して、正しいボタンを選んでください";
}
return {why:why, guess:guess, hint:hint};
}

runnerInfo:{},
tab:"input", resultTab:"out",
autoMsg:null, modal:null,

// 現在の投手を取得
function curPitcher(side){
ensurePitchers();
var s=side||S.curSide;
var ps=S.pitchers[s]||[];
return ps.length>0?ps[ps.length-1]:null;
}

// 現在の守備側（ピッチャーがいる側）
function defSide(){
return S.curSide==="top"?"bottom":"top";
}

// pitchers が未初期化のときに安全に初期化
function ensurePitchers(){
if(!S.pitchers)S.pitchers={top:[],bottom:[]};
if(!S.pitchers.top)S.pitchers.top=[];
if(!S.pitchers.bottom)S.pitchers.bottom=[];
}

// 投球を現在投手にカウント
function addPitchToPitcher(count){
ensurePitchers();
var ds=defSide();
var p=curPitcher(ds);
if(p) p.pitchCount=(p.pitchCount||0)+count;
}

// 打者アウトを投手に記録
function recordBatterToPitcher(rc,scored,earnedScored){
var ds=defSide();
var p=curPitcher(ds);
if(!p)return;
p.battersFaced=(p.battersFaced||0)+1;
p.earnedRuns=(p.earnedRuns||0)+earnedScored;
p.unearnedRuns=(p.unearnedRuns||0)+(scored-earnedScored);
}

// 投手交代
function changePitcher(name,number){
var ds=defSide();
if(!S.pitchers[ds])S.pitchers[ds]=[];
// 前の投手を非currentに
var ps=S.pitchers[ds];
if(ps.length>0)ps[ps.length-1].isCurrent=false;
ps.push({
name:name||"投手",
number:number||"",
pitchCount:0,
earnedRuns:0,
unearnedRuns:0,
battersFaced:0,
inningStart:S.curInning,
inningStartOuts:S.outs,
isCurrent:true
});
}

// 仮の苗字リスト（少年野球でよくある名前）
var SAMPLE_NAMES=["田中","鈴木","佐藤","山田","高橋","伊藤","渡辺","中村","小林","加藤","吉田","山本","斉藤","松本","井上"];
// 守備順（打順に対応した一般的な守備位置）: 1=投,2=捕,3=一,4=二,5=三,6=遊,7=左,8=中,9=右
var DEFAULT_POS=[1,6,4,3,5,7,8,9,2];
// 背番号（1〜9の打順に合わせた仮番号）
var DEFAULT_NUMS_AWAY=["7","3","5","4","11","8","9","14","2"];
var DEFAULT_NUMS_HOME=["1","6","8","10","2","15","7","12","4"];

function makeTeam(name, isHome){
var nums=isHome?DEFAULT_NUMS_HOME:DEFAULT_NUMS_AWAY;
// 名前は毎回シャッフルして重複なく9人分選ぶ
var pool=SAMPLE_NAMES.slice();
var selected=[];
for(var i=0;i<9;i++){
var idx=Math.floor(Math.random()*pool.length);
selected.push(pool.splice(idx,1)[0]);
}
return{
name:name,
players:Array.from({length:9},function(_,i){
return{order:i+1,number:nums[i],name:selected[i],position:DEFAULT_POS[i]};
})
};
}
function makeGame(){
return{
top:   Array.from({length:MAX_INNINGS},function(){return {atBats:[],score:0,earnedRuns:0,events:[],changes:[]}}),
bottom:Array.from({length:MAX_INNINGS},function(){return {atBats:[],score:0,earnedRuns:0,events:[],changes:[]}})
};
}

// ============================================================
// 走者連動エンジン
// 「この結果なら走者はこう動く」を自動計算し、
// 曖昧なケースのみ確認ポップアップを出す
// ============================================================

// 走者情報を更新するメインエンジン
// returns: {newBases, newRunnerInfo, scored, earnedScored, needConfirm, confirmOptions}
function calcRunnerMovement(rc, sel, curBases, runnerInfo, outs){
sel = sel || {};
runnerInfo = runnerInfo || {};
var nb = curBases.slice();
var ri = JSON.parse(JSON.stringify(runnerInfo)); // deep copy
var scored = 0, earnedScored = 0;
// addRunner で使う現在打者の order
var _batterOrder = sel && sel._batterOrder ? sel._batterOrder : 0;
var hasError = !!(sel.errorWho || (sel.hasError));

function moveRunner(from, to){
var idx = nb.indexOf(from);
if(idx === -1) return;
nb.splice(idx, 1);
if(to > 3){
scored++;
// エラーによる出塁走者、またはエラーで得点した場合は非自責
if(ri[from] && ri[from].earned) earnedScored++;
delete ri[from];
} else {
ri[to] = ri[from] ? Object.assign({}, ri[from]) : {earned:true};
delete ri[from];
nb.push(to);
}
}

function addRunner(base, earned){
nb.push(base);
// 出塁打者の情報をrunnerInfoに記録（後でapplyRunnerOutで参照）
ri[base] = {earned: earned, order: _batterOrder};
}
// =========================================
// 確定した走者移動先（runnerMoves）があれば優先適用
// =========================================
var runnerMoves = (sel && sel.runnerMoves && Object.keys(sel.runnerMoves).length > 0) ? sel.runnerMoves : null;
if(runnerMoves){
// ウィザードで確認済みの移動を適用（上位塁から順に処理）
var basesToProcess = Object.keys(runnerMoves).map(Number).sort(function(a,b){return b-a;});
basesToProcess.forEach(function(from){
var mv = runnerMoves[from];
if(!mv) return;
var toStr = mv.to;
if(toStr === "OUT"){
// アウトになった走者: 塁から削除するだけ（得点なし）
var idx = nb.indexOf(from);
if(idx !== -1) nb.splice(idx, 1);
delete ri[from];
return;
}
if(toStr === String(from)) return; // 動かない
var toNum = toStr === "H" ? 4 : Number(toStr);
moveRunner(from, toNum);
});
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
// E/FC/1H/2H/3Hの場合: 打者を適切な塁に追加
// 打者(key=0)の処理
var bm = runnerMoves[0];
if(bm){
if(bm.to === "OUT"){
// 打者アウト: どこにも塁を追加しない
} else {
var bmBase = bm.to === "H" ? 4 : Number(bm.to);
if(bmBase <= 3){
if(!nb.includes(bmBase)){nb.push(bmBase);nb.sort();}
// GO_E / E / FC は非自責、ヒット系は自責
ri[bmBase] = {earned: !["E","FC","GO_E"].includes(rc)};
} else if(bmBase === 4){
scored++;
earnedScored++;
}
}
} else {
// runnerMovesに打者がない場合のデフォルト
var batterBase = {"E":1,"FC":1,"GO_E":1,"1H":1,"2H":2,"3H":3}[rc];
if(batterBase){
if(!nb.includes(batterBase)){nb.push(batterBase);nb.sort();}
ri[batterBase] = {earned: !["E","FC","GO_E"].includes(rc)};
}
}
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// =========================================
// アウト系：走者は基本動かない（runnerMovesなし時のフォールバック）
// =========================================
var OUT_CODES = ["K","SK","K3B","GO","FO","LO","IFF","SAC","SQ","SQE","SF","DP"];
if(OUT_CODES.includes(rc)){
// SAC(犠打) / SQ(スクイズ): 全走者が1つずつ進む
if(rc === "SAC" || rc === "SQ"){
if(nb.includes(3)){ moveRunner(3,4); }
if(nb.includes(2)){ moveRunner(2,3); }
if(nb.includes(1)){ moveRunner(1,2); }
// SQは3塁走者の生還を確実にする（走者がいない場合も考慮）
}
// SF(犠牲フライ): 3塁走者はホームイン
if(rc === "SF" && nb.includes(3)){
moveRunner(3, 4);
}
// ゲッツー: 走者1塁は2アウト目でアウト
if(rc === "DP"){
if(nb.includes(1)) nb = nb.filter(function(b){return b!==1;});
delete ri[1];
}
// SQE（スクイズ失敗）: 打者もアウト(三振) + 3塁走者もアウト
// extraOutsは commitAtBat で sel.extraOuts=1 として処理される
// 打者の結果は別途 startRunnerConfirmIfNeeded で決定
if(rc === "SQE"){
if(nb.includes(3)){
nb = nb.filter(function(b){return b!==3;});
delete ri[3];
// SQEは追加でアウトになるが、commitAtBatのextraOutsで管理
}
}
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// =========================================
// 出塁系：押し出し処理
// =========================================
if(["BB","HBP","OBI"].includes(rc)){
var earned = (rc !== "OBI"); // 守備妨害は基本自責
// 満塁→押し出し
if(nb.includes(1)&&nb.includes(2)&&nb.includes(3)){
moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
addRunner(1, earned);
} else if(nb.includes(1)&&nb.includes(2)){
moveRunner(2,3); moveRunner(1,2); addRunner(1, earned);
} else if(nb.includes(1)){
moveRunner(1,2); addRunner(1, earned);
} else {
addRunner(1, earned);
}
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// =========================================
// エラー出塁（E / GOエラー出塁 GO_E）
// =========================================
// 打撃妨害(CI): 打者が1塁へ（非自責）、走者はフォース進塁
if(rc === "CI" || rc === "OBI"){
if(nb.includes(3)&&nb.includes(2)&&nb.includes(1)){
moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
} else if(nb.includes(2)&&nb.includes(1)){
moveRunner(2,3); moveRunner(1,2);
} else if(nb.includes(1)){
moveRunner(1,2);
}
if(!nb.includes(1)){nb.push(1);nb.sort();}
ri[1]={earned:false}; // 妨害による出塁は非自責
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}
if(rc === "E" || rc === "GO_E"){
// フォース状態を計算して自動進塁
if(nb.includes(3)&&nb.includes(2)&&nb.includes(1)){
moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
} else if(nb.includes(2)&&nb.includes(1)){
moveRunner(2,3); moveRunner(1,2);
} else if(nb.includes(1)){
moveRunner(1,2);
}
if(!nb.includes(1)){nb.push(1);nb.sort();}
ri[1]={earned:false};
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// =========================================
// インフィールドフライ（IFF）
// 打者自動アウト、走者はそのまま（リタッチ義務）
// =========================================
if(rc === "IFF"){
// 走者は動かない
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// =========================================
// 野選（FC）: アウトになった走者を削除、打者を1塁へ
// =========================================
if(rc === "FC"){
var runnerOutBase = sel.runnerOutBase || null;
// アウトになった走者を塁から削除
if(runnerOutBase && nb.includes(runnerOutBase)){
nb = nb.filter(function(b){return b !== runnerOutBase;});
delete ri[runnerOutBase];
}
// 残りの走者でフォース状態のものは進塁
// （アウト走者を除いた後、打者が1塁に来るのでフォースが発生しうる）
var nbAfterOut = nb.slice();
// 打者が1塁に来ることで押し出されるか判定
if(nbAfterOut.includes(1)){
if(nbAfterOut.includes(2)){
if(nbAfterOut.includes(3)){ moveRunner(3,4); }
moveRunner(2,3);
}
moveRunner(1,2);
}
// 打者→1塁（FC出塁は非自責）
if(!nb.includes(1)){nb.push(1);nb.sort();}
ri[1]={earned:false};
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// 振り逃げ
if(rc === "KWP"){
if(nb.includes(1)&&nb.includes(2)&&nb.includes(3)){scored++;nb=[1,2,3];}
else if(nb.includes(1)&&nb.includes(2)){nb=[1,2,3];}
else if(nb.includes(1)){nb=[1,2];}
else {nb=[1].concat(nb);}
ri[1]={earned:false};
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// =========================================
// ヒット系：自動＋追加進塁確認
// =========================================
var extraBase = (sel && sel.extraBase) ? sel.extraBase : null;
var extraReason = (sel && sel.extraReason) ? sel.extraReason : null;

// BH（バントヒット）: 単打と同様に1塁へ（自責）
if(rc === "BH"){
if(nb.includes(3)){moveRunner(3,4);}
if(nb.includes(2)){moveRunner(2,3);}
if(nb.includes(1)){moveRunner(1,2);}
addRunner(1, true);
}
// SACE（犠打エラー出塁）: エラーで打者が出塁
if(rc === "SACE"){
if(nb.includes(3)&&nb.includes(2)&&nb.includes(1)){
moveRunner(3,4); moveRunner(2,3); moveRunner(1,2);
} else if(nb.includes(2)&&nb.includes(1)){
moveRunner(2,3); moveRunner(1,2);
} else if(nb.includes(1)){
moveRunner(1,2);
}
if(!nb.includes(1)){nb.push(1);nb.sort();}
ri[1]={earned:false};
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

if(rc === "1H"){
// 打者→1塁（自責）
// 走者: 3塁走者→得点, 2塁走者→3塁, 1塁走者→2塁（基本）
// ただし1塁走者が得点できる可能性あり（強打のシングルなど）→ extraBaseで上書き
if(nb.includes(3)){moveRunner(3,4);}
if(nb.includes(2)){moveRunner(2,3);}
if(nb.includes(1)){
if(extraBase==="H"||extraBase==="3"){moveRunner(1, extraBase==="H"?4:3);}
else {moveRunner(1,2);}
}
addRunner(1, true);
if(extraBase==="2"){moveRunner(1,2);}
if(extraBase==="3"){/* already handled */}
if(extraBase==="H"){scored++; earnedScored++; nb=nb.filter(function(b){return b!==1;});}
}
else if(rc === "2H"){
// 打者→2塁, 走者: 3塁→得点, 2塁→得点（基本）, 1塁→3塁
if(nb.includes(3)){moveRunner(3,4);}
if(nb.includes(2)){moveRunner(2,4);}
if(nb.includes(1)){
if(extraBase==="H"){ moveRunner(1,4); }
else { moveRunner(1,3); }
}
addRunner(2, true);
}
else if(rc === "3H"){
// 打者→3塁, 全走者→得点
if(nb.includes(3)){moveRunner(3,4);}
if(nb.includes(2)){moveRunner(2,4);}
if(nb.includes(1)){moveRunner(1,4);}
addRunner(3, true);
}
else if(rc === "HR" || rc === "RH"){
// 全走者＋打者→得点
var basesCopy = nb.slice();
basesCopy.forEach(function(b){ moveRunner(b,4); });
scored++; earnedScored++; // 打者分
nb = [];
ri = {};
}

nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored, needConfirm:false};
}

// 走者イベント連動処理（WP/PB/ボーク/盗塁）
// 盗塁の場合: 1塁走者が盗塁 → 2塁走者は重盗か？を確認
function calcRunnerEventMovement(code, movingBases, curBases, runnerInfo){
runnerInfo = runnerInfo || {};
var nb = curBases.slice();
var ri = JSON.parse(JSON.stringify(runnerInfo));
var scored = 0, earnedScored = 0;
// POE(牽制エラー)は守備エラーなので得点は全て非自責
var isPOE = (code==="POE");

movingBases.forEach(function(from){
var idx = nb.indexOf(from);
if(idx === -1) return;
nb.splice(idx,1);
var to = from + 1;
if(to > 3){
scored++;
if(!isPOE && ri[from]&&ri[from].earned) earnedScored++;
delete ri[from];
} else {
// POEで進んだ走者は非自責フラグを立てる
var prevRi = ri[from]||{earned:true};
ri[to] = isPOE ? {earned:false, order:prevRi.order} : prevRi;
delete ri[from];
nb.push(to);
}
});
nb = nb.filter(function(v,i,a){return a.indexOf(v)===i&&v>=1&&v<=3;}).sort();
return {newBases:nb, newRunnerInfo:ri, scored:scored, earnedScored:earnedScored};
}

// WP/PB/BALK: 全走者が1つ進む（デフォルト）- ただし確認を出す
function getWPDefaultMovement(curBases){
return curBases.filter(function(b){return b>=1&&b<=3;});
}

// 盗塁時の連動確認が必要かチェック
// 1塁走者盗塁 → 2塁走者がいれば「重盗?」確認
// 複数走者がいてWP/PB → 「全員進む?」確認
function needsRunnerConfirm(code, movingBases, curBases){
if(code==="SB"||code==="CS"){
// 盗塁で他の塁にも走者がいれば確認
var others = curBases.filter(function(b){return b>=1&&b<=3&&!movingBases.includes(b);});
return others.length > 0;
}
return false;
}

// カウントロジック
// ============================================================
function getCount(pitches){
// 表示用（上限あり: B=3, S=2）
var b=0,s=0,hbp=false;
for(var i=0;i<pitches.length;i++){
var p=pitches[i];
if(p==="HBP"){hbp=true;break;}
if(p==="B"){if(b<3)b++;}
else if(p==="S"||p==="SW"){if(s<2)s++;}
else if(p==="F"){if(s<2)s++;}
}
return{b,s,hbp};
}
function getRawCount(pitches){
// 判定用（上限なし）
var b=0,s=0,hbp=false;
for(var i=0;i<pitches.length;i++){
var p=pitches[i];
if(p==="HBP"){hbp=true;break;}
if(p==="B")b++;
else if(p==="S"||p==="SW")s++;
else if(p==="F"){if(s<2)s++;}
}
return{b,s,hbp};
}
function checkAuto(pitches){
if(!pitches||pitches.length===0)return null;
var cnt=getRawCount(pitches);
if(cnt.hbp)return"HBP";
if(cnt.b>=4)return"BB";
var last=pitches[pitches.length-1];
if(cnt.s>=3){
if(last==="S")return"K";
if(last==="SW")return"KWP_READY";
}
return null;
}

// ============================================================

function buildSym(sel){

if(ht==="1H"||ht==="2H"||ht==="3H"){
var baseLabel=ht==="1H"?"H":ht==="2H"?"2H":"3H";
var sym=f1?(f1+baseLabel):baseLabel;
if(sel.extraBase)sym+="(→"+sel.extraBase+"塁)";
if(sel.extraReason==="E"&&err)sym+="\nE"+err;
// 内野手（1〜6）なら「内野安打」、外野手（7〜9）なら「前ヒット」と表記
var isInfield=f1&&f1<=6;
var hitDesc=ht==="1H"?(isInfield?"内野安打":"前ヒット"):ht==="2H"?"二塁打":"三塁打";
var desc=(f1?POSITIONS[f1]||"":"")+hitDesc;
if(sel.extraBase)desc+=" →"+sel.extraBase+"塁";
return{sym,desc,color:"#1b7a3e"};
}
if(ht==="HR")return{sym:"HR",  desc:"本塁打",        color:"#e53935"};
if(ht==="RH")return{sym:"RH",  desc:"ランニングHR",  color:"#b71c1c"};
if(ht==="BB")return{sym:"B",   desc:"四球",          color:"#0066cc"};
if(ht==="HBP")return{sym:"死", desc:"死球",          color:"#f57c00"};
if(ht==="K") return{sym:"K",   desc:"三振（見逃し）",color:"#c00"};
if(ht==="SK")return{sym:"SK",  desc:"三振（空振り）",color:"#8b0000"};
if(ht==="KWP")return{sym:"振逃",desc:"振り逃げ出塁", color:"#6a1b9a"};
if(ht==="OBI")return{sym:"妨",desc:"走塁妨害出塁",  color:"#ad1457"};
if(ht==="CI") return{sym:"CI", desc:"打撃妨害出塁（捕手インターフェア）",color:"#ad1457"};
if(ht==="K3B")return{sym:"K",  desc:"三振（3バント失敗）",color:"#c00"};
if(ht==="GO"||ht==="SAC"||ht==="SQ"||ht==="GO_E"||ht==="SACE"){
var s="";
if(f1){if(f2){s=f1+"∪"+f2;if(f3)s+="∪"+f3;}else s=String(f1);}else s="G";
if(ht==="SAC")s="SAC";
if(ht==="SQ")s="SQ"+(f1?f1:"");
if(ht==="SACE"){s=f1?(String(f1)+"E"+err):"E"; s+="(SAC)"; }
if(ht==="GO_E"&&err)s+=String(f1||"")+"E"+err;
var col={"GO":"#546e7a","SAC":"#78909c","SQ":"#2e7d32","GO_E":"#e67e22","SACE":"#e67e22"}[ht]||"#546e7a";
var descMap={GO:"ゴロ",SAC:"犠打",SQ:"スクイズ",GO_E:"ゴロエラー出塁",SACE:"犠打エラー出塁"};
return{sym:s,desc:(f1?POSITIONS[f1]||"":"")+descMap[ht]+(err?"("+POSITIONS[err]+"E)":""),color:col};
}
if(ht==="IFF"){
return{sym:f1?(f1+"IFF"):"IFF",desc:(f1?POSITIONS[f1]||"":"")+"インフィールドフライ",color:"#546e7a"};
}
if(ht==="BH"){
// バントヒット: 守備番号+BH
var bhSym=f1?(f1+"BH"):"BH";
var bhWho=f1?(POSITIONS[f1]+"前の"):"";
return{sym:bhSym,desc:"バントヒット（"+bhWho+"内野安打）",color:"#1b7a3e"};
}
if(ht==="SQE"){
return{sym:"SQE",desc:"スクイズ失敗（3塁走者タッチアウト）",color:"#c62828"};
}
if(ht==="FO"||ht==="SF"){
var s2=f1?(f1+"∩"):"F∩";
if(err)s2+="E"+err;
if(ht==="SF")s2="SF";
return{sym:s2,desc:(f1?POSITIONS[f1]||"":"")+"フライ"+(err?"("+POSITIONS[err]+"E)":""),color:err?"#e67e22":"#607d8b"};
}
if(ht==="LO")return{sym:f1?(f1+"L"):"L",desc:(f1?POSITIONS[f1]||"":"")+"ライナー",color:"#455a64"};
if(ht==="DP"){
var s3=f1?String(f1):"";
if(f2)s3+="∪"+f2;if(f3)s3+="∪"+f3;if(!s3)s3="DP";
return{sym:s3,desc:(f1?POSITIONS[f1]||"":"")+"→"+(f2?POSITIONS[f2]||"":"")+"ゲッツー",color:"#37474f"};
}
if(ht==="E")return{sym:err?(String(err)+"E"):"E",desc:(err?POSITIONS[err]||"":"")+"エラー",color:"#e67e22"};
if(ht==="FC"){
var fcBase=sel.throwTo?POSITIONS[sel.throwTo]||"":"";
var fcOut=sel.runnerOutBase?{1:"一塁走者",2:"二塁走者",3:"三塁走者"}[sel.runnerOutBase]+"アウト":"";
var sym5=f1?("FC"+f1):"FC";
if(sel.throwTo)sym5+="→"+sel.throwTo;
return{sym:sym5,desc:"野選"+(fcBase?"（"+fcBase+"へ送球）":"")+(fcOut?"・"+fcOut:""),color:"#0277bd"};
}
return{sym:ht||"?",desc:"",color:"#888"};
}

function buildDefNote(sel){
if(!sel||!sel.fielder1)return"";
var ht=sel.hitType||"";
var f1=POSITIONS[sel.fielder1]||"",f2=sel.throwTo?POSITIONS[sel.throwTo]||"":"";
var f3=sel.throwTo2?POSITIONS[sel.throwTo2]||"":"",err=sel.errorWho?POSITIONS[sel.errorWho]||"":"";
if(ht==="1H"||ht==="2H"||ht==="3H"){
var n=f1+"前ヒット";
if(sel.extraBase)n+="→"+sel.extraBase+"塁";
if(sel.extraReason==="E"&&err)n+="("+err+"エラー)";
return n;
}
if(ht==="GO"||ht==="SAC"){var n2=f1+"捕球";if(f2)n2+="→"+f2+"送球";if(err)n2+="("+err+"E)";if(sel.outcome==="out")n2+=" アウト";else if(sel.outcome==="reach")n2+=" 打者出塁";return n2;}
if(ht==="FO"||ht==="SF"){var n3=f1+"フライ";if(err)n3+="("+err+"E)";return n3;}
if(ht==="LO")return f1+"ライナー";
if(ht==="IFF")return(f1||"内野手")+"インフィールドフライ";
if(ht==="GO_E"){var n2=f1?(f1+"捕球"):"ゴロ";if(f2)n2+="→"+POSITIONS[f2]+"送球";if(err)n2+="("+POSITIONS[err]+"E) 出塁";return n2;}
if(ht==="DP")return f1+"→"+f2+(f3?"→"+f3:"")+"ゲッツー";
if(ht==="E")return(err||f1)+"エラー";
if(ht==="FC")return f1+"野選";
return"";
}

function calcRunPath(rc,sel){
sel=sel||{};
var extra=sel.extraBase;
if(rc==="HR"||rc==="RH")return[1,2,3,"H"];
if(rc==="3H"){if(extra==="H")return[1,2,3,"H"];return[1,2,3];}
if(rc==="2H"){if(extra==="3")return[1,2,3];if(extra==="H")return[1,2,3,"H"];return[1,2];}
if(rc==="1H"){if(extra==="2")return[1,2];if(extra==="3")return[1,2,3];if(extra==="H")return[1,2,3,"H"];return[1];}
if(["BB","HBP","E","FC","KWP","OBI","GO_E","CI","BH","SACE"].includes(rc))return[1];
if(rc==="IFF")return[]; // インフィールドフライは打者アウト、走者は動かない
return[];
}

curBases:S.curBases.slice(),outs:S.outs,
runnerInfo:JSON.parse(JSON.stringify(S.runnerInfo||{})),

function undoLastAtBat(){
if(!S.history||S.history.length===0){render();return;}
var snap=S.history[0];
S.history=S.history.slice(1);
S.game=snap.game;
S.curSide=snap.curSide;S.curInning=snap.curInning;

S.editingSlot=snap.editingSlot||null;

S.curPitches=[];S.autoMsg=null;S._pitcherChangedMidAB=false;S.modal=null;
render();
}

// ============================================================
// ウィザード
// ============================================================
function defWizStart(hitType){
S.modal={type:"defense_wiz",wiz:{step:["1H","2H","3H"].includes(hitType)?"hit_fielder":"fielder_main",sel:{hitType:hitType}}};
render();
}
function defWizAdvance(wiz){
var sel=wiz.sel,ht=sel.hitType;
// ヒット系
if(ht==="1H"||ht==="2H"||ht==="3H"){
if(sel.fielder1===undefined){wiz.step="hit_fielder";return;}
// hit_extra_ask廃止: 余分な進塁は走者確認モーダルで対応
// if(sel.hasExtra&&...) → 不要
// if(sel.hasExtra&&...) → 不要
// if(sel.hasExtra&&...) → 不要
wiz.step="confirm";return;
}
if(ht==="GO"||ht==="SAC"){
if(!sel.fielder1){wiz.step="fielder_main";return;}
// 送球先を聞く（送球なし=skipならthrowTo="none"がセットされる）
if(!sel.askedThrow){sel.askedThrow=true;wiz.step="throw_to";return;}
if(sel.throwTo===undefined)return;
// エラーの確認: 送球がある場合のみ（送球なし=自分でタッチはエラーなし前提）
var hadThrow=(sel.throwTo&&sel.throwTo!=="none");
if(hadThrow&&!sel.askedError){sel.askedError=true;wiz.step="error_ask";return;}
if(hadThrow&&sel.hasError===undefined)return;
if(sel.hasError&&!sel.errorWho){wiz.step="error_who";return;}
// outcome（アウト/出塁）: エラーがあった場合のみ表示
if(sel.hasError&&!sel.outcome){wiz.step="outcome";return;}
// エラーなし or 送球なし → 即confirm（アウト確定）
if(!sel.hasError){sel.outcome="out";}
wiz.step="confirm";return;
}
if(ht==="FO"||ht==="SF"){
if(!sel.fielder1){wiz.step="fielder_main";return;}
// FO/SF: フライなのでエラー（落球）は稀 → 確認省略してconfirm
// エラーがあったなら「エラーで出塁」を選んでもらう
if(!sel.askedError){sel.askedError=true;sel.hasError=false;}
wiz.step="confirm";return;
}
if(ht==="LO"){if(!sel.fielder1){wiz.step="fielder_main";return;}wiz.step="confirm";return;}
if(ht==="DP"){
if(!sel.fielder1){wiz.step="fielder_main";return;}
if(!sel.throwTo){wiz.step="throw_to";return;}
if(sel.throwTo2===undefined){wiz.step="throw_to2";return;}
wiz.step="confirm";return;
}
if(ht==="IFF"){if(!sel.fielder1){wiz.step="fielder_main";return;}wiz.step="confirm";return;}
if(ht==="E"){if(!sel.fielder1){wiz.step="fielder_main";return;}if(!sel.errorWho){wiz.step="error_who";return;}wiz.step="confirm";return;}
if(ht==="FC"){
if(!sel.fielder1){wiz.step="fielder_main";return;}
// FCは送球先（どこでアウトにしようとしたか）を確認
if(!sel.throwTo){wiz.step="throw_to";return;}
// アウトになった走者の塁を確認
if(sel.runnerOutBase===undefined){wiz.step="fc_runner_out";return;}
wiz.step="confirm";return;
}
wiz.step="confirm";
}
function defWizBack(){
if(!S.modal||S.modal.type!=="defense_wiz")return;
var sel=S.modal.wiz.sel,ht=sel.hitType;
var isHit=ht==="1H"||ht==="2H"||ht==="3H";
var order=isHit
?["errorWho","extraReason","extraBase","hasExtra","fielder1"]
:ht==="FC"
?["runnerOutBase","throwTo","fielder1"]
:["outcome","errorWho","hasError","askedError","throwTo2","throwTo","askedThrow","fielder1"];
for(var i=0;i<order.length;i++){
var k=order[i];
if(sel[k]!==undefined){
if(k==="hasError"){delete sel.askedError;delete sel.hasError;delete sel.errorWho;}
else if(k==="askedThrow"){delete sel.askedThrow;delete sel.throwTo;delete sel.askedError;delete sel.hasError;delete sel.errorWho;delete sel.outcome;}
else if(k==="hasExtra"){delete sel.hasExtra;delete sel.extraBase;delete sel.extraReason;delete sel.errorWho;}
else delete sel[k];
break;
}
}
// fielder_main / hit_fielder が最初のステップなら閉じる（キャンセル）
var currentStep=S.modal.wiz.step;
if(currentStep==='fielder_main'||currentStep==='hit_fielder'){
S.modal=null;render();return;
}
defWizAdvance(S.modal.wiz);render();
}
function defWizConfirm(){
if(!S.modal||S.modal.type!=="defense_wiz")return;
var sel=S.modal.wiz.sel;
var rc=sel.hitType;
// GOエラー出塁 → rc="GO_E"（打者が3塁まで進んだケース等に対応）
// FOエラー落球出塁 → rc="E"（通常通り）
if(sel.hitType==="GO"&&sel.outcome==="reach") rc="GO_E";
else if(sel.hitType==="FO"&&sel.outcome==="reach") rc="E";
S.modal=null;
startRunnerConfirmIfNeeded(rc, buildSym(sel), sel);
}
function defWizCommitHitSkip(){
if(!S.modal||S.modal.type!=="defense_wiz")return;
var sel=S.modal.wiz.sel;
var rc=sel.hitType;
S.modal=null;
startRunnerConfirmIfNeeded(rc, buildSym(sel), sel);
}

// ============================================================
// 走者進塁確認ウィザード
// 「この打席結果の時に、各走者がどこまで進んだか」を確認
// ============================================================

// 走者確認が必要かどうか判定し、必要なら先に確認、不要ならそのままcommit
function startRunnerConfirmIfNeeded(rc, sym, sel){
var bases = S.curBases.slice();

// 自動処理できるケース（確認不要）
var autoOk = ["K","SK","K3B","BB","HBP","HR","RH","SAC","SQ","SQE","SF","DP","KWP","IFF","CI","OBI"].includes(rc);
if(autoOk){
// SQE: 打者三振(1アウト) + 3塁走者もアウト(追加1アウト) = 合計2アウト
if(rc==="SQE"){
var selSqe=Object.assign({},sel,{extraOuts:(sel.extraOuts||0)+1});
commitAtBat(rc, sym, selSqe);
} else {
commitAtBat(rc, sym, sel);
}
return;
}

// 走者なし で ヒット系の場合: 打者の追加進塁のみ確認
// ヒット系は打者自身がアウトになる可能性がある（2塁打→3塁でアウト等）
// GO_E（ゴロエラー出塁）も「打者が出塁」なので、打者の到達塁を確認する
var hitCodes = ["1H","2H","3H","BH","GO_E","E","CI","OBI","SACE"];
var isHit = hitCodes.includes(rc);

// 確認対象の走者を収集
var runnersToCheck = bases.filter(function(b){return b>=1&&b<=3;});

// ヒット系は「打者の追加進塁確認」も対象に追加
// 打者は通常の進塁先より先に行こうとしてアウトになることがある
// → 打者を仮想的な走者として追加（塁番号: "B" → 実際の到達塁に変換）
// ただし打者の到達塁はdefaultで決まる（1H→1塁、2H→2塁、3H→3塁）
// 打者が余分に進んだ/アウトになった場合のみ確認が必要

if(runnersToCheck.length === 0 && !isHit){
commitAtBat(rc, sym, sel);
return;
}
if(runnersToCheck.length === 0 && isHit){
// 走者なし・ヒット/出塁: 打者到達塁の確認
// 1H→1塁, 2H→2塁, 3H→3塁, E/GO_E/CI/OBI/SACE/BH→1塁 がデフォルト
var batterDefaultBase = rc==="2H"?2:rc==="3H"?3:1;
var defaultMoves0 = {};
// BH・SACE・CI・OBIは打者が1塁に行くのが確実 → 自動処理（確認不要）
var batterIsAutoTo1 = ["BH","SACE","CI","OBI","2H","3H","HR","RH"].includes(rc);
var batterHint0 = {"E":"エラー出塁なので打者は1塁へ。もし2塁以上に進んでいたら選択してください",
"GO_E":"ゴロエラーなので打者は1塁へ止まります"}[rc]||"この打者は何塁まで進みましたか？";
defaultMoves0[0] = {to:String(batterDefaultBase), reason:"hit",
auto:batterIsAutoTo1, askNeeded:!batterIsAutoTo1,
isBatter:true, hint:batterHint0};
S.modal={
type:"runner_move_confirm",
rc:rc, sym:sym, sel:sel,
runners:[0],  // 0 = 打者
moves:defaultMoves0,
currentIdx:0,
extraOuts:0
};
render();
return;
}

// 各走者のデフォルト進塁先を計算
var defaultMoves = calcDefaultRunnerMoves(rc, sel, bases);

// ヒット・出塁系: 打者の到達塁も確認
if(isHit){
var batterDefault = rc==="2H"?2:rc==="3H"?3:1;
var batterAutoTo1 = ["BH","SACE","CI","OBI","2H","3H","HR","RH"].includes(rc);
var batterHint = rc==="GO_E"?"ゴロエラーの間に打者はどこまで進みましたか？":
rc==="E"?"エラーの間に打者はどこまで進みましたか？":
"この打者は何塁まで進みましたか？";
defaultMoves[0] = {to:String(batterDefault), reason:"hit",
auto:batterAutoTo1, askNeeded:!batterAutoTo1,
isBatter:true, hint:batterHint};
runnersToCheck = runnersToCheck.concat([0]);
}

S.modal = {
type: "runner_move_confirm",
rc: rc, sym: sym, sel: sel,
runners: runnersToCheck,
moves: defaultMoves,
currentIdx: 0,
extraOuts: 0
};
render();
}

// ============================================================
// 各走者のデフォルト進塁先を計算（ユーザーへの提案）
// hint: 提案理由の説明文（モーダルで表示）
// auto: true = 確認スキップ可, askNeeded: true = 必ず確認
// ============================================================
function calcDefaultRunnerMoves(rc, sel, bases){
var moves = {};
var hasError = !!(sel && (sel.errorWho || sel.hasError));

bases.forEach(function(b){
// ── ゴロ系（GO / SAC） ──
if(rc === "GO" || rc === "SAC"){
var forced = isForced(b, bases);
if(forced){
// フォース: 1つ進む（自動）
var to = b+1>3 ? "H" : String(b+1);
moves[b] = {to:to, reason:"force", auto:true,
hint:"1塁が空くので自動的に1つ進みます"};
} else if(hasError){
// エラーあり: 非フォース走者も進む可能性→確認
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:"エラーの混乱で1つ余分に進んだ場合は選択してください（通常は止まります）"};
} else {
// 通常ゴロ: 非フォース走者は動かない（自動）
moves[b] = {to:String(b), reason:"stay", auto:true,
hint:"ゴロの間、走者はそのまま"};
}
}
// ── フライ系（FO / SF） ──
else if(rc === "FO" || rc === "SF"){
if(hasError){
// エラー落球: 走者が進める→確認
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:"フライ落球エラーで走者が進んだ可能性があります"};
} else if(b === 3){
// 3塁走者: タッチアップでホームイン可能→確認
moves[b] = {to:"H", reason:"tagup", auto:false, askNeeded:true,
hint:"3塁走者はフライを捕られた後にホームへ走れます（タッチアップ）"};
} else if(b === 2){
// 2塁走者: タッチアップで3塁へ可能→確認
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:"2塁走者はフライを捕られた後に3塁へ走れる場合があります"};
} else {
// 1塁走者: 通常は戻る（自動）
moves[b] = {to:String(b), reason:"stay", auto:true,
hint:"フライが上がったので走者は戻ります（タッチアップしない場合）"};
}
}
// ── ライナー系（LO） ──
else if(rc === "LO"){
// ライナー: 走者は帰塁できない可能性→全員確認
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:"ライナーは素早く捕られると走者が戻れない場合があります"};
}
// ── エラー出塁（E） ──
else if(rc === "E"){
var forced2 = isForced(b, bases);
if(forced2){
var to2 = b+1>3 ? "H" : String(b+1);
moves[b] = {to:to2, reason:"force", auto:true,
hint:"前の塁がつまっていないので自動で1つ進みます"};
} else {
// 非フォース走者: エラーの間に余分に進んだかもしれないが
// 基本は「止まった」がデフォルト（エラーで時間稼ぎがないと通常は動かない）
// ヒント: 連続エラーや送球エラーが起きた場合は余分に進む
var errorerHint = "通常は止まります。";
if(sel&&sel.fielder1&&sel.errorWho&&sel.fielder1!==sel.errorWho){
// 捕球と送球が別の選手 → 送球エラーの可能性
errorerHint = "送球ミスがあった場合、走者がさらに進んだかもしれません";
} else if(sel&&sel.throwTo){
errorerHint = "送球中にさらにミスがあった場合は選択してください";
}
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:errorerHint};
}
}
// ── 野選（FC） ──
else if(rc === "FC"){
var runnerOutBase2 = sel.runnerOutBase;
if(b === runnerOutBase2){
return; // このランナーはFCウィザードでアウト確定済み
}
var basesExcludingOut = bases.filter(function(bb){return bb!==runnerOutBase2;});
var forced3 = isForced(b, basesExcludingOut);
if(forced3){
var to3 = b+1>3 ? "H" : String(b+1);
moves[b] = {to:to3, reason:"force", auto:true,
hint:"前の塁がつまっていないので自動で1つ進みます"};
} else {
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:"野選の間に走者が動いた可能性があります"};
}
}
// ── 単打（1H） ──
else if(rc === "1H"){
if(b===3){
moves[b]={to:"H",reason:"hit",auto:false,askNeeded:true,
hint:"3塁走者は通常ホームに帰ります。もし阻止された場合は下のアウトボタンで"};
} else if(b===2){
moves[b]={to:"3",reason:"hit",auto:false,askNeeded:true,
hint:"2塁走者は通常3塁へ進みます。さらに進んだ場合は「ホームイン」を選んでください"};
} else if(b===1){
// 1塁走者: 2塁か3塁か得点かを確認
moves[b]={to:"2",reason:"hit",auto:false,askNeeded:true,
hint:"1塁走者は2塁で止まった？それとも3塁まで進んだ？"};
}
}
// ── 二塁打（2H） ──
else if(rc === "2H"){
if(b===3){
moves[b]={to:"H",reason:"hit",auto:true,
hint:"3塁走者は二塁打でホームインします"};
} else if(b===2){
moves[b]={to:"H",reason:"hit",auto:true,
hint:"2塁走者は二塁打でホームインします"};
} else if(b===1){
// 1塁走者: 3塁か本塁か確認
moves[b]={to:"3",reason:"hit",auto:false,askNeeded:true,
hint:"1塁走者は3塁で止まった？それともホームまで帰った？"};
}
}
// ── 三塁打（3H） ──
else if(rc === "3H"){
moves[b] = {to:"H", reason:"hit", auto:true,
hint:"三塁打なので全員ホームに帰ります"};
}
// ── GOエラー出塁（GO_E）──
else if(rc === "GO_E"){
// ゴロエラー: 通常は走者が止まるがエラーの混乱で進む場合も
// フォース走者は1つ進むが、非フォースは基本止まり
var forcedGOE = isForced(b, bases);
if(forcedGOE){
moves[b] = {to:b+1>3?"H":String(b+1), reason:"force", auto:true,
hint:"次の塁が空いているので自動で1つ進みます"};
} else {
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:"通常は止まります。エラーの混乱中に余分に進んだ場合は選択してください"};
}
}
// ── 打撃妨害(CI) / 走塁妨害(OBI) ──
else if(rc === "CI" || rc === "OBI"){
// フォース走者は自動進塁
var forcedCI = isForced(b, bases);
if(forcedCI){
moves[b] = {to: b+1>3?"H":String(b+1), reason:"force", auto:true,
hint:"妨害による出塁でフォース進塁します"};
} else {
moves[b] = {to:String(b), reason:"stay", auto:false, askNeeded:true,
hint:"妨害があったので走者が余分に進んだかもしれません"};
}
}
// ── インフィールドフライ（IFF）── 走者は動かない（自動）
else if(rc === "IFF"){
moves[b] = {to:String(b), reason:"stay", auto:true, hint:"インフィールドフライなので走者はそのまま"};
}
// ── バントヒット（BH）── 単打と同様
else if(rc === "BH"){
if(b===3){ moves[b]={to:"H",reason:"hit",auto:true,hint:"3塁走者はバントヒットでホームに帰ります"}; }
else if(b===2){ moves[b]={to:"3",reason:"hit",auto:true,hint:"2塁走者は3塁へ進みます"}; }
else if(b===1){ moves[b]={to:"2",reason:"hit",auto:false,askNeeded:true,hint:"1塁走者は2塁で止まった？それとも3塁まで進んだ？"}; }
}
// ── スクイズ（SQ）── 全走者1つ進む
else if(rc === "SQ"){
if(b===3){ moves[b]={to:"H",reason:"sq",auto:true,hint:"スクイズで3塁走者がホームインします"}; }
else if(b===2){ moves[b]={to:"3",reason:"force",auto:true,hint:"スクイズで2塁走者が3塁へ進みます"}; }
else if(b===1){ moves[b]={to:"2",reason:"force",auto:true,hint:"スクイズで1塁走者が2塁へ進みます"}; }
}
// ── スクイズ失敗（SQE）── 3塁走者は確認
else if(rc === "SQE"){
if(b===3){ moves[b]={to:String(b),reason:"stay",auto:false,askNeeded:true,
hint:"スクイズ失敗: 3塁走者はアウトになった？それとも戻れた？"}; }
else { moves[b]={to:String(b),reason:"stay",auto:true}; }
}
// ── 犠打エラー出塁（SACE）── フォース走者は進む
else if(rc === "SACE"){
var forcedSACE = isForced(b, bases);
if(forcedSACE){
moves[b]={to:b+1>3?"H":String(b+1),reason:"force",auto:true,hint:"バントエラーで前の塁が空くので自動で進みます"};
} else {
moves[b]={to:String(b),reason:"stay",auto:false,askNeeded:true,hint:"バントエラーの混乱で余分に進んだかもしれません"};
}
}
// ── BB/HBP/KWP（フォアボール系）── フォース走者のみ自動進塁
else if(rc === "BB" || rc === "HBP" || rc === "KWP"){
var forcedBB = isForced(b, bases);
if(forcedBB){
moves[b]={to:b+1>3?"H":String(b+1),reason:"force",auto:true,hint:"フォアボールで押し出されて1つ進みます"};
} else {
moves[b]={to:String(b),reason:"stay",auto:true,hint:"フォアボールですが、押し出しではないので止まります"};
}
}
// ── K/SK/K3B（三振系）── 走者は動かない
else if(rc === "K" || rc === "SK" || rc === "K3B"){
moves[b]={to:String(b),reason:"stay",auto:true,hint:"三振なので走者はそのまま"};
}
// ── それ以外 ── フォース判定してデフォルト
else {
var forcedDef = isForced(b, bases);
if(forcedDef){
moves[b]={to:b+1>3?"H":String(b+1),reason:"force",auto:false,askNeeded:true,hint:"確認してください"};
} else {
moves[b]={to:String(b),reason:"stay",auto:false,askNeeded:true,hint:"走者の動きを確認してください"};
}
}
});
return moves;
}

// フォース状態の判定（この走者の後ろの塁が全て埋まっているか）
function isForced(base, bases){
// 1塁は常にフォース（打者が1塁へ向かうため）
if(base === 1) return true;
// 2塁は1塁に走者がいる場合
if(base === 2) return bases.includes(1);
// 3塁は1塁2塁両方に走者がいる場合
if(base === 3) return bases.includes(1) && bases.includes(2);
return false;
}

function curTeam(){return S.curSide==="top"?S.awayTeam:S.homeTeam;}

function skipBatterWithStatus(status, reachBase){
// status: 'out' | 'reach' | 'pending'
// reachBase: 1|2|3|'H' (出塁時の塁)
var inn=curInn();
if(!inn.slots)inn.slots=[];
var order=curOrderDisplay();
var p=curPlayer();
var newSlotIdx=inn.slots.length;
inn.slots.push({
type:"pending",
slotIdx:newSlotIdx,
order:order,
playerNum:(p&&p.number)||"?",
playerName:(p&&p.name)||order+"番",
inning:S.curInning,
side:S.curSide,
quickStatus:status,
quickBase:reachBase||null,  // 出塁した塁
basesSnapshot:S.curBases.slice(),
outsSnapshot:S.outs,
runnerInfoSnapshot:JSON.parse(JSON.stringify(S.runnerInfo)),
pitchersSnapshot:JSON.parse(JSON.stringify(S.pitchers))
});
if(!S.pendingOrders)S.pendingOrders=[];
S.pendingOrders.push({side:S.curSide,inning:S.curInning,order:order,slotIdx:newSlotIdx});
// アウトの場合はアウトカウントを増やす
if(status==='out'){
S.outs=Math.min(S.outs+1,3);
if(S.outs>=3){S._pendingChange=true;}
}
// 出塁の場合はフッターのダイヤモンドに塁を反映
if(status==='reach'&&reachBase&&reachBase!=='H'){
var base=Number(reachBase);
if(base>=1&&base<=3&&!S.curBases.includes(base)){
S.curBases=S.curBases.concat([base]).sort(function(a,b){return a-b;});
S.runnerInfo[base]={earned:true,order:order};
}
}
if(status==='reach'&&reachBase==='H'){
// ホームラン: 走者も全員ホームイン
var hr_scored=S.curBases.length+1;
curInn().score=(curInn().score||0)+hr_scored;
S.curBases=[];S.runnerInfo={};
}
S.curPitches=[];S.autoMsg=null;S.modal=null;S.editingSlot=null;
render();
}

// 既存打席の修正
// data-edit-ab="innIdx-side-order" 形式で呼ばれる
// ============================================================
function editExistingAb(innIdx,side,order){
var inn=(S.game[side]||[])[innIdx];
if(!inn)return;
var atBats=inn.atBats||[];
// orderが一致する打席を探す
var abIdx=atBats.findIndex(function(ab){return ab.order===order;});
if(abIdx<0){
// slotsのfilledも確認
var slots=inn.slots||[];
var slotIdx=slots.findIndex(function(s2){return s2.order===order&&s2.type==='filled';});
if(slotIdx>=0){
editPendingSlot(side,innIdx,slotIdx);
return;
}
return;
}
// 既存打席を削除してeditingSlotとしてセット
saveSnapshot();
var ab=atBats[abIdx];
// イニングのスコアなどを元に戻す
inn.score=Math.max(0,(inn.score||0)-((ab.scored)||0));
inn.earnedRuns=Math.max(0,(inn.earnedRuns||0)-((ab.earnedScored)||0));
// 打席を削除
atBats.splice(abIdx,1);
// editingSlotとして設定（再入力用）
S.editingSlot={side:side,inning:innIdx,slotIdx:-1,order:order,isExisting:true,removedAb:ab};
// 元の打席の状態（走者・アウト数など）を復元するのは難しいので
// 現在の状態はそのままにして入力モードに
S.tab='input';
S.curPitches=ab.pitches?ab.pitches.slice():[];
S.modal=null;
render();
}

function commitAtBat(rc,sym,sel){
saveSnapshot();
var p=curPlayer();
var rp=calcRunPath(rc,sel);
// 投球数を投手に加算（commitAtBat呼び出し時点でS.curPitchesが残っている）
addPitchToPitcher(S.curPitches.length);
// 現在打者の order を sel に付加（runnerInfoの order追跡用）
if(!sel)sel={};
sel._batterOrder = curOrder()+1;
// 打者アウト（runnerMoves[0].to==="OUT"）の場合、打者は塁に到達しない
if(sel && sel.runnerMoves && sel.runnerMoves[0] && sel.runnerMoves[0].to==="OUT"){
rp=[];
}
var OUT_CODES=["K","SK","K3B","GO","FO","LO","IFF","SAC","SQ","SQE","SF","DP"];
var isOut=OUT_CODES.includes(rc),isDP=rc==="DP";
// sel.extraOuts: 走者確認ウィザードでアウトになった走者の数
var extraOuts = (isDP ? 1 : 0) + (sel && sel.extraOuts ? sel.extraOuts : 0);
var newOuts=S.outs+(isOut?1:0)+extraOuts;

// 走者連動エンジンで新走者状態を計算
var movement = calcRunnerMovement(rc, sel, S.curBases, S.runnerInfo, S.outs);
var newBases = movement.newBases;
var newRunnerInfo = movement.newRunnerInfo;
var scored = movement.scored;
var earnedScored = movement.earnedScored;

var inn=curInn();
var scoredNum=scored>0?(inn.score||0)+scored:0;
var ab={
order:curOrder()+1,
playerNum:(p&&p.number)||"?",
playerName:(p&&p.name)||"",
pitches:S.curPitches.slice(),
result:rc,
// sym が {sym:{sym:...,color:...}} と二重ラップされた場合に正規化
sym:(sym&&sym.sym&&typeof sym.sym==='object'?sym.sym:sym)||{sym:rc,desc:"",color:"#888"},
defense:sel||{},
// 打席中に投手交代があった場合のフラグ（スコアブック表示用）
pitcherChanged:!!(S._pitcherChangedMidAB||sel&&sel.pitcherChanged),
inning:S.curInning,side:S.curSide,
runPath:rp,
reachedBases:rp.filter(function(b){return b!=="H";}),
outCountAfter:Math.min(newOuts,3),
scoredNum:scoredNum,
scored:scored,
earnedScored:earnedScored,
// 自責点判定のメモ
// エラー/FC/CI/OBI/GO_E/KWP/振り逃げ絡みの出塁は非自責の可能性
hasErrorInPlay:!!(sel&&(sel.errorWho||sel.hasError||(["E","FC","CI","OBI","GO_E","KWP"].includes(rc)))),
// タイムリー情報（得点に絡んだ打席かどうか）
isTimely:scored>0&&["1H","2H","3H","HR","RH","BH","SF","SQ"].includes(rc),
isForcedIn:scored>0&&["BB","HBP","CI","OBI","KWP"].includes(rc),
timelyCount:scored
};
// editingSlot（遡り入力 or 既存打席修正）の場合
if(S.editingSlot){
var esInn2=(S.game[S.editingSlot.side]||[])[S.editingSlot.inning];
if(S.editingSlot.isExisting){
// 既存打席の修正: atBatsに挿入（orderで並び順を維持）
if(esInn2){
var absArr=esInn2.atBats||[];
var insertPos=absArr.findIndex(function(x){return x.order>ab.order;});
if(insertPos<0)absArr.push(ab); else absArr.splice(insertPos,0,ab);
esInn2.score=(esInn2.score||0)+scored;
esInn2.earnedRuns=(esInn2.earnedRuns||0)+earnedScored;
}
} else if(esInn2&&esInn2.slots&&esInn2.slots[S.editingSlot.slotIdx]){
// 空欄スロットを入力済みに更新
esInn2.slots[S.editingSlot.slotIdx]=Object.assign({},ab,{type:"filled",slotIdx:S.editingSlot.slotIdx});
if(S.pendingOrders){
S.pendingOrders=S.pendingOrders.filter(function(po){
return!(po.side===S.editingSlot.side&&po.inning===S.editingSlot.inning&&po.slotIdx===S.editingSlot.slotIdx);
});
}
}
S.editingSlot=null;
S.tab="scorebook"; S.sbSubTab="log";
} else {
inn.atBats.push(ab);
}
inn.score=(inn.score||0)+scored;
inn.earnedRuns=(inn.earnedRuns||0)+earnedScored;
// 投手に被打席・失点を記録
recordBatterToPitcher(rc, scored, earnedScored);
S.curPitches=[];S.autoMsg=null;

if(newOuts>=3){S.outs=3;S.curBases=newBases;S.runnerInfo=newRunnerInfo;S._pendingChange=true;}
else{S.outs=newOuts;S.curBases=newBases;S.runnerInfo=newRunnerInfo;S._pendingChange=false;}

S.modal={type:"scorebook_preview",ab:ab};
render();
}

function addScore(side,inning,d){
if(S.game[side]&&S.game[side][inning]){
S.game[side][inning].score=Math.max(0,(S.game[side][inning].score||0)+d);
}
render();
}

function runnerEvent(code){
var isOutEvent=["CS","PO","ROUT","RUNDOWN"].includes(code);
// TS（三重盗）はDSと同様に全走者選択
if(code==="TS"){code="DS";} // DSのロジックを流用（全走者が動く）
if(isOutEvent){
S.modal={type:"runner_out",eventCode:code};
S.routDefNum=null;
render();
return;
}

var active = S.curBases.filter(function(b){return b>=1&&b<=3;});

// SCORE: 得点追加
if(code==="SCORE"){S.modal={type:"runner_event",eventCode:code};render();return;}

// WP/PB/BALK: 全走者が1つ進む（デフォルト）
// 走者が1人もいなければ何もしない
if(["WP","PB","BALK"].includes(code)){
if(active.length===0){
// 走者なし → 記録だけして終了
var lbl0=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
var inn0=curInn();
inn0.events.push({type:code,label:lbl0,scored:0});
render();
return;
}
// 走者あり → 全員1つ進む提案モーダル
S.modal={type:"runner_advance",eventCode:code,suggested:active.slice()};
render();
return;
}

// SB/DS: 盗塁 → 誰が盗塁するか選択、他走者の連動確認
if(code==="SB"||code==="DS"){
if(active.length===0){render();return;}
S.modal={type:"runner_event",eventCode:code};
render();
return;
}

S.modal={type:"runner_event",eventCode:code};
render();
}

// WP/PB/BALK 一括進塁適用
function applyAdvanceAll(code, movingBases){
var mv = calcRunnerEventMovement(code, movingBases, S.curBases, S.runnerInfo);
var lbl=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
var inn=curInn();
inn.events.push({type:code,label:lbl,scored:mv.scored});
inn.score=(inn.score||0)+mv.scored;
inn.earnedRuns=(inn.earnedRuns||0)+mv.earnedScored;
S.curBases=mv.newBases;
S.runnerInfo=mv.newRunnerInfo;
S.modal=null;
render();
}

function applyRunnerEvent(code,bases){
// SB後の連動確認のために、mv適用前の走者リストを保存
var basesBeforeMove = S.curBases.slice();
var mv=calcRunnerEventMovement(code,bases,S.curBases,S.runnerInfo);
var lbl=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
var inn=curInn();
inn.events.push({type:code,label:lbl,scored:mv.scored});
inn.score=(inn.score||0)+mv.scored;
inn.earnedRuns=(inn.earnedRuns||0)+mv.earnedScored;
S.curBases=mv.newBases;S.runnerInfo=mv.newRunnerInfo;
S.modal=null;

// 盗塁後: 盗塁した走者以外の走者がいれば「連動進塁確認」を出す
if(code==="SB"){
// basesBeforeMove: mv適用前の全走者の塁
// bases: 盗塁した走者の元の塁（盗塁前）
// 他の走者 = 盗塁前にいた走者のうち、盗塁した走者以外
var remaining=basesBeforeMove.filter(function(b){
return b>=1&&b<=3&&!bases.includes(b);
});
if(remaining.length>0){
S.modal={type:"runner_chain",eventCode:code,remaining:remaining};
}
}
render();
}

function applyRunnerOut(code,base,defNum){
// 走者アウト（塁から削除、アウトカウント増加）
S.curBases=S.curBases.filter(function(b){return b!==base;});
S.outs=Math.min(S.outs+1,3);
var lbl=(RUNNER_EVENTS.find(function(r){return r.code===code;})||{label:code}).label;
if(defNum)lbl+="("+POSITIONS[defNum]+")";
var inn=curInn();

// どのatBatの走者がアウトになったかを追跡
// runnerInfo[base] に出塁打者の order が記録されていれば紐付け
var ri=S.runnerInfo&&S.runnerInfo[base];
var runnerOrder=ri&&ri.order;  // どの打者の走者か

inn.events.push({
type:code,label:lbl,scored:0,outBase:base,
defNum:defNum||null,
runnerOrder:runnerOrder||null,  // 元の打者の打順
});

// 元の打者のab に runnerOutEvents を追記（ダイヤモンド表示用）
(function(){
var allAbs=inn.atBats||[];
if(!allAbs.length)return;
var targetAb=null;
// runnerOrder がある場合は対象の打者を検索
if(runnerOrder){
for(var i2=0;i2<allAbs.length;i2++){
if(allAbs[i2].order===runnerOrder){targetAb=allAbs[i2];break;}
}
}
// 見つからなければ最後の打席にフォールバック
if(!targetAb)targetAb=allAbs[allAbs.length-1];
if(!targetAb.runnerOutEvents)targetAb.runnerOutEvents=[];
targetAb.runnerOutEvents.push({
code:code, label:lbl, outBase:base, defNum:defNum||null
});
})();

delete S.runnerInfo[base];
S.modal=null;S.routDefNum=null;
if(S.outs>=3)doChange();
else render();
}

function recordChange(type,name,num){
var labelMap={pitcher:"投手交代",hitter:"代打",runner:"代走"};
var iconMap={pitcher:"🔄",hitter:"🏏",runner:"🏃"};
var inn=curInn();
if(inn&&inn.changes){
inn.changes.push({type:type,label:labelMap[type]||type,name:name||"",num:num||"",
icon:iconMap[type]||"📝",inning:S.curInning,side:S.curSide,outs:S.outs});
}
if(type==="pitcher"){
changePitcher(name,num);
// 打席途中の投手交代フラグ（次の commitAtBat でダイヤモンドにマーク）
S._pitcherChangedMidAB=true;
}
S.modal=null;render();
}

function closeModal(){
S.modal=null;S.autoMsg=null;
if(S._pendingChange){S._pendingChange=false;doChange();}
else render();
}

function renderModal(){

if(type==="runner_move_confirm"){
var rm=m;
var runners=rm.runners||[];
var idx=rm.currentIdx||0;

// 全走者確認完了 → commit
if(idx>=runners.length){
  S.modal=null;
  commitAtBatWithRunnerMoves(rm.rc, rm.sym, rm.sel, rm.moves);
  return"";
}

var base=runners[idx];
var move=rm.moves[base]||{to:base===0?"1":String(base),reason:"stay",auto:false};
// autoで確認不要なものを飛ばす
if(move.auto && !move.askNeeded){
  var nextIdx2=null;
  for(var ii2=idx+1;ii2<runners.length;ii2++){
    var mii2=rm.moves[runners[ii2]]||{auto:true};
    if(!mii2.auto||mii2.askNeeded){nextIdx2=ii2;break;}
  }
  if(nextIdx2===null){
    S.modal=null;
    commitAtBatWithRunnerMoves(rm.rc, rm.sym, rm.sel, rm.moves);
    return"";
  }
  rm.currentIdx=nextIdx2;
  base=runners[nextIdx2];
  move=rm.moves[base]||{to:base===0?"1":String(base),reason:"stay",auto:false};
}

var bName=base===0?"今の打者":{1:"一塁走者",2:"二塁走者",3:"三塁走者"}[base]||base+"塁走者";
var defTo=move.to||(base===0?"1":String(base));

      '<span style="font-size:9px;opacity:.9">'+POSITIONS[n]+'</span>'+
    '</button>';
  }).join("");
  return'<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"><div class="modal-sheet">'+
    '<div style="background:#ffebee;border-radius:9px;padding:10px 12px;margin-bottom:12px;">'+

  '</div></div>';

// プログレス表示

function buildWriteGuide(ab){
if(!ab)return"";
var rc=ab.result||"",sel=ab.defense||{};
var sym=ab.sym||{sym:rc,color:"#333"};
var rp=ab.runPath||[],scored=rp.includes("H")||((ab.scored||0)>0);
var bNames={"1":"1塁","2":"2塁","3":"3塁","H":"ホーム"};
var steps=[];
var step=1;

// 投球記号（左上）
if(ab.pitches&&ab.pitches.length>0){
steps.push(step+++'. <strong>左上</strong>に投球記号を小さく記入 - '+ab.pitches.length+'球投げました');
}
// 結果記号（右下）
if(sym.sym){
steps.push(step+++'. <strong>右下</strong>に結果を記入: <span style="color:'+sym.color+';font-family:monospace;font-weight:900;font-size:15px">'+sym.sym+'</span>');
}
// HR/RH の右上
if(rc==="HR"||rc==="RH"){
steps.push(step+++'. <strong>右上</strong>に <span style="color:#c62828;font-family:monospace;font-weight:900">'+rc+'</span> と書く（本塁打の印）');
}
// タイムリー打点（右上）
if(ab.isTimely&&ab.timelyCount>0&&rc!=="HR"&&rc!=="RH"){
steps.push(step+++'. <strong>右上</strong>に <span style="color:#c62828;font-weight:900">'+ab.timelyCount+'打点</span> と書く（タイムリー）');
}
// 走塁ライン（赤線）
if(rp.length>0){
var pathStr=["ホーム"].concat(rp.map(function(b){return bNames[String(b)]||b;})).join(" → ");
steps.push(step+++'. <strong style="color:#e53935">赤線</strong>を引く: '+pathStr);
}
// 得点の場合
if(scored&&ab.scoredNum>0){
steps.push(step+++'. <strong>中央</strong>に丸囲みの得点番号 <span style="color:#e53935;font-weight:900">'+ab.scoredNum+'</span> を書く');
steps.push(step+++'. ダイヤモンド全体を<strong style="color:#e53935">赤丸</strong>で囲む（得点の印）');
}
// アウトカウント
if(["K","SK","K3B","GO","FO","LO","SAC","SF","DP","IFF","SQ","SQE"].includes(rc)){
var outRoman=["","I","II","III"][Math.min(ab.outCountAfter||0,3)];
if(outRoman)steps.push(step+++'. <strong style="color:#c62828">'+outRoman+'</strong> と書く（アウトカウント）');
}
// 牽制・走者アウト
if(ab.runnerOutEvents&&ab.runnerOutEvents.length>0){
var roeDesc={PO:"牽制",CS:"盗塁失敗",ROUT:"走塁死",RUNDOWN:"挟殺"};
ab.runnerOutEvents.forEach(function(ev){
var base=bNames[String(ev.outBase)]||ev.outBase;
steps.push(step+++'. '+base+'で走者がアウト（'+((roeDesc[ev.code]||ev.code))+'） - 走塁線に<strong style="color:#c62828">✕</strong>を書く');
});
}

if(steps.length===0)return'';
return steps.map(function(s){return '<div style="margin-bottom:5px;line-height:1.6">'+s+'</div>';}).join('');
}

// 投手のイニング数を計算（表示用）
function calcPitcherInnings(side, pitcherIdx){
var ps=S.pitchers[side]||[];
var p=ps[pitcherIdx];
if(!p)return"";
var startInning=p.inningStart||0;
var startOuts=p.inningStartOuts||0;
var isCur=p.isCurrent;

if(isCur){
var curInnNum=S.curInning+1;
return startInning+1+"回〜"+(curInnNum>startInning+1?curInnNum+"回":"現在");
} else {
var next=ps[pitcherIdx+1];
if(next){
return startInning+1+"回〜"+next.inningStart+"回";
}
return startInning+1+"回〜";
}
}

// 投球回数を小数表記で計算（例: 2回1/3 → "2.1"）
// アウト合計 / 3 = 回数
function calcPitcherIP(side, pitcherIdx){
var ps=S.pitchers[side]||[];
var p=ps[pitcherIdx];
if(!p)return"0.0";

// 担当した打者からアウト数を概算
// より正確にはatBatsのoutCountAfterを追跡する必要があるが
// battersFaced と outs の差から推定
var bf=p.battersFaced||0;
if(bf===0)return"0.0";

// 簡易計算: 自分が関わった合計アウト数
// next pitcherの登板時のアウト状況との差を計算
var totalOutsStart = (p.inningStart||0)*3 + (p.inningStartOuts||0);
var totalOutsEnd;
if(p.isCurrent){
totalOutsEnd = S.curInning*3 + S.outs;
} else {
var next=ps[pitcherIdx+1];
if(next){
totalOutsEnd = (next.inningStart||0)*3 + (next.inningStartOuts||0);
} else {
totalOutsEnd = totalOutsStart + bf; // 近似
}
}
var totalOuts = Math.max(0, totalOutsEnd - totalOutsStart);
var innings = Math.floor(totalOuts/3);
var remainOuts = totalOuts % 3;
return innings + (remainOuts>0?"."+remainOuts:"");
}

    var bases3=autoBases.split(",").map(Number).filter(function(n){return n>0;});

    var checked=Array.from(document.querySelectorAll("#runnerCBs input:checked")).map(function(c){return Number(c.value);});

  }
}

// ============================================================
// 走者進塁確認モーダルのボタン処理
// ============================================================
// 走者が「進んだ / 止まった」を選択
function rmSelectMove(base, to){
if(!S.modal||S.modal.type!=="runner_move_confirm")return;
var rm=S.modal;
rm.awaitingOutDetail=null;
rm.moves[base]={to:to, reason:"user", auto:false, confirmed:true};
rmAdvanceToNext(rm, base);
}

// 走者が「アウトになった」を選択（守備番号確認へ）
function rmSelectOut(base, atBase, defNum){
if(!S.modal||S.modal.type!=="runner_move_confirm")return;
var rm=S.modal;
rm.awaitingOutDetail=null;
rm.moves[base]={
to:"OUT",
atBase:atBase,
defNum:defNum||null,
reason:"out",
auto:false,
confirmed:true
};
if(!rm.extraOuts)rm.extraOuts=0;
rm.extraOuts++;
rmAdvanceToNext(rm, base);
}

// 次の走者へ進む（共通）
function rmAdvanceToNext(rm, doneBase){
var runners=rm.runners||[];
var doneIdx=runners.indexOf(doneBase);
var nextIdx=null;
for(var i=doneIdx+1;i<runners.length;i++){
var b=runners[i];
var mv=rm.moves[b]||{auto:false};
if(!mv.auto||mv.askNeeded){nextIdx=i;break;}
}
if(nextIdx!==null){
rm.currentIdx=nextIdx;
render();
} else {
// 全走者確認完了
S.modal=null;
commitAtBatWithRunnerMoves(rm.rc, rm.sym, rm.sel, rm.moves, rm.extraOuts||0);
}
}

// 走者の確定した移動先を元にcommitAtBatを呼ぶ
function commitAtBatWithRunnerMoves(rc, sym, sel, moves, extraOuts){
var selWithMoves = Object.assign({}, sel, {runnerMoves: moves, extraOuts: extraOuts||0});
commitAtBat(rc, sym, selWithMoves);
}
